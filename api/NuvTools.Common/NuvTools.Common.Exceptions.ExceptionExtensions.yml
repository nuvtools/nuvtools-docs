  langs:
  - csharp
  - vb
  name: AggregateExceptionMessages(Exception, short)
  nameWithType: ExceptionExtensions.AggregateExceptionMessages(Exception, short)
  fullName: NuvTools.Common.Exceptions.ExceptionExtensions.AggregateExceptionMessages(System.Exception, short)
  type: Method
  source:
    href: https://github.com/nuvtools/nuvtools-common/blob/7b0a3f43086221e191600d76037ab1ac00397848/src/NuvTools.Common/Exceptions/ExceptionExtensions.cs
  assemblies:
  - NuvTools.Common
  namespace: NuvTools.Common.Exceptions
  summary: Aggregates exception messages including inner exceptions up to a specified level.
  remarks: >-
    When level is 0, only the top-level exception message is returned.

    When level is greater than 0, inner exceptions are included up to the specified depth,

    with each level clearly marked (e.g., "Level 0: ...", "Level 1: ...").
  example: []
  syntax:
    content: public static string AggregateExceptionMessages(this Exception exception, short level = 0)
    parameters:
    - id: exception
      type: System.Exception
      description: The exception to process.
    - id: level
      type: System.Int16
      description: The number of inner exception levels to include. Use 0 to include only the top-level exception message.
    return:
      type: System.String
      description: A formatted string containing the exception message(s) with level indicators.
    content.vb: Public Shared Function AggregateExceptionMessages(exception As Exception, level As Short = 0) As String
  overload: NuvTools.Common.Exceptions.ExceptionExtensions.AggregateExceptionMessages*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: Thrown when <code class="paramref">exception</code> is null.
