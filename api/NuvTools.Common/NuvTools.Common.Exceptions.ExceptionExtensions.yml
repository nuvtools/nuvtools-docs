- uid: NuvTools.Common.Exceptions.ExceptionExtensions.AggregateExceptionMessages(System.Exception,System.Int16)
  commentId: M:NuvTools.Common.Exceptions.ExceptionExtensions.AggregateExceptionMessages(System.Exception,System.Int16)
  id: AggregateExceptionMessages(System.Exception,System.Int16)
  isExtensionMethod: true
