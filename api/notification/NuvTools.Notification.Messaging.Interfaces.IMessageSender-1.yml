  namespace: NuvTools.Notification.Messaging.Interfaces
  summary: >-
    Represents an asynchronous sender capable of delivering messages whose bodies are of type <code class="typeparamref">TBody</code>.

    Implementations perform the transport-specific work to transmit a <xref href="NuvTools.Notification.Messaging.Message%601" data-throw-if-not-resolved="false"></xref>.
