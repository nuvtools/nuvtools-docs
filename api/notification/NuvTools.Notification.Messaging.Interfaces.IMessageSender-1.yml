  parent: NuvTools.Notification.Messaging.Interfaces.IMessageSender`1
  langs:
  - csharp
  - vb
  name: SendAsync(Message<TBody>, CancellationToken)
  nameWithType: IMessageSender<TBody>.SendAsync(Message<TBody>, CancellationToken)
  fullName: NuvTools.Notification.Messaging.Interfaces.IMessageSender<TBody>.SendAsync(NuvTools.Notification.Messaging.Message<TBody>, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Notification.Messaging
  namespace: NuvTools.Notification.Messaging.Interfaces
  summary: Sends the specified <code class="paramref">message</code> asynchronously.
  example: []
  syntax:
    content: Task SendAsync(Message<TBody> message, CancellationToken cancellationToken)
    parameters:
    - id: message
      type: NuvTools.Notification.Messaging.Message{{TBody}}
      description: The message to send. Implementations SHOULD validate that <code class="paramref">message</code> is not <code>null</code>.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A token to observe while waiting for the operation to complete.
    return:
      type: System.Threading.Tasks.Task
      description: A <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref> that represents the asynchronous send operation.
    content.vb: Function SendAsync(message As Message(Of TBody), cancellationToken As CancellationToken) As Task
  overload: NuvTools.Notification.Messaging.Interfaces.IMessageSender`1.SendAsync*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: May be thrown by implementations if <code class="paramref">message</code> is <code>null</code>.
  - type: System.OperationCanceledException
    commentId: T:System.OperationCanceledException
    description: May be thrown if the <code class="paramref">cancellationToken</code> is canceled before the operation completes.
  nameWithType.vb: IMessageSender(Of TBody).SendAsync(Message(Of TBody), CancellationToken)
