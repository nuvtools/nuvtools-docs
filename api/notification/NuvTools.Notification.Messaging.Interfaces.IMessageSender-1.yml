- uid: NuvTools.Notification.Messaging.Interfaces.IMessageSender`1.SendAsync(NuvTools.Notification.Messaging.Message{`0},System.Threading.CancellationToken)
  commentId: M:NuvTools.Notification.Messaging.Interfaces.IMessageSender`1.SendAsync(NuvTools.Notification.Messaging.Message{`0},System.Threading.CancellationToken)
