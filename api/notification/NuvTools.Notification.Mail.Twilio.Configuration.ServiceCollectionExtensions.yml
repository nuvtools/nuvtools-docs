- uid: NuvTools.Notification.Mail.Twilio.Configuration.ServiceCollectionExtensions.DefaultResilience
  commentId: F:NuvTools.Notification.Mail.Twilio.Configuration.ServiceCollectionExtensions.DefaultResilience
  id: DefaultResilience
  parent: NuvTools.Notification.Mail.Twilio.Configuration.ServiceCollectionExtensions
  langs:
  - csharp
  - vb
  name: DefaultResilience
  nameWithType: ServiceCollectionExtensions.DefaultResilience
  fullName: NuvTools.Notification.Mail.Twilio.Configuration.ServiceCollectionExtensions.DefaultResilience
  type: Field
  assemblies:
  - NuvTools.Notification.Mail.Twilio
  namespace: NuvTools.Notification.Mail.Twilio.Configuration
  summary: >-
    The default resilience policy applied to the Twilio Email client:

    2 retries with 1s delay, 30s per-attempt timeout, 60s circuit-breaker sampling,

    90s total request timeout.
  example: []
  syntax:
    content: public static readonly Action<HttpStandardResilienceOptions> DefaultResilience
    return:
      type: System.Action{Microsoft.Extensions.Http.Resilience.HttpStandardResilienceOptions}
    content.vb: Public Shared ReadOnly DefaultResilience As Action(Of HttpStandardResilienceOptions)
- uid: NuvTools.Notification.Mail.Twilio.Configuration.ServiceCollectionExtensions.AddTwilioMail(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String,System.Action{Microsoft.Extensions.Http.Resilience.HttpStandardResilienceOptions})
  commentId: M:NuvTools.Notification.Mail.Twilio.Configuration.ServiceCollectionExtensions.AddTwilioMail(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String,System.Action{Microsoft.Extensions.Http.Resilience.HttpStandardResilienceOptions})
  id: AddTwilioMail(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String,System.Action{Microsoft.Extensions.Http.Resilience.HttpStandardResilienceOptions})
  isExtensionMethod: true
  parent: NuvTools.Notification.Mail.Twilio.Configuration.ServiceCollectionExtensions
  langs:
  - csharp
  - vb
  name: AddTwilioMail(IServiceCollection, IConfiguration, string, Action<HttpStandardResilienceOptions>?)
  nameWithType: ServiceCollectionExtensions.AddTwilioMail(IServiceCollection, IConfiguration, string, Action<HttpStandardResilienceOptions>?)
  fullName: NuvTools.Notification.Mail.Twilio.Configuration.ServiceCollectionExtensions.AddTwilioMail(Microsoft.Extensions.DependencyInjection.IServiceCollection, Microsoft.Extensions.Configuration.IConfiguration, string, System.Action<Microsoft.Extensions.Http.Resilience.HttpStandardResilienceOptions>?)
  type: Method
  assemblies:
  - NuvTools.Notification.Mail.Twilio
  namespace: NuvTools.Notification.Mail.Twilio.Configuration
  summary: Registers and configures the Twilio Email service for options-based dependency injection.
  remarks: >-
    This method binds the specified configuration section to <xref href="NuvTools.Notification.Mail.Twilio.Configuration.TwilioMailConfigurationSection" data-throw-if-not-resolved="false"></xref>

    and registers <xref href="NuvTools.Notification.Mail.Twilio.TwilioMailService" data-throw-if-not-resolved="false"></xref> as a typed <xref href="System.Net.Http.HttpClient" data-throw-if-not-resolved="false"></xref> with the API base

    address, Basic authentication header and a standard resilience pipeline.

    The service is resolved as <xref href="NuvTools.Notification.Mail.IMailService" data-throw-if-not-resolved="false"></xref>, so the application layer depends only on the

    NuvTools.Notification.Mail abstraction.
  example: []
  syntax:
    content: public static IServiceCollection AddTwilioMail(this IServiceCollection services, IConfiguration configuration, string sectionName = "MailTwilio", Action<HttpStandardResilienceOptions>? configureResilience = null)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The <xref href="Microsoft.Extensions.DependencyInjection.IServiceCollection" data-throw-if-not-resolved="false"></xref> to which the services will be added.
    - id: configuration
      type: Microsoft.Extensions.Configuration.IConfiguration
      description: The application <xref href="Microsoft.Extensions.Configuration.IConfiguration" data-throw-if-not-resolved="false"></xref> instance containing the Twilio mail configuration section.
    - id: sectionName
      type: System.String
      description: The configuration section name to bind. Defaults to <code>"MailTwilio"</code>.
    - id: configureResilience
      type: System.Action{Microsoft.Extensions.Http.Resilience.HttpStandardResilienceOptions}
      description: Optional delegate to customize the resilience pipeline. Defaults to <xref href="NuvTools.Notification.Mail.Twilio.Configuration.ServiceCollectionExtensions.DefaultResilience" data-throw-if-not-resolved="false"></xref>.
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The updated <xref href="Microsoft.Extensions.DependencyInjection.IServiceCollection" data-throw-if-not-resolved="false"></xref> instance, enabling method chaining.
    content.vb: Public Shared Function AddTwilioMail(services As IServiceCollection, configuration As IConfiguration, sectionName As String = "MailTwilio", configureResilience As Action(Of HttpStandardResilienceOptions) = Nothing) As IServiceCollection
  overload: NuvTools.Notification.Mail.Twilio.Configuration.ServiceCollectionExtensions.AddTwilioMail*
  nameWithType.vb: ServiceCollectionExtensions.AddTwilioMail(IServiceCollection, IConfiguration, String, Action(Of HttpStandardResilienceOptions))
  fullName.vb: NuvTools.Notification.Mail.Twilio.Configuration.ServiceCollectionExtensions.AddTwilioMail(Microsoft.Extensions.DependencyInjection.IServiceCollection, Microsoft.Extensions.Configuration.IConfiguration, String, System.Action(Of Microsoft.Extensions.Http.Resilience.HttpStandardResilienceOptions))
  name.vb: AddTwilioMail(IServiceCollection, IConfiguration, String, Action(Of HttpStandardResilienceOptions))
