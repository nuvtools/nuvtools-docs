  name: TwilioMailConfigurationSection
  nameWithType: TwilioMailConfigurationSection
  fullName: NuvTools.Notification.Mail.Twilio.Configuration.TwilioMailConfigurationSection
  type: Class
  assemblies:
  - NuvTools.Notification.Mail.Twilio
  namespace: NuvTools.Notification.Mail.Twilio.Configuration
  summary: >-
    Contains the Twilio Email configuration that should be loaded from appsettings file.


    <p>The default section name is "MailTwilio"</p>
  remarks: >-
    Extends <xref href="NuvTools.Notification.Mail.Configuration.MailConfigurationSection" data-throw-if-not-resolved="false"></xref> with the Twilio Email API settings, inheriting the shared

    sender defaults. Credentials are sent using HTTP Basic authentication, where <xref href="NuvTools.Notification.Mail.Twilio.Configuration.TwilioMailConfigurationSection.AccountSid" data-throw-if-not-resolved="false"></xref> is

    the user name and <xref href="NuvTools.Notification.Mail.Twilio.Configuration.TwilioMailConfigurationSection.AuthToken" data-throw-if-not-resolved="false"></xref> is the password.
  example: []
  syntax:
    content: 'public class TwilioMailConfigurationSection : MailConfigurationSection'
    content.vb: Public Class TwilioMailConfigurationSection Inherits MailConfigurationSection
  inheritance:
  - System.Object
  - NuvTools.Notification.Mail.Configuration.MailConfigurationSection
