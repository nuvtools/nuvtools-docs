  type: Method
  assemblies:
  - NuvTools.Notification.Mail
  namespace: NuvTools.Notification.Mail
  summary: Send mail based on selected infraestructure.
  example: []
  syntax:
    content: Task<MailSendResult> SendAsync(MailMessage mailMessage, CancellationToken cancellationToken = default)
    parameters:
    - id: mailMessage
      type: NuvTools.Notification.Mail.MailMessage
      description: Message abstraction containg the content and its recipients.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: The token to monitor for cancellation requests.
    return:
      type: System.Threading.Tasks.Task{NuvTools.Notification.Mail.MailSendResult}
      description: The provider reference of the accepted send request.
    content.vb: Function SendAsync(mailMessage As MailMessage, cancellationToken As CancellationToken = Nothing) As Task(Of MailSendResult)
  overload: NuvTools.Notification.Mail.IMailService.SendAsync*
  exceptions:
  - type: System.NotSupportedException
    commentId: T:System.NotSupportedException
    description: >-
      Thrown when the message uses a feature the provider cannot honor, such as

