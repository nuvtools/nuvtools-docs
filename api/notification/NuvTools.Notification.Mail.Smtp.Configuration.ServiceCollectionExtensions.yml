- uid: NuvTools.Notification.Mail.Smtp.Configuration.ServiceCollectionExtensions.AddSmtpMail(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String)
  commentId: M:NuvTools.Notification.Mail.Smtp.Configuration.ServiceCollectionExtensions.AddSmtpMail(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String)
  id: AddSmtpMail(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String)
  isExtensionMethod: true
  parent: NuvTools.Notification.Mail.Smtp.Configuration.ServiceCollectionExtensions
  langs:
  - csharp
  - vb
  name: AddSmtpMail(IServiceCollection, IConfiguration, string)
  nameWithType: ServiceCollectionExtensions.AddSmtpMail(IServiceCollection, IConfiguration, string)
  fullName: NuvTools.Notification.Mail.Smtp.Configuration.ServiceCollectionExtensions.AddSmtpMail(Microsoft.Extensions.DependencyInjection.IServiceCollection, Microsoft.Extensions.Configuration.IConfiguration, string)
  type: Method
  assemblies:
  - NuvTools.Notification.Mail.Smtp
  namespace: NuvTools.Notification.Mail.Smtp.Configuration
  summary: Registers and configures the SMTP mail service for options-based dependency injection.
  remarks: >-
    This method binds the specified configuration section to <xref href="NuvTools.Notification.Mail.Smtp.Configuration.SmtpMailConfigurationSection" data-throw-if-not-resolved="false"></xref>

    and registers <xref href="NuvTools.Notification.Mail.Smtp.SMTPMailService" data-throw-if-not-resolved="false"></xref> as <xref href="NuvTools.Notification.Mail.IMailService" data-throw-if-not-resolved="false"></xref>, so the application layer

    depends only on the NuvTools.Notification.Mail abstraction.
  example: []
  syntax:
    content: public static IServiceCollection AddSmtpMail(this IServiceCollection services, IConfiguration configuration, string sectionName = "MailSmtp")
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The <xref href="Microsoft.Extensions.DependencyInjection.IServiceCollection" data-throw-if-not-resolved="false"></xref> to which the services will be added.
    - id: configuration
      type: Microsoft.Extensions.Configuration.IConfiguration
      description: The application <xref href="Microsoft.Extensions.Configuration.IConfiguration" data-throw-if-not-resolved="false"></xref> instance containing the SMTP configuration section.
    - id: sectionName
      type: System.String
      description: The configuration section name to bind. Defaults to <code>"MailSmtp"</code>.
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The updated <xref href="Microsoft.Extensions.DependencyInjection.IServiceCollection" data-throw-if-not-resolved="false"></xref> instance, enabling method chaining.
    content.vb: Public Shared Function AddSmtpMail(services As IServiceCollection, configuration As IConfiguration, sectionName As String = "MailSmtp") As IServiceCollection
