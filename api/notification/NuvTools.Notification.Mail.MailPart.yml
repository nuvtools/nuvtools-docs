  name: MailPart
  nameWithType: MailPart
  fullName: NuvTools.Notification.Mail.MailPart
  type: Class
  assemblies:
  - NuvTools.Notification.Mail
  namespace: NuvTools.Notification.Mail
  summary: Represents an email attachment with media type, extension, and content stream.
  remarks: >-
    This class is used to attach files to email messages. The content is provided as a stream,

    and both the media type and extension are required to properly identify the attachment format,

    while the file name identifies it to the recipient.
  example:
  - >-
    <pre><code class="lang-c#">var attachment = new MailPart

    {
        MediaType = "application",
        MediaExtension = "pdf",
        FileName = "invoice.pdf",
        Content = fileStream
    };</code></pre>
  syntax:
    content: public class MailPart
    content.vb: Public Class MailPart
