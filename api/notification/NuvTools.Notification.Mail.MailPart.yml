  fullName: NuvTools.Notification.Mail.MailPart.MediaExtension
  type: Property
  assemblies:
  - NuvTools.Notification.Mail
  namespace: NuvTools.Notification.Mail
  summary: Gets or sets the media subtype of the attachment (e.g., "pdf", "png", "plain").
  remarks: >-
    Combined with <xref href="NuvTools.Notification.Mail.MailPart.MediaType" data-throw-if-not-resolved="false"></xref> it forms the MIME type of the attachment, so it is the media

    subtype rather than the file extension. For a Word document, the subtype is

    "vnd.openxmlformats-officedocument.wordprocessingml.document" while the ".docx" extension belongs

    to <xref href="NuvTools.Notification.Mail.MailPart.FileName" data-throw-if-not-resolved="false"></xref>.
  example: []
