  type: Method
  assemblies:
  - NuvTools.Notification.Mail.Twilio
  namespace: NuvTools.Notification.Mail.Twilio
  summary: Sends an email message asynchronously using the Twilio Email API.
  remarks: >-
    The returned result means the request was accepted for processing. The delivery status can be

    tracked through <xref href="NuvTools.Notification.Mail.MailSendResult.TrackingLocation" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public Task<MailSendResult> SendAsync(MailMessage mailMessage, CancellationToken cancellationToken = default)
    parameters:
    - id: mailMessage
      type: NuvTools.Notification.Mail.MailMessage
      description: The mail message to send, including sender, recipients, subject, body, and optional attachments.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: The token to monitor for cancellation requests.
    return:
      type: System.Threading.Tasks.Task{NuvTools.Notification.Mail.MailSendResult}
      description: The identifier of the asynchronous operation created by the API, along with the URL to track it.
    content.vb: Public Function SendAsync(mailMessage As MailMessage, cancellationToken As CancellationToken = Nothing) As Task(Of MailSendResult)
