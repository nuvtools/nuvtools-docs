  name: TwilioMailService
  nameWithType: TwilioMailService
  fullName: NuvTools.Notification.Mail.Twilio.TwilioMailService
  type: Class
  assemblies:
  - NuvTools.Notification.Mail.Twilio
  namespace: NuvTools.Notification.Mail.Twilio
  summary: Twilio Email API implementation of <xref href="NuvTools.Notification.Mail.IMailService" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    This service posts messages to the Twilio Email endpoint (<code>POST /v1/Emails</code>), which processes

    requests asynchronously and answers with <code>202 Accepted</code> plus an operation identifier.

    It supports HTML and plain text content, Base64 attachments, inline images, custom headers, tags,

    Liquid personalization variables and scheduled delivery.

    Register it through <xref href="NuvTools.Notification.Mail.Twilio.Configuration.ServiceCollectionExtensions.AddTwilioMail(Microsoft.Extensions.DependencyInjection.IServiceCollection%2cMicrosoft.Extensions.Configuration.IConfiguration%2cSystem.String%2cSystem.Action%7bMicrosoft.Extensions.Http.Resilience.HttpStandardResilienceOptions%7d)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: 'public class TwilioMailService : IMailService'
    content.vb: Public Class TwilioMailService Implements IMailService
