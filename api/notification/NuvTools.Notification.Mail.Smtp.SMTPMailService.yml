- uid: NuvTools.Notification.Mail.Smtp.SMTPMailService
  commentId: T:NuvTools.Notification.Mail.Smtp.SMTPMailService
  id: SMTPMailService
  parent: NuvTools.Notification.Mail.Smtp
  children:
  - NuvTools.Notification.Mail.Smtp.SMTPMailService.#ctor(Microsoft.Extensions.Options.IOptions{NuvTools.Notification.Mail.Smtp.Configuration.SmtpMailConfigurationSection})
  - NuvTools.Notification.Mail.Smtp.SMTPMailService.SendAsync(NuvTools.Notification.Mail.MailMessage,System.Threading.CancellationToken)
  langs:
  - csharp
  - vb
  name: SMTPMailService
  nameWithType: SMTPMailService
  fullName: NuvTools.Notification.Mail.Smtp.SMTPMailService
  type: Class
  assemblies:
  - NuvTools.Notification.Mail.Smtp
  namespace: NuvTools.Notification.Mail.Smtp
  summary: SMTP implementation of <xref href="NuvTools.Notification.Mail.IMailService" data-throw-if-not-resolved="false"></xref> using MailKit for sending email messages.
  remarks: >-
    This service uses the MailKit library to send emails via SMTP protocol.

    It supports HTML and plain text body content, custom headers, multiple recipients, file attachments

    and inline images.

    The SMTP connection is configured using settings from <xref href="NuvTools.Notification.Mail.Smtp.Configuration.SmtpMailConfigurationSection" data-throw-if-not-resolved="false"></xref>, and the

    server TLS certificate is validated unless <xref href="NuvTools.Notification.Mail.Smtp.Configuration.SmtpMailConfigurationSection.AllowInvalidCertificates" data-throw-if-not-resolved="false"></xref>

    is explicitly enabled.
  example: []
  syntax:
    content: 'public class SMTPMailService : IMailService'
    content.vb: Public Class SMTPMailService Implements IMailService
  inheritance:
