    It supports HTML and plain text body content, custom headers, multiple recipients, file attachments

    and inline images.

    The SMTP connection is configured using settings from <xref href="NuvTools.Notification.Mail.Smtp.Configuration.SmtpMailConfigurationSection" data-throw-if-not-resolved="false"></xref>, and the

    server TLS certificate is validated unless <xref href="NuvTools.Notification.Mail.Smtp.Configuration.SmtpMailConfigurationSection.AllowInvalidCertificates" data-throw-if-not-resolved="false"></xref>

    is explicitly enabled.
