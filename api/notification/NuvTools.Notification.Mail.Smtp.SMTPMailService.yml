- uid: NuvTools.Notification.Mail.Smtp.SMTPMailService.SendAsync(NuvTools.Notification.Mail.MailMessage,System.Threading.CancellationToken)
  commentId: M:NuvTools.Notification.Mail.Smtp.SMTPMailService.SendAsync(NuvTools.Notification.Mail.MailMessage,System.Threading.CancellationToken)
  id: SendAsync(NuvTools.Notification.Mail.MailMessage,System.Threading.CancellationToken)
  parent: NuvTools.Notification.Mail.Smtp.SMTPMailService
  langs:
  - csharp
  - vb
  name: SendAsync(MailMessage, CancellationToken)
  nameWithType: SMTPMailService.SendAsync(MailMessage, CancellationToken)
  fullName: NuvTools.Notification.Mail.Smtp.SMTPMailService.SendAsync(NuvTools.Notification.Mail.MailMessage, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Notification.Mail.Smtp
  namespace: NuvTools.Notification.Mail.Smtp
  summary: Sends an email message asynchronously using the configured SMTP server.
  remarks: >-
    This method constructs a MIME message from the provided <code class="paramref">request</code>, connects to the SMTP server,

    authenticates using the configured credentials, sends the message, and disconnects.

    If the message includes attachments via <xref href="NuvTools.Notification.Mail.MailMessage.Parts" data-throw-if-not-resolved="false"></xref>, they are added as MIME attachments

    named after <xref href="NuvTools.Notification.Mail.MailPart.FileName" data-throw-if-not-resolved="false"></xref>, or embedded inline when <xref href="NuvTools.Notification.Mail.MailPart.ContentId" data-throw-if-not-resolved="false"></xref> is informed.

    The sender address and display name can be overridden per message or fall back to configuration defaults.
  example: []
  syntax:
    content: public Task<MailSendResult> SendAsync(MailMessage request, CancellationToken cancellationToken = default)
    parameters:
    - id: request
      type: NuvTools.Notification.Mail.MailMessage
      description: The mail message to send, including sender, recipients, subject, body, and optional attachments.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: The token to monitor for cancellation requests.
    return:
      type: System.Threading.Tasks.Task{NuvTools.Notification.Mail.MailSendResult}
      description: The Message-ID assigned to the delivered message.
    content.vb: Public Function SendAsync(request As MailMessage, cancellationToken As CancellationToken = Nothing) As Task(Of MailSendResult)
  overload: NuvTools.Notification.Mail.Smtp.SMTPMailService.SendAsync*
  exceptions:
  - type: System.NotSupportedException
    commentId: T:System.NotSupportedException
    description: >-
      Thrown when the message requires provider features SMTP has no equivalent for, namely

      <xref href="NuvTools.Notification.Mail.MailMessage.ScheduledFor" data-throw-if-not-resolved="false"></xref>, <xref href="NuvTools.Notification.Mail.MailMessage.Tags" data-throw-if-not-resolved="false"></xref> and <xref href="NuvTools.Notification.Mail.MailAddress.Variables" data-throw-if-not-resolved="false"></xref>.

      Failing is preferred over delivering the message immediately, untagged or with unresolved placeholders.
  implements:
  - NuvTools.Notification.Mail.IMailService.SendAsync(NuvTools.Notification.Mail.MailMessage,System.Threading.CancellationToken)
