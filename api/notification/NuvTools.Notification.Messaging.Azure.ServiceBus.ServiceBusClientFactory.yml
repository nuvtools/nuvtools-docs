  namespace: NuvTools.Notification.Messaging.Azure.ServiceBus
  summary: Creates a client for the supplied configuration section.
  example: []
  syntax:
    content: public static ServiceBusClient Create(MessagingSection section, TokenCredential? credential = null)
    parameters:
    - id: section
      type: NuvTools.Notification.Messaging.Configuration.MessagingSection
      description: The messaging configuration section.
    - id: credential
      type: Azure.Core.TokenCredential
      description: >-
        Credential to use when <xref href="NuvTools.Notification.Messaging.Configuration.MessagingSection.FullyQualifiedNamespace" data-throw-if-not-resolved="false"></xref> authentication applies.

        When null, a <xref href="Azure.Identity.DefaultAzureCredential" data-throw-if-not-resolved="false"></xref> is built from

        <xref href="NuvTools.Notification.Messaging.Configuration.MessagingSection.ManagedIdentityClientId" data-throw-if-not-resolved="false"></xref>.
    return:
      type: Azure.Messaging.ServiceBus.ServiceBusClient
      description: A client authenticated by connection string or by Entra ID credential.
    content.vb: Public Shared Function Create(section As MessagingSection, credential As TokenCredential = Nothing) As ServiceBusClient
