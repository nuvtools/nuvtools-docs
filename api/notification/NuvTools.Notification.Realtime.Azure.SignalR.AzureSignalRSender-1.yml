  namespace: NuvTools.Notification.Realtime.Azure.SignalR
  summary: Sends a message asynchronously to all connected SignalR clients.
  remarks: >-
    The message is sent using the method name "Consume_{TypeName}" where {TypeName} is the name of type <code class="typeparamref">T</code>.

    All connected clients that have registered a handler for this method will receive the message.
  example: []
  syntax:
    content: public Task SendAsync(T message, CancellationToken cancellationToken)
    parameters:
    - id: message
      type: '{T}'
      description: The message to broadcast to all clients.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A token to observe while waiting for the operation to complete.
    return:
      type: System.Threading.Tasks.Task
      description: A task representing the asynchronous send operation.
    content.vb: Public Function SendAsync(message As T, cancellationToken As CancellationToken) As Task
