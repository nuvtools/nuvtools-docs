  - NuvTools.Notification.Mail
  namespace: NuvTools.Notification.Mail
  summary: Gets or sets the optional date and time when the email should be delivered.
  remarks: >-
    When <code>null</code>, the email is sent immediately. Providers with no scheduling support throw

    <xref href="System.NotSupportedException" data-throw-if-not-resolved="false"></xref> instead of delivering the message immediately.
