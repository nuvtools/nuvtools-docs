  langs:
  - csharp
  - vb
  name: MailMessage
  nameWithType: MailMessage
  fullName: NuvTools.Notification.Mail.MailMessage
  type: Class
  assemblies:
  - NuvTools.Notification.Mail
  namespace: NuvTools.Notification.Mail
  summary: Represents an email message with sender, recipients, subject, body, and optional attachments.
  remarks: >-
    This class serves as the abstraction for composing email messages across different mail providers.

    It supports HTML body content and optional attachments through the <xref href="NuvTools.Notification.Mail.MailMessage.Parts" data-throw-if-not-resolved="false"></xref> property.

    Features not supported by every provider (<xref href="NuvTools.Notification.Mail.MailMessage.Tags" data-throw-if-not-resolved="false"></xref>, <xref href="NuvTools.Notification.Mail.MailMessage.ScheduledFor" data-throw-if-not-resolved="false"></xref>) are declared here

    so the application layer never depends on a provider specific package. Implementations that cannot honor

    them throw <xref href="System.NotSupportedException" data-throw-if-not-resolved="false"></xref> rather than silently ignoring the request.
  example: []
  syntax:
    content: public class MailMessage
    content.vb: Public Class MailMessage
  inheritance:
