  name: Message<T>
  nameWithType: Message<T>
  fullName: NuvTools.Notification.Messaging.Message<T>
  type: Class
  assemblies:
  - NuvTools.Notification.Messaging
  namespace: NuvTools.Notification.Messaging
  summary: Represents a message envelope that wraps a strongly-typed payload and common messaging metadata.
  remarks: >-
    This class is intended as a lightweight envelope used by message producers and consumers within

    the NuvTools.Notification.Messaging library. It carries the payload in <xref href="NuvTools.Notification.Messaging.Message%601.Body" data-throw-if-not-resolved="false"></xref> and common

    metadata such as <xref href="NuvTools.Notification.Messaging.Message%601.MessageId" data-throw-if-not-resolved="false"></xref>, <xref href="NuvTools.Notification.Messaging.Message%601.CorrelationId" data-throw-if-not-resolved="false"></xref>, <xref href="NuvTools.Notification.Messaging.Message%601.Subject" data-throw-if-not-resolved="false"></xref>,

    <xref href="NuvTools.Notification.Messaging.Message%601.TimeToLive" data-throw-if-not-resolved="false"></xref>, and a flexible <xref href="NuvTools.Notification.Messaging.Message%601.Properties" data-throw-if-not-resolved="false"></xref> map for custom headers.


    The default constructor generates a new <xref href="NuvTools.Notification.Messaging.Message%601.MessageId" data-throw-if-not-resolved="false"></xref>. The class itself does not impose

    any serialization or transport requirements — those are handled by the concrete sender/consumer

    implementations.
  example:
  - >-
    <pre><code class="lang-c#">var msg = new Message&lt;Order&gt;(order)

    {
        Subject = "order.created",
        CorrelationId = correlationId,
        TimeToLive = TimeSpan.FromMinutes(30),
        Properties = { ["priority"] = "high" }
    };</code></pre>
  syntax:
    content: 'public class Message<T> where T : class'
    typeParameters:
    - id: T
      description: The type of the message body. Must be a reference type.
    content.vb: Public Class Message(Of T As Class)
