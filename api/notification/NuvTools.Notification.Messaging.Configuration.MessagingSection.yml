  name: MessagingSection
  nameWithType: MessagingSection
  fullName: NuvTools.Notification.Messaging.Configuration.MessagingSection
  type: Class
  assemblies:
  - NuvTools.Notification.Messaging
  namespace: NuvTools.Notification.Messaging.Configuration
  summary: >-
    Represents the configuration settings for a messaging queue, including its name, connection details,

    subscription name, and various operational parameters.
  remarks: >-
    This class is typically used to bind configuration sections from appsettings or other configuration sources

    for messaging queue consumers or producers.


    <p>

    Connectivity is declared either with <xref href="NuvTools.Notification.Messaging.Configuration.MessagingSection.ConnectionString" data-throw-if-not-resolved="false"></xref> (shared access key) or with

    <xref href="NuvTools.Notification.Messaging.Configuration.MessagingSection.FullyQualifiedNamespace" data-throw-if-not-resolved="false"></xref> (Entra ID credential). When both are present the connection string wins.

    </p>
