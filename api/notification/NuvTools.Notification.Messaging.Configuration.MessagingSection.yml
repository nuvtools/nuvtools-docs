  - NuvTools.Notification.Messaging
  namespace: NuvTools.Notification.Messaging.Configuration
  summary: >-
    Gets or sets the client ID of the user-assigned managed identity to authenticate with when

    <xref href="NuvTools.Notification.Messaging.Configuration.MessagingSection.FullyQualifiedNamespace" data-throw-if-not-resolved="false"></xref> is used and no explicit credential is supplied.

    Leave empty to use the identity named by the <code>AZURE_CLIENT_ID</code> environment variable, then the

    system-assigned identity or the ambient developer credential.
