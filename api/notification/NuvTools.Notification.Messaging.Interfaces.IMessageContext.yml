  - NuvTools.Notification.Messaging
  namespace: NuvTools.Notification.Messaging.Interfaces
  summary: Marks the message as successfully processed and removes it from the queue.
  example: []
  syntax:
    content: Task CompleteAsync(CancellationToken cancellationToken = default)
    parameters:
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A token to observe while waiting for the operation to complete.
    return:
      type: System.Threading.Tasks.Task
      description: A task representing the asynchronous complete operation.
