  id: DeadLetterAsync(System.String,System.String,System.Threading.CancellationToken)
  parent: NuvTools.Notification.Messaging.Interfaces.IMessageContext
  langs:
  - csharp
  - vb
  name: DeadLetterAsync(string, string?, CancellationToken)
  nameWithType: IMessageContext.DeadLetterAsync(string, string?, CancellationToken)
  fullName: NuvTools.Notification.Messaging.Interfaces.IMessageContext.DeadLetterAsync(string, string?, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Notification.Messaging
  namespace: NuvTools.Notification.Messaging.Interfaces
  summary: Moves the message to the dead-letter queue with a specified reason and optional error description.
  example: []
  syntax:
    content: Task DeadLetterAsync(string reason, string? errorDescription = null, CancellationToken cancellationToken = default)
    parameters:
    - id: reason
      type: System.String
      description: The reason why the message is being dead-lettered.
    - id: errorDescription
      type: System.String
      description: Optional detailed description of the error that caused the message to be dead-lettered.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A token to observe while waiting for the operation to complete.
    return:
      type: System.Threading.Tasks.Task
      description: A task representing the asynchronous dead-letter operation.
    content.vb: Function DeadLetterAsync(reason As String, errorDescription As String = Nothing, cancellationToken As CancellationToken = Nothing) As Task
