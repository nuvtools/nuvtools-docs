  type: Class
  assemblies:
  - NuvTools.Notification.Realtime.Azure.SignalR
  namespace: NuvTools.Notification.Realtime.Azure.SignalR
  summary: SignalR hub for real-time message broadcasting.
  remarks: >-
    This hub serves as the connection point for SignalR clients.

    It is used by <xref href="NuvTools.Notification.Realtime.Azure.SignalR.AzureSignalRSender%601" data-throw-if-not-resolved="false"></xref> to broadcast messages to connected clients.

    Register this hub in your application startup using <code>app.MapHub&lt;SignalRHub&gt;("/hub-endpoint")</code>.
