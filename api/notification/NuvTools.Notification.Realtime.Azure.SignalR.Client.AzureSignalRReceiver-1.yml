  name: DebounceDelay
  nameWithType: AzureSignalRReceiver<T>.DebounceDelay
  fullName: NuvTools.Notification.Realtime.Azure.SignalR.Client.AzureSignalRReceiver<T>.DebounceDelay
  type: Property
  assemblies:
  - NuvTools.Notification.Realtime.Azure.SignalR.Client
  namespace: NuvTools.Notification.Realtime.Azure.SignalR.Client
  summary: >-
    Gets or sets the debounce delay to prevent rapid-fire message handling.

    Default is 1000 milliseconds (1 second).
  remarks: >-
    When multiple messages arrive in quick succession, only the last message within the debounce window

    will trigger the <xref href="NuvTools.Notification.Realtime.Azure.SignalR.Client.AzureSignalRReceiver%601.MessageReceived" data-throw-if-not-resolved="false"></xref> event.
  example: []
  syntax:
