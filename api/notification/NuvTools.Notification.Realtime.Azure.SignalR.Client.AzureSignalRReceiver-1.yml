  - NuvTools.Notification.Realtime.Azure.SignalR.Client
  namespace: NuvTools.Notification.Realtime.Azure.SignalR.Client
  summary: SignalR client for receiving real-time messages from an Azure SignalR hub with debouncing support.
  remarks: >-
    This receiver establishes a connection to a SignalR hub and listens for messages of type <code class="typeparamref">T</code>.

    It includes built-in debouncing to prevent rapid-fire message handling and supports automatic reconnection.

    The receiver listens for messages on a method named "Consume_{TypeName}" where {TypeName} is the name of type <code class="typeparamref">T</code>.
  example: []
  syntax:
    content: 'public class AzureSignalRReceiver<T> : IDisposable'
    typeParameters:
    - id: T
      description: The type of message to receive.
    content.vb: Public Class AzureSignalRReceiver(Of T) Implements IDisposable
