- uid: NuvTools.Notification.Mail.Smtp.Configuration.SmtpMailConfigurationSection.AllowInvalidCertificates
  commentId: P:NuvTools.Notification.Mail.Smtp.Configuration.SmtpMailConfigurationSection.AllowInvalidCertificates
  id: AllowInvalidCertificates
  parent: NuvTools.Notification.Mail.Smtp.Configuration.SmtpMailConfigurationSection
  langs:
  - csharp
  - vb
  name: AllowInvalidCertificates
  nameWithType: SmtpMailConfigurationSection.AllowInvalidCertificates
  fullName: NuvTools.Notification.Mail.Smtp.Configuration.SmtpMailConfigurationSection.AllowInvalidCertificates
  type: Property
  assemblies:
  - NuvTools.Notification.Mail.Smtp
  namespace: NuvTools.Notification.Mail.Smtp.Configuration
  summary: >-
    Gets or sets a value indicating whether the server TLS certificate is accepted without validation.

    Defaults to <code>false</code>.
  remarks: >-
    <p>

    Enabling this option disables certificate chain, name and expiration checks, which exposes the

    connection — and therefore the credentials sent over it — to man-in-the-middle attacks.

    </p>

    <p>

    Intended only for development environments with self-signed certificates. Never enable it in production.

    </p>
  example: []
  syntax:
    content: public bool AllowInvalidCertificates { get; set; }
    parameters: []
    return:
      type: System.Boolean
    content.vb: Public Property AllowInvalidCertificates As Boolean
  overload: NuvTools.Notification.Mail.Smtp.Configuration.SmtpMailConfigurationSection.AllowInvalidCertificates*
