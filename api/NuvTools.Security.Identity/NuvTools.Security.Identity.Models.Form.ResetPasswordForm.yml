  summary: Represents the form data for resetting a user's password using a reset token.
  remarks: >-
    This form is used to complete the password reset process after a user has requested

    a password reset via <xref href="NuvTools.Security.Identity.Models.Form.ForgotPasswordForm" data-throw-if-not-resolved="false"></xref>.

    The token is typically sent via email and must be provided along with the new password.
