  summary: Reads an entry from the ledger.
  example: []
  syntax:
    content: 'Task<LedgerEntry<T>?> ReadAsync<T>(string transactionId, string? collectionId = null, int maxRetries = 10, int delayMilliseconds = 500, CancellationToken cancellationToken = default) where T : class'
    parameters:
    - id: transactionId
      type: System.String
      description: The transaction ID to read.
    - id: collectionId
      type: System.String
      description: Optional collection/sub-ledger identifier.
    - id: maxRetries
      type: System.Int32
      description: Maximum retry attempts for pending entries.
    - id: delayMilliseconds
      type: System.Int32
      description: Base delay between retries in milliseconds.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Cancellation token.
    typeParameters:
    - id: T
      description: The type of the entry content.
    return:
      type: System.Threading.Tasks.Task{NuvTools.Blockchain.LedgerEntry{{T}}}
      description: The ledger entry if found; otherwise, null.
