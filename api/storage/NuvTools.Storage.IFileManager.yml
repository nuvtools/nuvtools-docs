  summary: Lists the files whose path starts with a prefix, without downloading them.
  example: []
  syntax:
    content: IAsyncEnumerable<FileDescriptor> ListFilesAsync(string? prefix = null, CancellationToken cancellationToken = default)
    parameters:
    - id: prefix
      type: System.String
      description: >-
        The beginning of the paths to list, such as <code>invoices/2026/</code>. A repository has no real

