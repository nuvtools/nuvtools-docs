  commentId: M:NuvTools.Storage.IFileManager.MoveFileAsync(System.String,System.String,System.Threading.CancellationToken)
  id: MoveFileAsync(System.String,System.String,System.Threading.CancellationToken)
  parent: NuvTools.Storage.IFileManager
  langs:
  - csharp
  - vb
  name: MoveFileAsync(string, string, CancellationToken)
  nameWithType: IFileManager.MoveFileAsync(string, string, CancellationToken)
  fullName: NuvTools.Storage.IFileManager.MoveFileAsync(string, string, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Storage
  namespace: NuvTools.Storage
  summary: Moves a file to another path in the same repository, which is also how a file is renamed.
  remarks: >-
    The file is copied and then the original is removed. If the removal fails the file exists at

    both paths; it is never lost.
  example: []
  syntax:
    content: Task<IFile> MoveFileAsync(string sourcePath, string targetPath, CancellationToken cancellationToken = default)
    parameters:
    - id: sourcePath
      type: System.String
      description: The path of the file to move.
    - id: targetPath
      type: System.String
      description: The new path of the file. What is there is replaced.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A token to cancel the asynchronous operation.
    return:
      type: System.Threading.Tasks.Task{NuvTools.Storage.IFile}
      description: A task representing the asynchronous operation, containing the metadata of the file at its new path.
    content.vb: Function MoveFileAsync(sourcePath As String, targetPath As String, cancellationToken As CancellationToken = Nothing) As Task(Of IFile)
  overload: NuvTools.Storage.IFileManager.MoveFileAsync*
  exceptions:
  - type: System.IO.FileNotFoundException
    commentId: T:System.IO.FileNotFoundException
    description: Thrown when <code class="paramref">sourcePath</code> does not exist.
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: Thrown when both paths are the same.
  nameWithType.vb: IFileManager.MoveFileAsync(String, String, CancellationToken)
  fullName.vb: NuvTools.Storage.IFileManager.MoveFileAsync(String, String, System.Threading.CancellationToken)
  name.vb: MoveFileAsync(String, String, CancellationToken)
- uid: NuvTools.Storage.IFileManager.MoveFilesAsync(System.String,System.String,System.Threading.CancellationToken)
  commentId: M:NuvTools.Storage.IFileManager.MoveFilesAsync(System.String,System.String,System.Threading.CancellationToken)
  id: MoveFilesAsync(System.String,System.String,System.Threading.CancellationToken)
  parent: NuvTools.Storage.IFileManager
  langs:
  - csharp
  - vb
  name: MoveFilesAsync(string, string, CancellationToken)
  nameWithType: IFileManager.MoveFilesAsync(string, string, CancellationToken)
  fullName: NuvTools.Storage.IFileManager.MoveFilesAsync(string, string, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Storage
  namespace: NuvTools.Storage
  summary: >-
    Moves every file whose path starts with a prefix to another prefix, keeping the rest of each

    path — which is how a folder is renamed.
  remarks: >-
    Files are moved one at a time. If it stops midway, the files already moved stay at the target

    and the others at the source; running it again finishes the move.
  example: []
  syntax:
    content: Task<int> MoveFilesAsync(string sourcePrefix, string targetPrefix, CancellationToken cancellationToken = default)
    parameters:
    - id: sourcePrefix
      type: System.String
      description: The beginning of the paths to move, such as <code>drafts/</code>.
    - id: targetPrefix
      type: System.String
      description: What replaces <code class="paramref">sourcePrefix</code> in each path, such as <code>final/</code>.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A token to cancel the asynchronous operation.
    return:
      type: System.Threading.Tasks.Task{System.Int32}
      description: A task representing the asynchronous operation, containing the number of files moved.
    content.vb: Function MoveFilesAsync(sourcePrefix As String, targetPrefix As String, cancellationToken As CancellationToken = Nothing) As Task(Of Integer)
  overload: NuvTools.Storage.IFileManager.MoveFilesAsync*
  exceptions:
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: Thrown when a prefix is empty or both are the same.
  nameWithType.vb: IFileManager.MoveFilesAsync(String, String, CancellationToken)
  fullName.vb: NuvTools.Storage.IFileManager.MoveFilesAsync(String, String, System.Threading.CancellationToken)
  name.vb: MoveFilesAsync(String, String, CancellationToken)
