  summary: Merges multiple PDF documents into a single PDF document.
  example: []
  syntax:
    content: public byte[] Merge(IEnumerable<byte[]> pdfs)
    parameters:
    - id: pdfs
      type: System.Collections.Generic.IEnumerable{System.Byte[]}
      description: An enumerable collection of PDF documents represented as byte arrays.
