  fullName: NuvTools.Report.Sheet.Csv.ICsvExporter.ExportFirstSheetToCsv(NuvTools.Report.Table.Models.Document, NuvTools.Report.Sheet.Csv.CsvDelimiter, string?, bool, bool)
  type: Method
  assemblies:
  - NuvTools.Report
  namespace: NuvTools.Report.Sheet.Csv
  summary: Exports the first table in a document to a CSV file encoded as a base64 string.
  example: []
  syntax:
    content: string ExportFirstSheetToCsv(Document document, CsvDelimiter delimiter = CsvDelimiter.Comma, string? customDelimiter = null, bool includeHeader = true, bool sanitizeDelimiter = true)
    parameters:
    - id: document
      type: NuvTools.Report.Table.Models.Document
      description: The document containing the table to export.
    - id: delimiter
      type: NuvTools.Report.Sheet.Csv.CsvDelimiter
      description: The delimiter to use. Defaults to <xref href="NuvTools.Report.Sheet.Csv.CsvDelimiter.Comma" data-throw-if-not-resolved="false"></xref>.
    - id: customDelimiter
      type: System.String
      description: A custom delimiter string, required when <code class="paramref">delimiter</code> is <xref href="NuvTools.Report.Sheet.Csv.CsvDelimiter.Custom" data-throw-if-not-resolved="false"></xref>.
    - id: includeHeader
      type: System.Boolean
      description: Whether to include the header row with column labels. Defaults to <code>true</code>.
    - id: sanitizeDelimiter
      type: System.Boolean
      description: Whether to remove occurrences of the delimiter from header labels and cell values to prevent CSV corruption. Defaults to <code>true</code>.
    return:
      type: System.String
      description: A base64-encoded CSV string of the first table.
    content.vb: Function ExportFirstSheetToCsv(document As Document, delimiter As CsvDelimiter = CsvDelimiter.Comma, customDelimiter As String = Nothing, includeHeader As Boolean = True, sanitizeDelimiter As Boolean = True) As String
