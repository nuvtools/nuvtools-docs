  type: Class
  assemblies:
  - NuvTools.AspNetCore.Blazor.MudBlazor
  namespace: NuvTools.AspNetCore.Blazor.MudBlazor.Converters
  summary: Pattern-based string converter for MudBlazor input components.
  remarks: >-
    <p>Pattern characters:</p>

    <ul><li><code>A</code> - Alphanumeric (letters and digits)</li><li><code>N</code> - Numeric (digits only)</li><li><code>L</code> - Letter (letters only)</li></ul>

    <p>Any other character in the pattern is treated as a literal separator.</p>
  example:
  - >-
    <pre><code class="lang-csharp">// Phone number: (NN) NNNNN-NNNN

    var phoneConverter = new PatternStringConverter("(NN) NNNNN-NNNN");


    // License plate: LLL-NANN

    var plateConverter = new PatternStringConverter("LLL-NANN");</code></pre>
  syntax:
    content: 'public class PatternStringConverter : DeferredConverter<string?, string?>, IReversibleConverter<string?, string?>, IConverter<string?, string?>'
    content.vb: Public Class PatternStringConverter Inherits DeferredConverter(Of String, String) Implements IReversibleConverter(Of String, String), IConverter(Of String, String)
