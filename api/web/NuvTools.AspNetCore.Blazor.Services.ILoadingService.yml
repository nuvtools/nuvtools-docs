  type: Interface
  assemblies:
  - NuvTools.AspNetCore.Blazor
  namespace: NuvTools.AspNetCore.Blazor.Services
  summary: Provides a service for managing loading indicator state.
  remarks: >-
    <p>

    Use this service to coordinate loading overlays across components.

    Register as scoped in DI and inject where needed.

    </p>

    <example>


    <pre><code class="lang-csharp">@inject ILoadingService LoadingService


    &lt;div class="loading-overlay" style="display: @(LoadingService.IsLoading ? "block" : "none")"&gt;
        Loading...
    &lt;/div&gt;


    @code {
        protected override void OnInitialized()
        {
            LoadingService.OnChange += StateHasChanged;
        }

        public void Dispose()
        {
            LoadingService.OnChange -= StateHasChanged;
        }
    }</code></pre>


    </example>
  example: []
  syntax:
    content: public interface ILoadingService
    content.vb: Public Interface ILoadingService
