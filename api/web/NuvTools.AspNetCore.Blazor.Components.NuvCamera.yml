  langs:
  - csharp
  - vb
  name: NuvCamera
  nameWithType: NuvCamera
  fullName: NuvTools.AspNetCore.Blazor.Components.NuvCamera
  type: Class
  assemblies:
  - NuvTools.AspNetCore.Blazor
  namespace: NuvTools.AspNetCore.Blazor.Components
  summary: Renders a live camera preview and captures frames from it.
  remarks: >-
    The component owns the <code>&lt;video&gt;</code> and the capture <code>&lt;canvas&gt;</code>, and keeps its own

    media stream — several instances can run side by side. It renders no layout and no styling of its

    own: size it through <xref href="NuvTools.AspNetCore.Blazor.Components.NuvCamera.Class" data-throw-if-not-resolved="false"></xref>/<xref href="NuvTools.AspNetCore.Blazor.Components.NuvCamera.Style" data-throw-if-not-resolved="false"></xref> and draw guides through

    <xref href="NuvTools.AspNetCore.Blazor.Components.NuvCamera.Overlay" data-throw-if-not-resolved="false"></xref>. Capture the component with <code>@ref</code> to drive it.
  example:
  - >-
    <pre><code class="lang-csharp">&lt;NuvCamera @ref="_camera" FacingMode="CameraFacingMode.Environment"
               Style="width:400px;height:300px" OnError="ShowCameraError" /&gt;

    @code {
        private NuvCamera _camera = default!;

        private async Task ScanAsync()
        {
            var capture = await _camera.CaptureAsync();
            if (capture is not null) await ReadAsync(capture.Base64);
        }
    }</code></pre>
