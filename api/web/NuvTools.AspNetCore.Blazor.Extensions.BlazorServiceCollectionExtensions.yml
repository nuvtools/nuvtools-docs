  nameWithType: BlazorServiceCollectionExtensions.AddBlazorServices(IServiceCollection)
  fullName: NuvTools.AspNetCore.Blazor.Extensions.BlazorServiceCollectionExtensions.AddBlazorServices(Microsoft.Extensions.DependencyInjection.IServiceCollection)
  type: Method
  assemblies:
  - NuvTools.AspNetCore.Blazor
  namespace: NuvTools.AspNetCore.Blazor.Extensions
  summary: >-
    Adds all Blazor services to the service collection as scoped services.

    This includes <xref href="NuvTools.AspNetCore.Blazor.JSInterop.IClipboardService" data-throw-if-not-resolved="false"></xref>, <xref href="NuvTools.AspNetCore.Blazor.JSInterop.ILocalStorageService" data-throw-if-not-resolved="false"></xref>,

    <xref href="NuvTools.AspNetCore.Blazor.JSInterop.ISessionStorageService" data-throw-if-not-resolved="false"></xref>, <xref href="NuvTools.AspNetCore.Blazor.Services.ILoadingService" data-throw-if-not-resolved="false"></xref>, <xref href="NuvTools.AspNetCore.Blazor.JSInterop.IDownloadFileService" data-throw-if-not-resolved="false"></xref>,

    and <xref href="NuvTools.AspNetCore.Blazor.JSInterop.IConfirmExitService" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public static IServiceCollection AddBlazorServices(this IServiceCollection services)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection to add the services to.
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection for chaining.
    content.vb: Public Shared Function AddBlazorServices(services As IServiceCollection) As IServiceCollection
  overload: NuvTools.AspNetCore.Blazor.Extensions.BlazorServiceCollectionExtensions.AddBlazorServices*
