- uid: NuvTools.AspNetCore.Blazor.Extensions.BlazorServiceCollectionExtensions.AddBlazorServices(Microsoft.Extensions.DependencyInjection.IServiceCollection)
  commentId: M:NuvTools.AspNetCore.Blazor.Extensions.BlazorServiceCollectionExtensions.AddBlazorServices(Microsoft.Extensions.DependencyInjection.IServiceCollection)
  id: AddBlazorServices(Microsoft.Extensions.DependencyInjection.IServiceCollection)
  isExtensionMethod: true
