  type: Class
  assemblies:
  - NuvTools.AspNetCore.Blazor.MudBlazor
  namespace: NuvTools.AspNetCore.Blazor.MudBlazor.Components
  summary: Abstract base class for pages with server-side paged lists using MudBlazor MudTable.
  remarks: >-
    <p>This base class provides:</p>

    <ul><li>Session storage persistence for filter state</li><li>Integration with <xref href="NuvTools.AspNetCore.Blazor.Services.ILoadingService" data-throw-if-not-resolved="false"></xref> for loading indicators</li><li>MudTable server-side data binding</li><li>Sort direction mapping between NuvTools and MudBlazor</li><li>Support for <xref href="NuvTools.Data.Paging.Enumerations.PagingCountMode.SkipCount" data-throw-if-not-resolved="false"></xref> to avoid expensive COUNT queries on large datasets</li></ul>
  example:
  - >-
    <pre><code class="lang-csharp">public class UserListPage : MudTablePageBase&lt;UserDto, UserFilter, UserSortColumn&gt;

    {
        [Inject] private IUserService UserService { get; set; } = default!;

        protected override string SessionStorageKey =&gt; "user-list-filter";

        protected override UserFilter CreateDefaultFilter() =&gt; new()
        {
            SortColumn = UserSortColumn.Name,
            PageSize = 25
        };

        protected override async Task&lt;IResult&lt;PagingWithEnumerableList&lt;UserDto&gt;&gt;&gt; FetchDataAsync(
            UserFilter filter, CancellationToken cancellationToken)
        {
            return await UserService.GetUsersAsync(filter, cancellationToken);
        }

        protected override UserSortColumn MapSortLabelToOrdering(string sortLabel)
        {
            return Enum.Parse&lt;UserSortColumn&gt;(sortLabel);
        }
    }</code></pre>
