  name: IConfirmExitService
  nameWithType: IConfirmExitService
  fullName: NuvTools.AspNetCore.Blazor.JSInterop.IConfirmExitService
  type: Interface
  assemblies:
  - NuvTools.AspNetCore.Blazor
  namespace: NuvTools.AspNetCore.Blazor.JSInterop
  summary: Asks the browser to confirm before the user closes or reloads the tab, or navigates away from the application.
  remarks: >-
    The confirmation is raised by the browser through the <code>beforeunload</code> event, so the warning text is

    defined by the browser and cannot be customized. It does not cover in-app (SPA) navigation.
  example:
  - >-
    <pre><code class="lang-csharp">[Inject] IConfirmExitService ConfirmExit { get; set; } = default!;


    protected override async Task OnAfterRenderAsync(bool firstRender)

    {
        if (HasUnsavedChanges())
            await ConfirmExit.EnableAsync();
        else
            await ConfirmExit.DisableAsync();
    }


    public async ValueTask DisposeAsync() =&gt; await ConfirmExit.DisableAsync();</code></pre>
  syntax:
    content: 'public interface IConfirmExitService : IAsyncDisposable'
    content.vb: Public Interface IConfirmExitService Inherits IAsyncDisposable
