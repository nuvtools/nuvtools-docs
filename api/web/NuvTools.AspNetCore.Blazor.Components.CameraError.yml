    content: public CameraError(string Name, string Message)
    parameters:
    - id: Name
      type: System.String
      description: >-
        The DOMException name reported by the browser — typically <code>NotAllowedError</code> (permission denied),

        <code>NotFoundError</code> (no camera), <code>NotReadableError</code> (camera in use by another application) or

        <code>OverconstrainedError</code> (no camera matches the requested constraints).
    - id: Message
      type: System.String
      description: The message reported by the browser, in the browser's own language.
