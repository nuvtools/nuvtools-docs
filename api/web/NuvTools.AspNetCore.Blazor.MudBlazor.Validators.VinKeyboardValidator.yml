  name: VinKeyboardValidator
  nameWithType: VinKeyboardValidator
  fullName: NuvTools.AspNetCore.Blazor.MudBlazor.Validators.VinKeyboardValidator
  type: Class
  assemblies:
  - NuvTools.AspNetCore.Blazor.MudBlazor
  namespace: NuvTools.AspNetCore.Blazor.MudBlazor.Validators
  summary: Keyboard validator for Vehicle Identification Number (VIN) input.
  remarks: >-
    <p>

    VINs do not use the letters I, O, and Q to avoid confusion with the numbers 1, 0, and 9 respectively.

    This validator blocks these invalid keys during input.

    </p>

    <p>

    Use with MudTextField's OnKeyDown event and PreventDefault property:

    </p>


    <pre><code class="lang-csharp">@code {
        private readonly VinKeyboardValidator _vinValidator = new();
    }


    &lt;MudTextField @bind-Value="Vin"
                  OnKeyDown="_vinValidator.OnKeyDown"
                  KeyDownPreventDefault="_vinValidator.IsKeyBlocked" /&gt;</code></pre>
  example: []
  syntax:
    content: public sealed class VinKeyboardValidator
