  name: IResult<T>
  nameWithType: IResult<T>
  fullName: NuvTools.Common.ResultWrapper.IResult<T>
  type: Interface
  assemblies:
  - NuvTools.Common
  namespace: NuvTools.Common.ResultWrapper
  summary: Defines the generic contract for an operation result that includes a data payload.
  remarks: >-
    This interface extends <xref href="NuvTools.Common.ResultWrapper.IResult" data-throw-if-not-resolved="false"></xref> by including a strongly-typed

    <xref href="NuvTools.Common.ResultWrapper.IResult%601.Data" data-throw-if-not-resolved="false"></xref> property.  

    It allows returning both status information and operation results

    in a unified, consistent structure.
  example:
  - >-
    Example usage:


    <pre><code class="lang-csharp">IResult&lt;UserDto&gt; result = await _userService.GetUserByIdAsync(1);


    if (result.Succeeded)

    {
        Console.WriteLine($"User: {result.Data!.Name}");
    }

    else

    {
        Console.WriteLine($"Error: {result.Message}");
    }</code></pre>
  syntax:
    content: 'public interface IResult<out T> : IResult'
    typeParameters:
    - id: T
      description: The type of the data returned by the operation.
    content.vb: Public Interface IResult(Of Out T) Inherits IResult
