- uid: NuvTools.Validation.Brazil.Format.FormatCNPJ(System.String)
  commentId: M:NuvTools.Validation.Brazil.Format.FormatCNPJ(System.String)
  id: FormatCNPJ(System.String)
  isExtensionMethod: true
  parent: NuvTools.Validation.Brazil.Format
  langs:
  - csharp
  - vb
  name: FormatCNPJ(string)
  nameWithType: Format.FormatCNPJ(string)
  fullName: NuvTools.Validation.Brazil.Format.FormatCNPJ(string)
  type: Method
  assemblies:
  - NuvTools.Validation
  namespace: NuvTools.Validation.Brazil
  summary: >-
    Formats a CNPJ string into the standard Brazilian format: XX.XXX.XXX/XXXX-XX.

    Accepts both legacy numeric and the new RFB alphanumeric (uppercase A–Z and 0–9) representations.

    Separators in the input are stripped; lowercase letters are normalized to uppercase.
  example:
  - >-
    <pre><code class="lang-csharp">string formatted = "12345678000195".FormatCNPJ();

    // Returns: "12.345.678/0001-95"

    string alphanumeric = "12ABC34501DE35".FormatCNPJ();

    // Returns: "12.ABC.345/01DE-35"</code></pre>
  syntax:
    content: public static string FormatCNPJ(this string cnpj)
    parameters:
    - id: cnpj
      type: System.String
      description: The CNPJ number as a string (14 alphanumeric characters, with or without separators).
    return:
      type: System.String
      description: The formatted CNPJ string.
    content.vb: Public Shared Function FormatCNPJ(cnpj As String) As String
  overload: NuvTools.Validation.Brazil.Format.FormatCNPJ*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: Thrown when <code class="paramref">cnpj</code> is null.
  - type: System.FormatException
    commentId: T:System.FormatException
    description: Thrown when the input does not contain exactly 14 alphanumeric characters.
  nameWithType.vb: Format.FormatCNPJ(String)
  fullName.vb: NuvTools.Validation.Brazil.Format.FormatCNPJ(String)
  name.vb: FormatCNPJ(String)
