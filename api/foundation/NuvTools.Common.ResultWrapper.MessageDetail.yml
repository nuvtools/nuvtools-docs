  fullName: NuvTools.Common.ResultWrapper.MessageDetail
  type: Class
  assemblies:
  - NuvTools.Common
  namespace: NuvTools.Common.ResultWrapper
  summary: >-
    Represents a detailed message related to an operation result,

    such as informational, success, warning, or error messages.
  remarks: >-
    The <xref href="NuvTools.Common.ResultWrapper.MessageDetail" data-throw-if-not-resolved="false"></xref> record is typically used as part of a

    <xref href="NuvTools.Common.ResultWrapper.Result" data-throw-if-not-resolved="false"></xref> or <xref href="NuvTools.Common.ResultWrapper.Result%601" data-throw-if-not-resolved="false"></xref> object to provide

    structured feedback about an operation.

    It allows developers to capture human-readable messages along with

    metadata such as message code and severity.
  example:
  - >-
    Example usage:


    <pre><code class="lang-csharp">var message = new MessageDetail(
        Title: "Validation failed",
        Detail: "The email address format is invalid.",
        Code: "VAL001",
        Severity: Severity.Warning
    );</code></pre>
