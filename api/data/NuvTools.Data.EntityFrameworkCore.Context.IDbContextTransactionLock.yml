### YamlMime:ManagedReference
items:
- uid: NuvTools.Data.EntityFrameworkCore.Context.IDbContextTransactionLock
  commentId: T:NuvTools.Data.EntityFrameworkCore.Context.IDbContextTransactionLock
  id: IDbContextTransactionLock
  parent: NuvTools.Data.EntityFrameworkCore.Context
  children:
  - NuvTools.Data.EntityFrameworkCore.Context.IDbContextTransactionLock.AcquireAsync(Microsoft.EntityFrameworkCore.DbContext,System.String,System.Threading.CancellationToken)
  langs:
  - csharp
  - vb
  name: IDbContextTransactionLock
  nameWithType: IDbContextTransactionLock
  fullName: NuvTools.Data.EntityFrameworkCore.Context.IDbContextTransactionLock
  type: Interface
  assemblies:
  - NuvTools.Data.EntityFrameworkCore
  namespace: NuvTools.Data.EntityFrameworkCore.Context
  summary: >-
    Provider-specific implementation of the transaction-scoped lock behind

    <xref href="NuvTools.Data.EntityFrameworkCore.Context.IDbContextCommands.AcquireTransactionLockAsync(System.String%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    Every relational database offers this, under a different name and keyed differently —

    <code>pg_advisory_xact_lock</code> on PostgreSQL, <code>sp_getapplock</code> on SQL Server — so the statement lives in

    the provider package, not here. The implementation is registered by that package's

    <code>AddDatabase</code>/<code>AddDatabaseByConnectionName</code> helpers, and <xref href="NuvTools.Data.EntityFrameworkCore.Context.DbContextBase" data-throw-if-not-resolved="false"></xref> resolves it

    from the application service provider.
  example: []
  syntax:
    content: public interface IDbContextTransactionLock
    content.vb: Public Interface IDbContextTransactionLock
  derivedClasses:
  - NuvTools.Data.EntityFrameworkCore.PostgreSQL.Context.PostgreSqlTransactionLock
  - NuvTools.Data.EntityFrameworkCore.SqlServer.Context.SqlServerTransactionLock
- uid: NuvTools.Data.EntityFrameworkCore.Context.IDbContextTransactionLock.AcquireAsync(Microsoft.EntityFrameworkCore.DbContext,System.String,System.Threading.CancellationToken)
  commentId: M:NuvTools.Data.EntityFrameworkCore.Context.IDbContextTransactionLock.AcquireAsync(Microsoft.EntityFrameworkCore.DbContext,System.String,System.Threading.CancellationToken)
  id: AcquireAsync(Microsoft.EntityFrameworkCore.DbContext,System.String,System.Threading.CancellationToken)
  parent: NuvTools.Data.EntityFrameworkCore.Context.IDbContextTransactionLock
  langs:
  - csharp
  - vb
  name: AcquireAsync(DbContext, string, CancellationToken)
  nameWithType: IDbContextTransactionLock.AcquireAsync(DbContext, string, CancellationToken)
  fullName: NuvTools.Data.EntityFrameworkCore.Context.IDbContextTransactionLock.AcquireAsync(Microsoft.EntityFrameworkCore.DbContext, string, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Data.EntityFrameworkCore
  namespace: NuvTools.Data.EntityFrameworkCore.Context
  summary: >-
    Acquires the exclusive lock named <code class="paramref">name</code>, blocking until it is granted, and holds it

    until the current transaction of <code class="paramref">context</code> ends.
  example: []
  syntax:
    content: Task AcquireAsync(DbContext context, string name, CancellationToken cancellationToken = default)
    parameters:
    - id: context
      type: Microsoft.EntityFrameworkCore.DbContext
      description: The context whose transaction and connection the lock belongs to.
    - id: name
      type: System.String
      description: Lock name, as given by the caller.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A cancellation token to observe while waiting for the task to complete.
    return:
      type: System.Threading.Tasks.Task
      description: A task that completes once the lock is held.
    content.vb: Function AcquireAsync(context As DbContext, name As String, cancellationToken As CancellationToken = Nothing) As Task
  overload: NuvTools.Data.EntityFrameworkCore.Context.IDbContextTransactionLock.AcquireAsync*
  nameWithType.vb: IDbContextTransactionLock.AcquireAsync(DbContext, String, CancellationToken)
  fullName.vb: NuvTools.Data.EntityFrameworkCore.Context.IDbContextTransactionLock.AcquireAsync(Microsoft.EntityFrameworkCore.DbContext, String, System.Threading.CancellationToken)
  name.vb: AcquireAsync(DbContext, String, CancellationToken)
