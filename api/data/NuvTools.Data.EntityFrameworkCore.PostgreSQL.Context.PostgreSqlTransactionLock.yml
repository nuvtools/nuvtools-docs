items:
- uid: NuvTools.Data.EntityFrameworkCore.PostgreSQL.Context.PostgreSqlTransactionLock
  commentId: T:NuvTools.Data.EntityFrameworkCore.PostgreSQL.Context.PostgreSqlTransactionLock
  id: PostgreSqlTransactionLock
  parent: NuvTools.Data.EntityFrameworkCore.PostgreSQL.Context
  children:
  - NuvTools.Data.EntityFrameworkCore.PostgreSQL.Context.PostgreSqlTransactionLock.AcquireAsync(Microsoft.EntityFrameworkCore.DbContext,System.String,System.Threading.CancellationToken)
  langs:
  - csharp
  - vb
  name: PostgreSqlTransactionLock
  nameWithType: PostgreSqlTransactionLock
  fullName: NuvTools.Data.EntityFrameworkCore.PostgreSQL.Context.PostgreSqlTransactionLock
  type: Class
  assemblies:
  - NuvTools.Data.EntityFrameworkCore.PostgreSQL
  namespace: NuvTools.Data.EntityFrameworkCore.PostgreSQL.Context
  summary: >-
    PostgreSQL implementation of <xref href="NuvTools.Data.EntityFrameworkCore.Context.IDbContextTransactionLock" data-throw-if-not-resolved="false"></xref>, on top of

    <code>pg_advisory_xact_lock</code>: blocks until the lock is granted and releases it when the transaction ends.
  remarks: >-
    PostgreSQL keys advisory locks by a 64-bit integer, so the caller's name is hashed into one. The hash is

    SHA-256 rather than <xref href="System.String.GetHashCode" data-throw-if-not-resolved="false"></xref>, which is randomized per process — two replicas would

    derive different keys for the same name and neither would block the other.
  example: []
  syntax:
    content: 'public sealed class PostgreSqlTransactionLock : IDbContextTransactionLock'
    content.vb: Public NotInheritable Class PostgreSqlTransactionLock Implements IDbContextTransactionLock
  inheritance:
  - System.Object
  implements:
  - NuvTools.Data.EntityFrameworkCore.Context.IDbContextTransactionLock
  inheritedMembers:
