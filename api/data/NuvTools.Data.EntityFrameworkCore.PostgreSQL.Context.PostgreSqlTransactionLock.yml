  - System.Object.Equals(System.Object,System.Object)
  - System.Object.GetHashCode
  - System.Object.GetType
  - System.Object.ReferenceEquals(System.Object,System.Object)
  - System.Object.ToString
- uid: NuvTools.Data.EntityFrameworkCore.PostgreSQL.Context.PostgreSqlTransactionLock.AcquireAsync(Microsoft.EntityFrameworkCore.DbContext,System.String,System.Threading.CancellationToken)
  commentId: M:NuvTools.Data.EntityFrameworkCore.PostgreSQL.Context.PostgreSqlTransactionLock.AcquireAsync(Microsoft.EntityFrameworkCore.DbContext,System.String,System.Threading.CancellationToken)
  id: AcquireAsync(Microsoft.EntityFrameworkCore.DbContext,System.String,System.Threading.CancellationToken)
  parent: NuvTools.Data.EntityFrameworkCore.PostgreSQL.Context.PostgreSqlTransactionLock
  langs:
  - csharp
  - vb
  name: AcquireAsync(DbContext, string, CancellationToken)
  nameWithType: PostgreSqlTransactionLock.AcquireAsync(DbContext, string, CancellationToken)
  fullName: NuvTools.Data.EntityFrameworkCore.PostgreSQL.Context.PostgreSqlTransactionLock.AcquireAsync(Microsoft.EntityFrameworkCore.DbContext, string, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Data.EntityFrameworkCore.PostgreSQL
  namespace: NuvTools.Data.EntityFrameworkCore.PostgreSQL.Context
  summary: >-
    Acquires the exclusive lock named <code class="paramref">name</code>, blocking until it is granted, and holds it

    until the current transaction of <code class="paramref">context</code> ends.
  example: []
  syntax:
    content: public Task AcquireAsync(DbContext context, string name, CancellationToken cancellationToken = default)
    parameters:
    - id: context
      type: Microsoft.EntityFrameworkCore.DbContext
      description: The context whose transaction and connection the lock belongs to.
    - id: name
      type: System.String
      description: Lock name, as given by the caller.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: A cancellation token to observe while waiting for the task to complete.
    return:
      type: System.Threading.Tasks.Task
      description: A task that completes once the lock is held.
    content.vb: Public Function AcquireAsync(context As DbContext, name As String, cancellationToken As CancellationToken = Nothing) As Task
