- uid: NuvTools.Data.Paging.Enumerations.PagingCountMode.Normal
  commentId: F:NuvTools.Data.Paging.Enumerations.PagingCountMode.Normal
  id: Normal
  parent: NuvTools.Data.Paging.Enumerations.PagingCountMode
  langs:
  - csharp
  - vb
  name: Normal
  nameWithType: PagingCountMode.Normal
  fullName: NuvTools.Data.Paging.Enumerations.PagingCountMode.Normal
  type: Field
  assemblies:
  - NuvTools.Data
  namespace: NuvTools.Data.Paging.Enumerations
  summary: >-
    Performs a full COUNT(*) query to determine the total number of items.

    This is the default behavior and provides an exact total.
  example: []
  syntax:
    content: Normal = 0
    return:
      type: NuvTools.Data.Paging.Enumerations.PagingCountMode
- uid: NuvTools.Data.Paging.Enumerations.PagingCountMode.SkipCount
  commentId: F:NuvTools.Data.Paging.Enumerations.PagingCountMode.SkipCount
  id: SkipCount
  parent: NuvTools.Data.Paging.Enumerations.PagingCountMode
  langs:
  - csharp
  - vb
  name: SkipCount
  nameWithType: PagingCountMode.SkipCount
  fullName: NuvTools.Data.Paging.Enumerations.PagingCountMode.SkipCount
  type: Field
  assemblies:
  - NuvTools.Data
  namespace: NuvTools.Data.Paging.Enumerations
  summary: >-
    Skips the COUNT(*) query for better performance on large datasets.

    Instead, fetches one extra item to determine if a next page exists.

    The <xref href="NuvTools.Data.Paging.PagingBase%602.Total" data-throw-if-not-resolved="false"></xref> property will be set to -1 to indicate the count is unknown.
  example: []
  syntax:
    content: SkipCount = 1
    return:
      type: NuvTools.Data.Paging.Enumerations.PagingCountMode
