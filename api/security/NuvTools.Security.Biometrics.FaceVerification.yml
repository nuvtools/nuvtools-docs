  - NuvTools.Security
  namespace: NuvTools.Security.Biometrics
  summary: Result of comparing a captured face with the one on record.
  example: []
  syntax:
    content: public FaceVerification(bool Matched, double Similarity, string? Liveness, FaceVerificationFailureType Failure)
    parameters:
    - id: Matched
      type: System.Boolean
      description: >-
        Whether the capture was accepted as the person: similarity at or above the configured minimum and,

        when liveness is enforced, a liveness the application accepts.
    - id: Similarity
      type: System.Double
      description: How alike the two faces are (0.0 = different, 1.0 = identical). Zero when no comparison happened.
    - id: Liveness
      type: System.String
      description: >-
        What the provider reported about the capture being of a live person, in its own words, or

        <code>null</code> when it reported nothing.
    - id: Failure
      type: NuvTools.Security.Biometrics.FaceVerificationFailureType
      description: Why the capture was not accepted, or <xref href="NuvTools.Security.Biometrics.FaceVerificationFailureType.None" data-throw-if-not-resolved="false"></xref>.
