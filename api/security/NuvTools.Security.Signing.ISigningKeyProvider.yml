items:
- uid: NuvTools.Security.Signing.ISigningKeyProvider
  commentId: T:NuvTools.Security.Signing.ISigningKeyProvider
  id: ISigningKeyProvider
  parent: NuvTools.Security.Signing
  children:
  - NuvTools.Security.Signing.ISigningKeyProvider.GetSigningCredentialsAsync(System.Threading.CancellationToken)
  langs:
  - csharp
  - vb
  name: ISigningKeyProvider
  nameWithType: ISigningKeyProvider
  fullName: NuvTools.Security.Signing.ISigningKeyProvider
  type: Interface
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Signing
  summary: Supplies the keys a token issuer signs with, wherever they are kept.
  remarks: >-
    The contract is neutral on purpose: an issuer depends on this and on

    <xref href="Microsoft.IdentityModel.Tokens.SigningCredentials" data-throw-if-not-resolved="false"></xref>, and the package that knows a particular key store — a vault, a

    hardware module — implements it. Changing store is changing the registration.
  example: []
  syntax:
    content: public interface ISigningKeyProvider
    content.vb: Public Interface ISigningKeyProvider
  derivedClasses:
  - NuvTools.Security.Signing.Azure.KeyVaultSigningKeyProvider
- uid: NuvTools.Security.Signing.ISigningKeyProvider.GetSigningCredentialsAsync(System.Threading.CancellationToken)
  commentId: M:NuvTools.Security.Signing.ISigningKeyProvider.GetSigningCredentialsAsync(System.Threading.CancellationToken)
  id: GetSigningCredentialsAsync(System.Threading.CancellationToken)
  parent: NuvTools.Security.Signing.ISigningKeyProvider
  langs:
  - csharp
  - vb
  name: GetSigningCredentialsAsync(CancellationToken)
  nameWithType: ISigningKeyProvider.GetSigningCredentialsAsync(CancellationToken)
  fullName: NuvTools.Security.Signing.ISigningKeyProvider.GetSigningCredentialsAsync(System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Signing
  summary: Returns the current signing credentials.
  example: []
  syntax:
    content: Task<IReadOnlyList<SigningCredentials>> GetSigningCredentialsAsync(CancellationToken cancellationToken = default)
    parameters:
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Cancels the lookup.
    return:
      type: System.Threading.Tasks.Task{System.Collections.Generic.IReadOnlyList{Microsoft.IdentityModel.Tokens.SigningCredentials}}
      description: >-
        The credentials in order of preference: the first is the one to sign with, and every one

        of them must be published, because tokens signed by the others may still be in use.

        Never empty.
    content.vb: Function GetSigningCredentialsAsync(cancellationToken As CancellationToken = Nothing) As Task(Of IReadOnlyList(Of SigningCredentials))
  overload: NuvTools.Security.Signing.ISigningKeyProvider.GetSigningCredentialsAsync*
