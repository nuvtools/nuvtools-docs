- uid: NuvTools.Security.Captcha.CaptchaHttpRequestExtensions.AddCaptchaToken(System.Net.Http.HttpRequestMessage,System.String,System.String)
  commentId: M:NuvTools.Security.Captcha.CaptchaHttpRequestExtensions.AddCaptchaToken(System.Net.Http.HttpRequestMessage,System.String,System.String)
