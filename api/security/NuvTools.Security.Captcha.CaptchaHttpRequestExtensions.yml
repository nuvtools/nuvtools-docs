  name: AddCaptchaToken(HttpRequestMessage, string?, string?)
  nameWithType: CaptchaHttpRequestExtensions.AddCaptchaToken(HttpRequestMessage, string?, string?)
  fullName: NuvTools.Security.Captcha.CaptchaHttpRequestExtensions.AddCaptchaToken(System.Net.Http.HttpRequestMessage, string?, string?)
  type: Method
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Captcha
  summary: >-
    Adds the <xref href="NuvTools.Security.Captcha.CaptchaDefaults.TokenHeader" data-throw-if-not-resolved="false"></xref> and <xref href="NuvTools.Security.Captcha.CaptchaDefaults.ModeHeader" data-throw-if-not-resolved="false"></xref>

    headers to the request. Empty values are skipped, leaving the header absent.
  example: []
  syntax:
    content: public static void AddCaptchaToken(this HttpRequestMessage request, string? token, string? mode = null)
    parameters:
    - id: request
      type: System.Net.Http.HttpRequestMessage
      description: The request to attach the headers to.
    - id: token
      type: System.String
      description: The token produced by the CAPTCHA provider.
    - id: mode
      type: System.String
      description: <xref href="NuvTools.Security.Captcha.CaptchaDefaults.ModeScore" data-throw-if-not-resolved="false"></xref> or <xref href="NuvTools.Security.Captcha.CaptchaDefaults.ModeCheckbox" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public Shared Sub AddCaptchaToken(request As HttpRequestMessage, token As String, mode As String = Nothing)
