- uid: NuvTools.Security.Signing.Azure.Extensions.KeyVaultSigningServiceCollectionExtensions.AddKeyVaultSigningKeys(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String,Azure.Core.TokenCredential)
  commentId: M:NuvTools.Security.Signing.Azure.Extensions.KeyVaultSigningServiceCollectionExtensions.AddKeyVaultSigningKeys(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String,Azure.Core.TokenCredential)
  id: AddKeyVaultSigningKeys(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String,Azure.Core.TokenCredential)
  isExtensionMethod: true
  parent: NuvTools.Security.Signing.Azure.Extensions.KeyVaultSigningServiceCollectionExtensions
  langs:
  - csharp
  - vb
  name: AddKeyVaultSigningKeys(IServiceCollection, IConfiguration, string, TokenCredential?)
  nameWithType: KeyVaultSigningServiceCollectionExtensions.AddKeyVaultSigningKeys(IServiceCollection, IConfiguration, string, TokenCredential?)
  fullName: NuvTools.Security.Signing.Azure.Extensions.KeyVaultSigningServiceCollectionExtensions.AddKeyVaultSigningKeys(Microsoft.Extensions.DependencyInjection.IServiceCollection, Microsoft.Extensions.Configuration.IConfiguration, string, Azure.Core.TokenCredential?)
  type: Method
  assemblies:
  - NuvTools.Security.Signing.Azure
  namespace: NuvTools.Security.Signing.Azure.Extensions
  summary: >-
    Binds <xref href="NuvTools.Security.Signing.Azure.KeyVaultSigningOptions" data-throw-if-not-resolved="false"></xref> from configuration and registers Azure Key Vault as

    the <xref href="NuvTools.Security.Signing.ISigningKeyProvider" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    This is the only place a caller names the key store: everything above it depends on

    <xref href="NuvTools.Security.Signing.ISigningKeyProvider" data-throw-if-not-resolved="false"></xref>, so changing store is changing this call.
  example: []
  syntax:
    content: public static IServiceCollection AddKeyVaultSigningKeys(this IServiceCollection services, IConfiguration configuration, string sectionName = "KeyVaultSigning", TokenCredential? credential = null)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection to add the services to.
    - id: configuration
      type: Microsoft.Extensions.Configuration.IConfiguration
      description: Configuration holding the signing section.
    - id: sectionName
      type: System.String
      description: >-
        Name of the section to bind. Defaults to <xref href="NuvTools.Security.Signing.Azure.KeyVaultSigningOptions.SectionName" data-throw-if-not-resolved="false"></xref>; pass

        the application's own when its settings already live under another name.
    - id: credential
      type: Azure.Core.TokenCredential
      description: >-
        The identity to reach the vault with. Defaults to <xref href="Azure.Identity.DefaultAzureCredential" data-throw-if-not-resolved="false"></xref>, which

        resolves a managed identity when deployed and the developer's own login on a workstation.
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection for chaining.
    content.vb: Public Shared Function AddKeyVaultSigningKeys(services As IServiceCollection, configuration As IConfiguration, sectionName As String = "KeyVaultSigning", credential As TokenCredential = Nothing) As IServiceCollection
