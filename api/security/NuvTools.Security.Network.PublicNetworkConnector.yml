items:
- uid: NuvTools.Security.Network.PublicNetworkConnector
  commentId: T:NuvTools.Security.Network.PublicNetworkConnector
  id: PublicNetworkConnector
  parent: NuvTools.Security.Network
  children:
  - NuvTools.Security.Network.PublicNetworkConnector.Apply(System.Net.Http.SocketsHttpHandler,NuvTools.Security.Network.NetworkAddressPolicy)
  - NuvTools.Security.Network.PublicNetworkConnector.CreateConnectCallback(NuvTools.Security.Network.NetworkAddressPolicy)
  - NuvTools.Security.Network.PublicNetworkConnector.CreateHandler(NuvTools.Security.Network.NetworkAddressPolicy)
  langs:
  - csharp
  - vb
  name: PublicNetworkConnector
  nameWithType: PublicNetworkConnector
  fullName: NuvTools.Security.Network.PublicNetworkConnector
  type: Class
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Network
  summary: >-
    Makes a <xref href="System.Net.Http.SocketsHttpHandler" data-throw-if-not-resolved="false"></xref> connect only to addresses a <xref href="NuvTools.Security.Network.NetworkAddressPolicy" data-throw-if-not-resolved="false"></xref>

    allows, judged at the moment of connecting.
  remarks: >-
    <p>

    <b>Why at the socket and not before the request.</b> Checking a URL, resolving it and then letting

    <xref href="System.Net.Http.HttpClient" data-throw-if-not-resolved="false"></xref> resolve it again leaves a gap an attacker controls: their DNS answers a public

    address to the check and a private one to the connection. Here the address that is checked is the

    address the socket connects to — there is no second lookup.

    </p>

    <p>

    Every connection goes through the callback, redirects included, so a public URL answering

    <code>302 Location: http://169.254.169.254/</code> is refused at the second hop. The proxy is switched off,

    because through a proxy the callback would only ever see the proxy's address.

    </p>

    <p>

    Works with anything built on <xref href="System.Net.Http.SocketsHttpHandler" data-throw-if-not-resolved="false"></xref>: an <xref href="System.Net.Http.HttpClient" data-throw-if-not-resolved="false"></xref>, an

    <code>IHttpClientFactory</code> primary handler, or a reverse proxy's forwarder handler.

    </p>
  example: []
  syntax:
    content: public static class PublicNetworkConnector
    content.vb: Public Module PublicNetworkConnector
