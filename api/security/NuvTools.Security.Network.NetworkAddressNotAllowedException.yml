  langs:
  - csharp
  - vb
  name: NetworkAddressNotAllowedException
  nameWithType: NetworkAddressNotAllowedException
  fullName: NuvTools.Security.Network.NetworkAddressNotAllowedException
  type: Class
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Network
  summary: >-
    Thrown when an outbound connection would reach a host or an address that

    <xref href="NuvTools.Security.Network.NetworkAddressPolicy" data-throw-if-not-resolved="false"></xref> denies.
  remarks: >-
    Raised from a <xref href="System.Net.Http.SocketsHttpHandler.ConnectCallback" data-throw-if-not-resolved="false"></xref>, it reaches the caller of

    <xref href="System.Net.Http.HttpClient" data-throw-if-not-resolved="false"></xref> as the inner exception of an <xref href="System.Net.Http.HttpRequestException" data-throw-if-not-resolved="false"></xref>. The message

    names the host but not the address, so it is safe to log and still says which URL was refused; the

    address is on <xref href="NuvTools.Security.Network.NetworkAddressNotAllowedException.Address" data-throw-if-not-resolved="false"></xref> for whoever needs it.
  example: []
  syntax:
    content: 'public sealed class NetworkAddressNotAllowedException : IOException, ISerializable'
    content.vb: Public NotInheritable Class NetworkAddressNotAllowedException Inherits IOException Implements ISerializable
  inheritance:
