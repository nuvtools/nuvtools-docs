- uid: NuvTools.Security.Network.NetworkAddressNotAllowedException
  commentId: T:NuvTools.Security.Network.NetworkAddressNotAllowedException
  id: NetworkAddressNotAllowedException
  parent: NuvTools.Security.Network
  children:
  - NuvTools.Security.Network.NetworkAddressNotAllowedException.#ctor(System.String,System.Net.IPAddress)
  - NuvTools.Security.Network.NetworkAddressNotAllowedException.Address
