  - NuvTools.Security.Identity.Models
  namespace: NuvTools.Security.Identity.Models.Form
  summary: Gets or sets the code shown by the authenticator app.
  remarks: >-
    Six digits. Up to seven characters are accepted so a code typed with a space in the middle,

    as most authenticator apps display it, still passes; strip spaces and hyphens before

    verifying it.
  example: []
  syntax:
    content: >-
      [Display(Name = "VerificationCode", ResourceType = typeof(Fields))]

      [Required(ErrorMessageResourceName = "XRequired", ErrorMessageResourceType = typeof(Messages))]

      [MinLength(6, ErrorMessageResourceName = "XMustHaveAtLeastYCharacters", ErrorMessageResourceType = typeof(Messages))]

      [MaxLength(7, ErrorMessageResourceName = "XMustHaveUpToYCharacters", ErrorMessageResourceType = typeof(Messages))]

