  name: ReadCertificateAsync(ReadOnlyMemory<byte>, CancellationToken)
  nameWithType: IDocumentSigner.ReadCertificateAsync(ReadOnlyMemory<byte>, CancellationToken)
  fullName: NuvTools.Security.Certificate.Signing.IDocumentSigner.ReadCertificateAsync(System.ReadOnlyMemory<byte>, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Certificate.Signing
  summary: Reads who a certificate was issued to, without validating it.
  example: []
  syntax:
    content: Task<CertificateDetails> ReadCertificateAsync(ReadOnlyMemory<byte> certificate, CancellationToken cancellationToken = default)
    parameters:
    - id: certificate
      type: System.ReadOnlyMemory{System.Byte}
      description: The certificate, DER-encoded.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Token to cancel the operation.
    return:
      type: System.Threading.Tasks.Task{NuvTools.Security.Certificate.Signing.CertificateDetails}
      description: What the certificate says about its holder and issuer.
    content.vb: Function ReadCertificateAsync(certificate As ReadOnlyMemory(Of Byte), cancellationToken As CancellationToken = Nothing) As Task(Of CertificateDetails)
