- uid: NuvTools.Security.Certificate.Signing.IDocumentSigner
  commentId: T:NuvTools.Security.Certificate.Signing.IDocumentSigner
  id: IDocumentSigner
  parent: NuvTools.Security.Certificate.Signing
  children:
  - NuvTools.Security.Certificate.Signing.IDocumentSigner.CompleteAsync(System.String,System.Threading.CancellationToken)
  - NuvTools.Security.Certificate.Signing.IDocumentSigner.GetSignersAsync(System.ReadOnlyMemory{System.Byte},System.Threading.CancellationToken)
  - NuvTools.Security.Certificate.Signing.IDocumentSigner.ReadCertificateAsync(System.ReadOnlyMemory{System.Byte},System.Threading.CancellationToken)
  - NuvTools.Security.Certificate.Signing.IDocumentSigner.StartAsync(NuvTools.Security.Certificate.Signing.DocumentSignatureRequest,System.Threading.CancellationToken)
  langs:
  - csharp
  - vb
  name: IDocumentSigner
  nameWithType: IDocumentSigner
  fullName: NuvTools.Security.Certificate.Signing.IDocumentSigner
  type: Interface
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Certificate.Signing
  summary: >-
    Signs a PDF with a digital certificate whose private key stays with the person, in two steps: the

    server prepares the document and opens a challenge, the client signs it, and the server completes

    the signature.
  remarks: >-
    <p>

    Whatever the application needs to know about who signed — to check it is the expected person, or to

    print it on the document — comes from the certificate the provider read, never from a value the

    client sends.

    </p>

    <p>

    Provider failures propagate as exceptions. Signing is not an access decision, so there is no safe

    outcome to fall back to: the caller reports that the document was not signed.

    </p>
  example: []
  syntax:
    content: public interface IDocumentSigner
    content.vb: Public Interface IDocumentSigner
  derivedClasses:
  - NuvTools.Security.Certificate.Lacuna.RestPkiDocumentSigner
