  - vb
  name: GetSignersAsync(ReadOnlyMemory<byte>, CancellationToken)
  nameWithType: IDocumentSigner.GetSignersAsync(ReadOnlyMemory<byte>, CancellationToken)
  fullName: NuvTools.Security.Certificate.Signing.IDocumentSigner.GetSignersAsync(System.ReadOnlyMemory<byte>, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Certificate.Signing
  summary: Reads the certificates a document was already signed with, without validating the signatures.
  example: []
  syntax:
    content: Task<IReadOnlyList<CertificateDetails>> GetSignersAsync(ReadOnlyMemory<byte> signedDocument, CancellationToken cancellationToken = default)
    parameters:
    - id: signedDocument
      type: System.ReadOnlyMemory{System.Byte}
      description: The signed PDF.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Token to cancel the operation.
    return:
      type: System.Threading.Tasks.Task{System.Collections.Generic.IReadOnlyList{NuvTools.Security.Certificate.Signing.CertificateDetails}}
      description: One entry per signature, in the order the provider reports them. Document timestamps are left out.
    content.vb: Function GetSignersAsync(signedDocument As ReadOnlyMemory(Of Byte), cancellationToken As CancellationToken = Nothing) As Task(Of IReadOnlyList(Of CertificateDetails))
