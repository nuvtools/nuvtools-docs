  langs:
  - csharp
  - vb
  name: RenderCheckboxAsync(string, string, string, CancellationToken)
  nameWithType: ICaptchaService.RenderCheckboxAsync(string, string, string, CancellationToken)
  fullName: NuvTools.Security.AspNetCore.Blazor.Captcha.ICaptchaService.RenderCheckboxAsync(string, string, string, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Security.AspNetCore.Blazor
  namespace: NuvTools.Security.AspNetCore.Blazor.Captcha
  summary: Renders the "I'm not a robot" checkbox into the given element, as the step-up challenge.
  example: []
  syntax:
    content: ValueTask RenderCheckboxAsync(string elementId, string checkboxKey, string scoreKey, CancellationToken cancellationToken = default)
    parameters:
    - id: elementId
      type: System.String
      description: Id of the element that hosts the widget.
    - id: checkboxKey
      type: System.String
      description: Site key of the checkbox type.
    - id: scoreKey
      type: System.String
      description: Site key of the score type, used to load the provider script.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Token to cancel the operation.
    return:
      type: System.Threading.Tasks.ValueTask
    content.vb: Function RenderCheckboxAsync(elementId As String, checkboxKey As String, scoreKey As String, cancellationToken As CancellationToken = Nothing) As ValueTask
