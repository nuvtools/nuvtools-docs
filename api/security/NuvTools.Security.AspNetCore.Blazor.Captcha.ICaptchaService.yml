- uid: NuvTools.Security.AspNetCore.Blazor.Captcha.ICaptchaService.ExecuteAsync(System.String,System.String,System.Threading.CancellationToken)
  commentId: M:NuvTools.Security.AspNetCore.Blazor.Captcha.ICaptchaService.ExecuteAsync(System.String,System.String,System.Threading.CancellationToken)
  id: ExecuteAsync(System.String,System.String,System.Threading.CancellationToken)
  parent: NuvTools.Security.AspNetCore.Blazor.Captcha.ICaptchaService
  langs:
  - csharp
  - vb
  name: ExecuteAsync(string, string, CancellationToken)
  nameWithType: ICaptchaService.ExecuteAsync(string, string, CancellationToken)
  fullName: NuvTools.Security.AspNetCore.Blazor.Captcha.ICaptchaService.ExecuteAsync(string, string, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Security.AspNetCore.Blazor
  namespace: NuvTools.Security.AspNetCore.Blazor.Captcha
  summary: Produces an invisible (score) token. Nothing is shown to the user.
  example: []
  syntax:
    content: ValueTask<string?> ExecuteAsync(string scoreKey, string action = "submit", CancellationToken cancellationToken = default)
    parameters:
    - id: scoreKey
      type: System.String
      description: Site key of the score type.
    - id: action
      type: System.String
      description: Action name recorded on the assessment. Defaults to <code>submit</code>.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Token to cancel the operation.
    return:
      type: System.Threading.Tasks.ValueTask{System.String}
      description: The token, or an empty string when the provider is unavailable.
    content.vb: Function ExecuteAsync(scoreKey As String, action As String = "submit", cancellationToken As CancellationToken = Nothing) As ValueTask(Of String)
