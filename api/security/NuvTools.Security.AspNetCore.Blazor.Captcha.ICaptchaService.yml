  name: ICaptchaService
  nameWithType: ICaptchaService
  fullName: NuvTools.Security.AspNetCore.Blazor.Captcha.ICaptchaService
  type: Interface
  assemblies:
  - NuvTools.Security.AspNetCore.Blazor
  namespace: NuvTools.Security.AspNetCore.Blazor.Captcha
  summary: Provides JavaScript interop for the adaptive CAPTCHA (Google reCAPTCHA Enterprise).
  remarks: >-
    When the provider script cannot be loaded, the token-producing members return an empty string

    rather than failing. The server treats an empty token as invalid, so the outcome is fail-closed.
  example: []
  syntax:
    content: 'public interface ICaptchaService : IAsyncDisposable'
    content.vb: Public Interface ICaptchaService Inherits IAsyncDisposable
