- uid: NuvTools.Security.Signing.Azure.KeyVaultSigningOptions.ActivationDelay
  commentId: P:NuvTools.Security.Signing.Azure.KeyVaultSigningOptions.ActivationDelay
  id: ActivationDelay
  parent: NuvTools.Security.Signing.Azure.KeyVaultSigningOptions
  langs:
  - csharp
  - vb
  name: ActivationDelay
  nameWithType: KeyVaultSigningOptions.ActivationDelay
  fullName: NuvTools.Security.Signing.Azure.KeyVaultSigningOptions.ActivationDelay
  type: Property
  assemblies:
  - NuvTools.Security.Signing.Azure
  namespace: NuvTools.Security.Signing.Azure
  summary: >-
    How long a new version is published before it starts signing. It gives whoever validates

    the tokens time to learn the new key, so the first token signed with it is not refused by a

    validator still holding the previous key set. Defaults to one hour.
  example: []
  syntax:
    content: public TimeSpan ActivationDelay { get; set; }
    parameters: []
    return:
      type: System.TimeSpan
    content.vb: Public Property ActivationDelay As TimeSpan
  overload: NuvTools.Security.Signing.Azure.KeyVaultSigningOptions.ActivationDelay*
