  type: Property
  assemblies:
  - NuvTools.Security.Signing.Azure
  namespace: NuvTools.Security.Signing.Azure
  summary: >-
    How long the list of versions is reused before the vault is asked again; a rotation is

    noticed within this time. Defaults to five minutes.
  example: []
  syntax:
    content: public TimeSpan RefreshInterval { get; set; }
    parameters: []
    return:
      type: System.TimeSpan
    content.vb: Public Property RefreshInterval As TimeSpan
