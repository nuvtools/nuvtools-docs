- uid: NuvTools.Security.Biometrics.IFaceVerifier
  commentId: T:NuvTools.Security.Biometrics.IFaceVerifier
  id: IFaceVerifier
  parent: NuvTools.Security.Biometrics
  children:
  - NuvTools.Security.Biometrics.IFaceVerifier.VerifyAsync(NuvTools.Security.Biometrics.FaceVerificationRequest,System.Threading.CancellationToken)
  langs:
  - csharp
  - vb
  name: IFaceVerifier
  nameWithType: IFaceVerifier
  fullName: NuvTools.Security.Biometrics.IFaceVerifier
  type: Interface
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Biometrics
  summary: Verifies that a captured face belongs to the holder of a document, against the provider's record.
  remarks: >-
    Call it inside the sign-in operation itself, with the image the client just captured, and decide

    on its result. A client must never be able to state that a verification already happened: an

    endpoint that only verifies, followed by a sign-in that trusts the caller, verifies nothing.
  example: []
  syntax:
    content: public interface IFaceVerifier
    content.vb: Public Interface IFaceVerifier
  derivedClasses:
  - NuvTools.Security.Biometrics.Serpro.DatavalidFaceVerifier
- uid: NuvTools.Security.Biometrics.IFaceVerifier.VerifyAsync(NuvTools.Security.Biometrics.FaceVerificationRequest,System.Threading.CancellationToken)
  commentId: M:NuvTools.Security.Biometrics.IFaceVerifier.VerifyAsync(NuvTools.Security.Biometrics.FaceVerificationRequest,System.Threading.CancellationToken)
  id: VerifyAsync(NuvTools.Security.Biometrics.FaceVerificationRequest,System.Threading.CancellationToken)
  parent: NuvTools.Security.Biometrics.IFaceVerifier
  langs:
  - csharp
  - vb
  name: VerifyAsync(FaceVerificationRequest, CancellationToken)
  nameWithType: IFaceVerifier.VerifyAsync(FaceVerificationRequest, CancellationToken)
  fullName: NuvTools.Security.Biometrics.IFaceVerifier.VerifyAsync(NuvTools.Security.Biometrics.FaceVerificationRequest, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Biometrics
  summary: Compares the captured face with the one on record.
  example: []
  syntax:
    content: Task<FaceVerification> VerifyAsync(FaceVerificationRequest request, CancellationToken cancellationToken = default)
    parameters:
    - id: request
      type: NuvTools.Security.Biometrics.FaceVerificationRequest
      description: Whose face it should be, and the capture.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Token to cancel the operation.
    return:
      type: System.Threading.Tasks.Task{NuvTools.Security.Biometrics.FaceVerification}
      description: >-
        The verification result. An invalid document, an unusable image or a communication failure

        yields <xref href="NuvTools.Security.Biometrics.FaceVerification.Matched" data-throw-if-not-resolved="false"></xref> = <code>false</code> (fail-closed).
    content.vb: Function VerifyAsync(request As FaceVerificationRequest, cancellationToken As CancellationToken = Nothing) As Task(Of FaceVerification)
  overload: NuvTools.Security.Biometrics.IFaceVerifier.VerifyAsync*
