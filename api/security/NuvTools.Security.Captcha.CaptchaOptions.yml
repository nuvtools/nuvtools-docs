  name: CaptchaOptions
  nameWithType: CaptchaOptions
  fullName: NuvTools.Security.Captcha.CaptchaOptions
  type: Class
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Captcha
  summary: Configuration for the anti-bot protection (Google reCAPTCHA Enterprise) applied to public endpoints.
  remarks: >-
    Adaptive model: a <b>score</b> key runs invisibly on every submission; when the risk is high

    (score below <xref href="NuvTools.Security.Captcha.CaptchaOptions.MinScore" data-throw-if-not-resolved="false"></xref>), the client presents the <b>checkbox</b> key as a step-up

    challenge. Verification creates an assessment on the reCAPTCHA Enterprise API (Google Cloud).
  example: []
  syntax:
    content: public sealed class CaptchaOptions
    content.vb: Public NotInheritable Class CaptchaOptions
