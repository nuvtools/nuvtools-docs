  summary: Produces an invisible (score) token. Nothing is shown to the user.
  example: []
  syntax:
    content: public ValueTask<string?> ExecuteAsync(string scoreKey, string action = "submit", CancellationToken cancellationToken = default)
    parameters:
    - id: scoreKey
      type: System.String
      description: Site key of the score type.
    - id: action
      type: System.String
      description: Action name recorded on the assessment. Defaults to <code>submit</code>.
