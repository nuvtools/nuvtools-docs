  name: VerifyAsync(string?, bool, CancellationToken)
  nameWithType: ICaptchaVerifier.VerifyAsync(string?, bool, CancellationToken)
  fullName: NuvTools.Security.Captcha.ICaptchaVerifier.VerifyAsync(string?, bool, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Captcha
  summary: Creates an assessment for the token.
  example: []
  syntax:
    content: Task<CaptchaVerification> VerifyAsync(string? token, bool checkboxMode, CancellationToken cancellationToken = default)
    parameters:
    - id: token
      type: System.String
      description: The token produced by the client.
    - id: checkboxMode
      type: System.Boolean
      description: >-
        <code>true</code> uses the checkbox key (step-up challenge); <code>false</code> uses the score key

        (invisible).
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Token to cancel the operation.
    return:
      type: System.Threading.Tasks.Task{NuvTools.Security.Captcha.CaptchaVerification}
      description: >-
        The verification result. An empty token or a communication failure yields

        <xref href="NuvTools.Security.Captcha.CaptchaVerification.Valid" data-throw-if-not-resolved="false"></xref> = <code>false</code> (fail-closed).
    content.vb: Function VerifyAsync(token As String, checkboxMode As Boolean, cancellationToken As CancellationToken = Nothing) As Task(Of CaptchaVerification)
