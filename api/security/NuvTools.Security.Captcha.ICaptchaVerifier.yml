- uid: NuvTools.Security.Captcha.ICaptchaVerifier.VerifyAsync(System.String,System.Boolean,System.Threading.CancellationToken)
  commentId: M:NuvTools.Security.Captcha.ICaptchaVerifier.VerifyAsync(System.String,System.Boolean,System.Threading.CancellationToken)
  id: VerifyAsync(System.String,System.Boolean,System.Threading.CancellationToken)
  parent: NuvTools.Security.Captcha.ICaptchaVerifier
  langs:
  - csharp
