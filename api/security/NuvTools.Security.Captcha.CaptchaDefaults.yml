  type: Field
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Captcha
  summary: >-
    Response header set to <code>true</code> when the client must escalate to the checkbox challenge.

    Redundant with <xref href="NuvTools.Security.Captcha.CaptchaDefaults.StepUpMarker" data-throw-if-not-resolved="false"></xref>, for direct reading.
  example: []
  syntax:
    content: public const string StepUpHeader = "X-Captcha-Stepup"
    return:
      type: System.String
    content.vb: Public Const StepUpHeader As String = "X-Captcha-Stepup"
- uid: NuvTools.Security.Captcha.CaptchaDefaults.StepUpMarker
