  fullName: NuvTools.Security.Captcha.CaptchaDefaults.StepUpMarker
  type: Field
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Captcha
  summary: >-
    Marker returned as the failure message title when the risk score is too low and the client

    must present the checkbox challenge. The client matches on this value.
  example: []
  syntax:
    content: public const string StepUpMarker = "captcha-stepup"
    return:
      type: System.String
    content.vb: Public Const StepUpMarker As String = "captcha-stepup"
