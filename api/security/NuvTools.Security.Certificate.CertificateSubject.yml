  summary: Who a validated certificate was issued to.
  remarks: >-
    Every value comes from the certificate itself. Which of them an application requires is its own

    decision: a certificate issued to a company carries a CNPJ and the CPF of the person responsible,

    one issued to a person may carry no CNPJ, and one from outside ICP-Brasil carries neither.
  example: []
  syntax:
    content: public CertificateSubject(string? Name, string? Email, string? Cpf, string? Cnpj, string? CompanyName)
    parameters:
    - id: Name
      type: System.String
      description: Common name of the subject.
    - id: Email
      type: System.String
      description: E-mail address in the certificate, when present.
    - id: Cpf
      type: System.String
      description: CPF of the holder, digits only, when the certificate is an ICP-Brasil one.
    - id: Cnpj
      type: System.String
      description: CNPJ of the company, digits only, when the certificate was issued to one.
    - id: CompanyName
      type: System.String
      description: Name of the company, when the certificate was issued to one.
