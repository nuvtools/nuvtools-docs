  name: KeyVaultSigningKeyProvider
  nameWithType: KeyVaultSigningKeyProvider
  fullName: NuvTools.Security.Signing.Azure.KeyVaultSigningKeyProvider
  type: Class
  assemblies:
  - NuvTools.Security.Signing.Azure
  namespace: NuvTools.Security.Signing.Azure
  summary: >-
    Signs with an RSA key kept in Azure Key Vault. The private key never leaves the vault: this

    process holds the public half of each version and asks the vault for every signature.
  remarks: >-
    <p>

    Every enabled version of the key that is within its validity period is offered, so tokens

    signed before a rotation keep validating. A new version starts signing once it has been

    published for <xref href="NuvTools.Security.Signing.Azure.KeyVaultSigningOptions.ActivationDelay" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>

    The list of versions is read again every <xref href="NuvTools.Security.Signing.Azure.KeyVaultSigningOptions.RefreshInterval" data-throw-if-not-resolved="false"></xref>.

    When the vault cannot be reached for that, the last list read keeps being served: a rotation

    noticed late is better than no token at all.

    </p>

    <p>

    The identity used needs to list and read the key and to sign with it — the

    <code>Key Vault Crypto User</code> role covers both.

    </p>
  example: []
  syntax:
    content: 'public class KeyVaultSigningKeyProvider : ISigningKeyProvider, IDisposable'
    content.vb: Public Class KeyVaultSigningKeyProvider Implements ISigningKeyProvider, IDisposable
