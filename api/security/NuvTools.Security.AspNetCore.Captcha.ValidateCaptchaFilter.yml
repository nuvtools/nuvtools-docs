  - NuvTools.Security.AspNetCore.Captcha.ValidateCaptchaFilter.OnActionExecutionAsync(Microsoft.AspNetCore.Mvc.Filters.ActionExecutingContext,Microsoft.AspNetCore.Mvc.Filters.ActionExecutionDelegate)
  langs:
  - csharp
  - vb
  name: ValidateCaptchaFilter
  nameWithType: ValidateCaptchaFilter
  fullName: NuvTools.Security.AspNetCore.Captcha.ValidateCaptchaFilter
  type: Class
  assemblies:
  - NuvTools.Security.AspNetCore
  namespace: NuvTools.Security.AspNetCore.Captcha
  summary: Adaptive CAPTCHA action filter (reCAPTCHA Enterprise).
  remarks: >-
    Default flow: the client sends a <b>score</b> token (invisible) in

    <xref href="NuvTools.Security.Captcha.CaptchaDefaults.TokenHeader" data-throw-if-not-resolved="false"></xref> with <xref href="NuvTools.Security.Captcha.CaptchaDefaults.ModeHeader" data-throw-if-not-resolved="false"></xref> set to

    <xref href="NuvTools.Security.Captcha.CaptchaDefaults.ModeScore" data-throw-if-not-resolved="false"></xref>. If the score falls below

    <xref href="NuvTools.Security.Captcha.CaptchaOptions.MinScore" data-throw-if-not-resolved="false"></xref>, the filter answers asking for a <b>step-up</b>

    (<xref href="NuvTools.Security.Captcha.CaptchaDefaults.StepUpMarker" data-throw-if-not-resolved="false"></xref>) and the client resubmits with the checkbox token

    (<xref href="NuvTools.Security.Captcha.CaptchaDefaults.ModeCheckbox" data-throw-if-not-resolved="false"></xref>). Verification is skipped when the CAPTCHA is disabled.
  example: []
  syntax:
    content: 'public sealed class ValidateCaptchaFilter : IAsyncActionFilter, IFilterMetadata'
    content.vb: Public NotInheritable Class ValidateCaptchaFilter Implements IAsyncActionFilter, IFilterMetadata
  inheritance:
