- uid: NuvTools.Security.Biometrics.Serpro.Extensions.SerproBiometricsServiceCollectionExtensions.AddSerproFaceVerification(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String,System.Int32)
  commentId: M:NuvTools.Security.Biometrics.Serpro.Extensions.SerproBiometricsServiceCollectionExtensions.AddSerproFaceVerification(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String,System.Int32)
  id: AddSerproFaceVerification(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String,System.Int32)
  isExtensionMethod: true
  parent: NuvTools.Security.Biometrics.Serpro.Extensions.SerproBiometricsServiceCollectionExtensions
  langs:
  - csharp
  - vb
  name: AddSerproFaceVerification(IServiceCollection, IConfiguration, string, int)
  nameWithType: SerproBiometricsServiceCollectionExtensions.AddSerproFaceVerification(IServiceCollection, IConfiguration, string, int)
  fullName: NuvTools.Security.Biometrics.Serpro.Extensions.SerproBiometricsServiceCollectionExtensions.AddSerproFaceVerification(Microsoft.Extensions.DependencyInjection.IServiceCollection, Microsoft.Extensions.Configuration.IConfiguration, string, int)
  type: Method
  assemblies:
  - NuvTools.Security.Biometrics.Serpro
  namespace: NuvTools.Security.Biometrics.Serpro.Extensions
  summary: >-
    Binds <xref href="NuvTools.Security.Biometrics.Serpro.DatavalidOptions" data-throw-if-not-resolved="false"></xref> from configuration and registers SERPRO Datavalid as the

    <xref href="NuvTools.Security.Biometrics.IFaceVerifier" data-throw-if-not-resolved="false"></xref>, with its own <xref href="System.Net.Http.HttpClient" data-throw-if-not-resolved="false"></xref> and a cached access token.
  remarks: >-
    This is the only place a caller names the provider: everything above it depends on

    <xref href="NuvTools.Security.Biometrics.IFaceVerifier" data-throw-if-not-resolved="false"></xref>, so changing provider is changing this call.
  example: []
  syntax:
    content: public static IServiceCollection AddSerproFaceVerification(this IServiceCollection services, IConfiguration configuration, string sectionName = "Datavalid", int timeoutInSeconds = 30)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection to add the services to.
    - id: configuration
      type: Microsoft.Extensions.Configuration.IConfiguration
      description: Configuration holding the Datavalid section.
    - id: sectionName
      type: System.String
      description: >-
        Name of the section to bind. Defaults to <xref href="NuvTools.Security.Biometrics.Serpro.DatavalidOptions.SectionName" data-throw-if-not-resolved="false"></xref>; pass the

        application's own when its settings already live under another name.
    - id: timeoutInSeconds
      type: System.Int32
      description: Timeout of each call to SERPRO. Defaults to 30 seconds.
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection for chaining.
    content.vb: Public Shared Function AddSerproFaceVerification(services As IServiceCollection, configuration As IConfiguration, sectionName As String = "Datavalid", timeoutInSeconds As Integer = 30) As IServiceCollection
