  namespace: NuvTools.Security.AspNetCore.Blazor.Captcha
  summary: Reusable adaptive CAPTCHA (Google reCAPTCHA Enterprise) for public screens.
  remarks: >-
    Runs <b>invisible</b> by default (score key, via execute) — nothing appears on screen. When the

    server flags the risk as high, the form calls <xref href="NuvTools.Security.AspNetCore.Blazor.Captcha.NuvCaptcha.RequireStepUpAsync" data-throw-if-not-resolved="false"></xref> and the component

    renders the <b>checkbox</b> challenge (checkbox key) as a step-up. Driven by

    <xref href="NuvTools.Security.Captcha.CaptchaOptions" data-throw-if-not-resolved="false"></xref>, registered with <code>AddCaptcha</code>.
  example: []
