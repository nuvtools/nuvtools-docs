- uid: NuvTools.Security.Biometrics.Serpro.DatavalidOptions.AcceptedLiveness
  commentId: P:NuvTools.Security.Biometrics.Serpro.DatavalidOptions.AcceptedLiveness
  id: AcceptedLiveness
  parent: NuvTools.Security.Biometrics.Serpro.DatavalidOptions
  langs:
  - csharp
  - vb
  name: AcceptedLiveness
  nameWithType: DatavalidOptions.AcceptedLiveness
  fullName: NuvTools.Security.Biometrics.Serpro.DatavalidOptions.AcceptedLiveness
  type: Property
  assemblies:
  - NuvTools.Security.Biometrics.Serpro
  namespace: NuvTools.Security.Biometrics.Serpro
  summary: >-
    Liveness values, as SERPRO reports them, that are accepted. Compared ignoring case. Empty (the

    default) leaves the liveness decision to SERPRO alone and only reports the value.
  remarks: >-
    Set it from the values the contracted API version documents: once it holds any value, a capture

    whose liveness is missing or not listed is refused, whatever its similarity.
  example: []
  syntax:
    content: public IList<string> AcceptedLiveness { get; set; }
    parameters: []
    return:
      type: System.Collections.Generic.IList{System.String}
    content.vb: Public Property AcceptedLiveness As IList(Of String)
  overload: NuvTools.Security.Biometrics.Serpro.DatavalidOptions.AcceptedLiveness*
