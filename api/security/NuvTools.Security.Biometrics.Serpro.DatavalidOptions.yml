    similarity. The application decides what counts as a match through <xref href="NuvTools.Security.Biometrics.Serpro.DatavalidOptions.MinSimilarity" data-throw-if-not-resolved="false"></xref> and

    <xref href="NuvTools.Security.Biometrics.Serpro.DatavalidOptions.AcceptedLiveness" data-throw-if-not-resolved="false"></xref>.
