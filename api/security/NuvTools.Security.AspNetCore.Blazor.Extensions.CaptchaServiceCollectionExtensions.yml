  type: Method
  assemblies:
  - NuvTools.Security.AspNetCore.Blazor
  namespace: NuvTools.Security.AspNetCore.Blazor.Extensions
  summary: >-
    Binds <xref href="NuvTools.Security.Captcha.CaptchaOptions" data-throw-if-not-resolved="false"></xref> from the <xref href="NuvTools.Security.Captcha.CaptchaOptions.SectionName" data-throw-if-not-resolved="false"></xref> section and

