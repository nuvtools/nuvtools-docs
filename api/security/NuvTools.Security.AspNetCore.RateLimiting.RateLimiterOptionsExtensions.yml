  fullName: NuvTools.Security.AspNetCore.RateLimiting.RateLimiterOptionsExtensions.SetTooManyRequests(Microsoft.AspNetCore.RateLimiting.OnRejectedContext)
  type: Method
  assemblies:
  - NuvTools.Security.AspNetCore
  namespace: NuvTools.Security.AspNetCore.RateLimiting
  summary: >-
    Sets the response status to 429 and, when the limiter knows it, the <code>Retry-After</code> header

    in seconds.
  remarks: Writes no body, so an API can add its own error envelope and a page can render its own message.
  example: []
  syntax:
    content: public static void SetTooManyRequests(this OnRejectedContext context)
    parameters:
    - id: context
      type: Microsoft.AspNetCore.RateLimiting.OnRejectedContext
      description: The context passed to <xref href="Microsoft.AspNetCore.RateLimiting.RateLimiterOptions.OnRejected" data-throw-if-not-resolved="false"></xref>.
    content.vb: Public Shared Sub SetTooManyRequests(context As OnRejectedContext)
