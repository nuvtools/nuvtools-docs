- uid: NuvTools.Security.AspNetCore.RateLimiting.RateLimiterOptionsExtensions.AddFixedWindowPerClientAddress(Microsoft.AspNetCore.RateLimiting.RateLimiterOptions,System.String,System.Int32,System.TimeSpan)
  commentId: M:NuvTools.Security.AspNetCore.RateLimiting.RateLimiterOptionsExtensions.AddFixedWindowPerClientAddress(Microsoft.AspNetCore.RateLimiting.RateLimiterOptions,System.String,System.Int32,System.TimeSpan)
  id: AddFixedWindowPerClientAddress(Microsoft.AspNetCore.RateLimiting.RateLimiterOptions,System.String,System.Int32,System.TimeSpan)
  isExtensionMethod: true
  parent: NuvTools.Security.AspNetCore.RateLimiting.RateLimiterOptionsExtensions
  langs:
  - csharp
  - vb
  name: AddFixedWindowPerClientAddress(RateLimiterOptions, string, int, TimeSpan)
  nameWithType: RateLimiterOptionsExtensions.AddFixedWindowPerClientAddress(RateLimiterOptions, string, int, TimeSpan)
  fullName: NuvTools.Security.AspNetCore.RateLimiting.RateLimiterOptionsExtensions.AddFixedWindowPerClientAddress(Microsoft.AspNetCore.RateLimiting.RateLimiterOptions, string, int, System.TimeSpan)
  type: Method
  assemblies:
  - NuvTools.Security.AspNetCore
  namespace: NuvTools.Security.AspNetCore.RateLimiting
  summary: >-
    Adds a policy that lets each client address make <code class="paramref">permitLimit</code> requests per

    <code class="paramref">window</code>, and rejects the rest at once.
  remarks: >-
    <p>

    The partition key is the policy name followed by the address. Each policy therefore counts on

    its own: using up the allowance for asking for a reset link does not use up the allowance for

    spending one.

    </p>

    <p>

    There is no queue. A caller past the limit gets the rejection straight away instead of having

    its connection held open.

    </p>

    <p>

    The address is <xref href="Microsoft.AspNetCore.Http.ConnectionInfo.RemoteIpAddress" data-throw-if-not-resolved="false"></xref>. Behind a proxy, call

    <code>UseForwardedHeaders</code> before <code>UseRateLimiter</code>, or every caller shares the proxy's

    address. A request with no address falls into one shared bucket rather than going unlimited.

    An address is something a caller can vary, so this bounds noise and unsophisticated scripts;

    it does not replace account lockout or a uniform answer that hides whether an account exists.

    </p>
  example: []
  syntax:
    content: public static RateLimiterOptions AddFixedWindowPerClientAddress(this RateLimiterOptions options, string policyName, int permitLimit, TimeSpan window)
    parameters:
    - id: options
      type: Microsoft.AspNetCore.RateLimiting.RateLimiterOptions
      description: The rate limiter options to add the policy to.
    - id: policyName
      type: System.String
      description: The name an endpoint uses to apply the policy.
    - id: permitLimit
      type: System.Int32
      description: Requests allowed per address in each window.
    - id: window
      type: System.TimeSpan
      description: Length of the window.
    return:
      type: Microsoft.AspNetCore.RateLimiting.RateLimiterOptions
      description: The options for chaining.
    content.vb: Public Shared Function AddFixedWindowPerClientAddress(options As RateLimiterOptions, policyName As String, permitLimit As Integer, window As TimeSpan) As RateLimiterOptions
  overload: NuvTools.Security.AspNetCore.RateLimiting.RateLimiterOptionsExtensions.AddFixedWindowPerClientAddress*
  nameWithType.vb: RateLimiterOptionsExtensions.AddFixedWindowPerClientAddress(RateLimiterOptions, String, Integer, TimeSpan)
  fullName.vb: NuvTools.Security.AspNetCore.RateLimiting.RateLimiterOptionsExtensions.AddFixedWindowPerClientAddress(Microsoft.AspNetCore.RateLimiting.RateLimiterOptions, String, Integer, System.TimeSpan)
  name.vb: AddFixedWindowPerClientAddress(RateLimiterOptions, String, Integer, TimeSpan)
