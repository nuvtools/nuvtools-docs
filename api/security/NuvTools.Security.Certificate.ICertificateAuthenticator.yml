### YamlMime:ManagedReference
items:
- uid: NuvTools.Security.Certificate.ICertificateAuthenticator
  commentId: T:NuvTools.Security.Certificate.ICertificateAuthenticator
  id: ICertificateAuthenticator
  parent: NuvTools.Security.Certificate
  children:
  - NuvTools.Security.Certificate.ICertificateAuthenticator.CompleteAsync(System.String,System.Threading.CancellationToken)
  - NuvTools.Security.Certificate.ICertificateAuthenticator.StartAsync(System.Threading.CancellationToken)
  langs:
  - csharp
  - vb
  name: ICertificateAuthenticator
  nameWithType: ICertificateAuthenticator
  fullName: NuvTools.Security.Certificate.ICertificateAuthenticator
  type: Interface
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Certificate
  summary: >-
    Authenticates a person by a digital certificate, in two steps: the server opens a challenge, the

    client signs it with the certificate's private key, and the server validates the signature.
  remarks: >-
    The identity is read from the certificate on the server, after the provider confirmed possession of

    the private key and the trust chain. Call <xref href="NuvTools.Security.Certificate.ICertificateAuthenticator.CompleteAsync(System.String%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> inside the sign-in operation

    itself and take the identity from its result — never from a value the client sends.
  example: []
  syntax:
    content: public interface ICertificateAuthenticator
    content.vb: Public Interface ICertificateAuthenticator
  derivedClasses:
  - NuvTools.Security.Certificate.Lacuna.RestPkiCertificateAuthenticator
- uid: NuvTools.Security.Certificate.ICertificateAuthenticator.StartAsync(System.Threading.CancellationToken)
  commentId: M:NuvTools.Security.Certificate.ICertificateAuthenticator.StartAsync(System.Threading.CancellationToken)
  id: StartAsync(System.Threading.CancellationToken)
  parent: NuvTools.Security.Certificate.ICertificateAuthenticator
  langs:
  - csharp
  - vb
  name: StartAsync(CancellationToken)
  nameWithType: ICertificateAuthenticator.StartAsync(CancellationToken)
  fullName: NuvTools.Security.Certificate.ICertificateAuthenticator.StartAsync(System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Certificate
  summary: Opens an authentication on the provider.
  example: []
  syntax:
    content: Task<CertificateChallenge> StartAsync(CancellationToken cancellationToken = default)
    parameters:
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Token to cancel the operation.
    return:
      type: System.Threading.Tasks.Task{NuvTools.Security.Certificate.CertificateChallenge}
      description: The challenge the client signs and sends back.
    content.vb: Function StartAsync(cancellationToken As CancellationToken = Nothing) As Task(Of CertificateChallenge)
  overload: NuvTools.Security.Certificate.ICertificateAuthenticator.StartAsync*
  exceptions:
  - type: System.Exception
    commentId: T:System.Exception
    description: The provider could not be reached or refused the request.
- uid: NuvTools.Security.Certificate.ICertificateAuthenticator.CompleteAsync(System.String,System.Threading.CancellationToken)
  commentId: M:NuvTools.Security.Certificate.ICertificateAuthenticator.CompleteAsync(System.String,System.Threading.CancellationToken)
  id: CompleteAsync(System.String,System.Threading.CancellationToken)
  parent: NuvTools.Security.Certificate.ICertificateAuthenticator
  langs:
  - csharp
  - vb
  name: CompleteAsync(string?, CancellationToken)
  nameWithType: ICertificateAuthenticator.CompleteAsync(string?, CancellationToken)
  fullName: NuvTools.Security.Certificate.ICertificateAuthenticator.CompleteAsync(string?, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Certificate
  summary: Validates the signed challenge and reads the certificate's subject.
  example: []
  syntax:
    content: Task<CertificateAuthentication> CompleteAsync(string? token, CancellationToken cancellationToken = default)
    parameters:
    - id: token
      type: System.String
      description: The token of the challenge the client signed.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Token to cancel the operation.
    return:
      type: System.Threading.Tasks.Task{NuvTools.Security.Certificate.CertificateAuthentication}
      description: >-
        The authentication result. An empty token, a failed validation or a communication failure

        yields <xref href="NuvTools.Security.Certificate.CertificateAuthentication.Valid" data-throw-if-not-resolved="false"></xref> = <code>false</code> (fail-closed).
    content.vb: Function CompleteAsync(token As String, cancellationToken As CancellationToken = Nothing) As Task(Of CertificateAuthentication)
  overload: NuvTools.Security.Certificate.ICertificateAuthenticator.CompleteAsync*
  nameWithType.vb: ICertificateAuthenticator.CompleteAsync(String, CancellationToken)
  fullName.vb: NuvTools.Security.Certificate.ICertificateAuthenticator.CompleteAsync(String, System.Threading.CancellationToken)
  name.vb: CompleteAsync(String, CancellationToken)
