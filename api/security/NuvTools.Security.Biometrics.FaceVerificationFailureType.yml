    <xref href="NuvTools.Security.Biometrics.FaceVerificationFailureType.FaceNotDetected" data-throw-if-not-resolved="false"></xref>, <xref href="NuvTools.Security.Biometrics.FaceVerificationFailureType.LowImageQuality" data-throw-if-not-resolved="false"></xref> and <xref href="NuvTools.Security.Biometrics.FaceVerificationFailureType.MultipleFaces" data-throw-if-not-resolved="false"></xref>, but

    never <xref href="NuvTools.Security.Biometrics.FaceVerificationFailureType.FaceNotOnRecord" data-throw-if-not-resolved="false"></xref>.
