- uid: NuvTools.Security.Signing.RemoteRsaSecurityKey
  commentId: T:NuvTools.Security.Signing.RemoteRsaSecurityKey
  id: RemoteRsaSecurityKey
  parent: NuvTools.Security.Signing
  children:
  - NuvTools.Security.Signing.RemoteRsaSecurityKey.#ctor(System.Security.Cryptography.RSAParameters,System.String,System.Func{System.Byte[],System.Byte[]})
  - NuvTools.Security.Signing.RemoteRsaSecurityKey.PrivateKeyStatus
  - NuvTools.Security.Signing.RemoteRsaSecurityKey.ToSigningCredentials
  langs:
  - csharp
  - vb
  name: RemoteRsaSecurityKey
  nameWithType: RemoteRsaSecurityKey
  fullName: NuvTools.Security.Signing.RemoteRsaSecurityKey
  type: Class
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Signing
  summary: >-
    An RSA key this process holds only the public half of. Creating a signature is handed to a

    delegate — typically a call to the vault or module that keeps the private half.
  remarks: >-
    <p>

    It is an <xref href="Microsoft.IdentityModel.Tokens.RsaSecurityKey" data-throw-if-not-resolved="false"></xref> so that everything that publishes or verifies with the

    public parameters — a JWKS endpoint, a token validator — keeps working unchanged. Only the

    creation of a signature is redirected, through the key's own

    <xref href="Microsoft.IdentityModel.Tokens.SecurityKey.CryptoProviderFactory" data-throw-if-not-resolved="false"></xref>.

    </p>

    <p>

    Signatures are RSASSA-PKCS1-v1_5 with SHA-256 (<code>RS256</code>); the delegate receives the data to

    sign, not a digest, and returns the signature.

    </p>
  example: []
  syntax:
    content: 'public class RemoteRsaSecurityKey : RsaSecurityKey'
    content.vb: Public Class RemoteRsaSecurityKey Inherits RsaSecurityKey
