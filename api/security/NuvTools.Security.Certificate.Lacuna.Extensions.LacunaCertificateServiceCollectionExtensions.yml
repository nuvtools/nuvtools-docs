- uid: NuvTools.Security.Certificate.Lacuna.Extensions.LacunaCertificateServiceCollectionExtensions.AddLacunaCertificateAuthentication(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String)
  commentId: M:NuvTools.Security.Certificate.Lacuna.Extensions.LacunaCertificateServiceCollectionExtensions.AddLacunaCertificateAuthentication(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String)
  id: AddLacunaCertificateAuthentication(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String)
  isExtensionMethod: true
  parent: NuvTools.Security.Certificate.Lacuna.Extensions.LacunaCertificateServiceCollectionExtensions
  langs:
  - csharp
  - vb
  name: AddLacunaCertificateAuthentication(IServiceCollection, IConfiguration, string)
  nameWithType: LacunaCertificateServiceCollectionExtensions.AddLacunaCertificateAuthentication(IServiceCollection, IConfiguration, string)
  fullName: NuvTools.Security.Certificate.Lacuna.Extensions.LacunaCertificateServiceCollectionExtensions.AddLacunaCertificateAuthentication(Microsoft.Extensions.DependencyInjection.IServiceCollection, Microsoft.Extensions.Configuration.IConfiguration, string)
  type: Method
  assemblies:
  - NuvTools.Security.Certificate.Lacuna
  namespace: NuvTools.Security.Certificate.Lacuna.Extensions
  summary: >-
    Binds <xref href="NuvTools.Security.Certificate.Lacuna.RestPkiOptions" data-throw-if-not-resolved="false"></xref> from configuration and registers Lacuna REST PKI as the

    <xref href="NuvTools.Security.Certificate.ICertificateAuthenticator" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    This is the only place a caller names the provider: everything above it depends on

    <xref href="NuvTools.Security.Certificate.ICertificateAuthenticator" data-throw-if-not-resolved="false"></xref>, so changing provider is changing this call.
  example: []
  syntax:
    content: public static IServiceCollection AddLacunaCertificateAuthentication(this IServiceCollection services, IConfiguration configuration, string sectionName = "RestPki")
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection to add the services to.
    - id: configuration
      type: Microsoft.Extensions.Configuration.IConfiguration
      description: Configuration holding the REST PKI section.
    - id: sectionName
      type: System.String
      description: >-
        Name of the section to bind. Defaults to <xref href="NuvTools.Security.Certificate.Lacuna.RestPkiOptions.SectionName" data-throw-if-not-resolved="false"></xref>; pass the

        application's own when its settings already live under another name.
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection for chaining.
    content.vb: Public Shared Function AddLacunaCertificateAuthentication(services As IServiceCollection, configuration As IConfiguration, sectionName As String = "RestPki") As IServiceCollection
  overload: NuvTools.Security.Certificate.Lacuna.Extensions.LacunaCertificateServiceCollectionExtensions.AddLacunaCertificateAuthentication*
  nameWithType.vb: LacunaCertificateServiceCollectionExtensions.AddLacunaCertificateAuthentication(IServiceCollection, IConfiguration, String)
  fullName.vb: NuvTools.Security.Certificate.Lacuna.Extensions.LacunaCertificateServiceCollectionExtensions.AddLacunaCertificateAuthentication(Microsoft.Extensions.DependencyInjection.IServiceCollection, Microsoft.Extensions.Configuration.IConfiguration, String)
  name.vb: AddLacunaCertificateAuthentication(IServiceCollection, IConfiguration, String)
- uid: NuvTools.Security.Certificate.Lacuna.Extensions.LacunaCertificateServiceCollectionExtensions.AddLacunaDocumentSigning(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String)
  commentId: M:NuvTools.Security.Certificate.Lacuna.Extensions.LacunaCertificateServiceCollectionExtensions.AddLacunaDocumentSigning(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String)
  id: AddLacunaDocumentSigning(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration,System.String)
  isExtensionMethod: true
  parent: NuvTools.Security.Certificate.Lacuna.Extensions.LacunaCertificateServiceCollectionExtensions
  langs:
  - csharp
  - vb
  name: AddLacunaDocumentSigning(IServiceCollection, IConfiguration, string)
  nameWithType: LacunaCertificateServiceCollectionExtensions.AddLacunaDocumentSigning(IServiceCollection, IConfiguration, string)
  fullName: NuvTools.Security.Certificate.Lacuna.Extensions.LacunaCertificateServiceCollectionExtensions.AddLacunaDocumentSigning(Microsoft.Extensions.DependencyInjection.IServiceCollection, Microsoft.Extensions.Configuration.IConfiguration, string)
  type: Method
  assemblies:
  - NuvTools.Security.Certificate.Lacuna
  namespace: NuvTools.Security.Certificate.Lacuna.Extensions
  summary: >-
    Binds <xref href="NuvTools.Security.Certificate.Lacuna.RestPkiOptions" data-throw-if-not-resolved="false"></xref> from configuration and registers Lacuna REST PKI as the

    <xref href="NuvTools.Security.Certificate.Signing.IDocumentSigner" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    Independent of <xref href="NuvTools.Security.Certificate.Lacuna.Extensions.LacunaCertificateServiceCollectionExtensions.AddLacunaCertificateAuthentication(Microsoft.Extensions.DependencyInjection.IServiceCollection%2cMicrosoft.Extensions.Configuration.IConfiguration%2cSystem.String)" data-throw-if-not-resolved="false"></xref>: an application that only signs

    documents registers only this, and one that does both calls both — they read the same section.
  example: []
  syntax:
    content: public static IServiceCollection AddLacunaDocumentSigning(this IServiceCollection services, IConfiguration configuration, string sectionName = "RestPki")
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection to add the services to.
    - id: configuration
      type: Microsoft.Extensions.Configuration.IConfiguration
      description: Configuration holding the REST PKI section.
    - id: sectionName
      type: System.String
      description: >-
        Name of the section to bind. Defaults to <xref href="NuvTools.Security.Certificate.Lacuna.RestPkiOptions.SectionName" data-throw-if-not-resolved="false"></xref>; pass the

        application's own when its settings already live under another name.
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The service collection for chaining.
    content.vb: Public Shared Function AddLacunaDocumentSigning(services As IServiceCollection, configuration As IConfiguration, sectionName As String = "RestPki") As IServiceCollection
  overload: NuvTools.Security.Certificate.Lacuna.Extensions.LacunaCertificateServiceCollectionExtensions.AddLacunaDocumentSigning*
  nameWithType.vb: LacunaCertificateServiceCollectionExtensions.AddLacunaDocumentSigning(IServiceCollection, IConfiguration, String)
  fullName.vb: NuvTools.Security.Certificate.Lacuna.Extensions.LacunaCertificateServiceCollectionExtensions.AddLacunaDocumentSigning(Microsoft.Extensions.DependencyInjection.IServiceCollection, Microsoft.Extensions.Configuration.IConfiguration, String)
  name.vb: AddLacunaDocumentSigning(IServiceCollection, IConfiguration, String)
