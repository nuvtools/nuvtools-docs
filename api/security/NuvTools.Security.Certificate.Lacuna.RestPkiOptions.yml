  namespace: NuvTools.Security.Certificate.Lacuna
  summary: >-
    Which roots a certificate must chain to: <xref href="NuvTools.Security.Certificate.Lacuna.RestPkiOptions.PkiBrazilSecurityContext" data-throw-if-not-resolved="false"></xref> (the default),

    <xref href="NuvTools.Security.Certificate.Lacuna.RestPkiOptions.LacunaTestSecurityContext" data-throw-if-not-resolved="false"></xref>, or the id of a security context created in the REST

    PKI console.
  remarks: >-
    <xref href="NuvTools.Security.Certificate.Lacuna.RestPkiOptions.LacunaTestSecurityContext" data-throw-if-not-resolved="false"></xref> accepts certificates anyone can issue. Use it in

    development only.
