  name: NetworkAddressPolicy
  nameWithType: NetworkAddressPolicy
  fullName: NuvTools.Security.Network.NetworkAddressPolicy
  type: Class
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Network
  summary: >-
    Decides whether an outbound connection may reach an address: the building block against

    server-side request forgery (SSRF) when an application fetches a URL somebody else supplied.
  remarks: >-
    <p>

    The decision is taken on the <b>IP address</b>, never on the text of the URL. A host name proves

    nothing about where it resolves — a public domain can carry an <code>A</code> record of <code>10.0.0.5</code>, and

    can change it between a check and the connection (DNS rebinding). Pair this policy with

    <xref href="NuvTools.Security.Network.PublicNetworkConnector" data-throw-if-not-resolved="false"></xref>, which applies it to the address a socket actually connects to.

    </p>

    <p>

    By default only publicly routable unicast addresses are allowed. Denied: loopback, private (RFC 1918

    and IPv6 unique-local), link-local (which includes the cloud instance metadata endpoint

    <code>169.254.169.254</code>), carrier-grade NAT, documentation and benchmarking ranges, multicast,

    reserved space, the IPv6 transition prefixes that embed an IPv4 address, and Azure's platform

    address <code>168.63.129.16</code>, which is public in form and internal in fact.

    </p>
  example: []
  syntax:
    content: public sealed class NetworkAddressPolicy
    content.vb: Public NotInheritable Class NetworkAddressPolicy
