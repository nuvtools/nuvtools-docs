- uid: NuvTools.Security.Network.NetworkAddressPolicy.ResolveAllowedAsync(System.String,System.Threading.CancellationToken)
  commentId: M:NuvTools.Security.Network.NetworkAddressPolicy.ResolveAllowedAsync(System.String,System.Threading.CancellationToken)
  id: ResolveAllowedAsync(System.String,System.Threading.CancellationToken)
  parent: NuvTools.Security.Network.NetworkAddressPolicy
  langs:
  - csharp
  - vb
  name: ResolveAllowedAsync(string, CancellationToken)
  nameWithType: NetworkAddressPolicy.ResolveAllowedAsync(string, CancellationToken)
  fullName: NuvTools.Security.Network.NetworkAddressPolicy.ResolveAllowedAsync(string, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Network
  summary: >-
    Resolves a host and returns its addresses, throwing when the name or any address it resolves to is

    not allowed.
  remarks: >-
    <b>Any</b> denied address refuses the whole name, not just that address. A name answering with one

    public and one private address is either misconfigured or an attempt to win a race, and neither is

    worth connecting to.
  example: []
  syntax:
    content: public Task<IPAddress[]> ResolveAllowedAsync(string host, CancellationToken cancellationToken = default)
    parameters:
    - id: host
      type: System.String
    - id: cancellationToken
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task{System.Net.IPAddress[]}
    content.vb: Public Function ResolveAllowedAsync(host As String, cancellationToken As CancellationToken = Nothing) As Task(Of IPAddress())
  overload: NuvTools.Security.Network.NetworkAddressPolicy.ResolveAllowedAsync*
  exceptions:
  - type: NuvTools.Security.Network.NetworkAddressNotAllowedException
    commentId: T:NuvTools.Security.Network.NetworkAddressNotAllowedException
    description: The host or one of its addresses is denied.
  nameWithType.vb: NetworkAddressPolicy.ResolveAllowedAsync(String, CancellationToken)
