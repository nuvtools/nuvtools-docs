  langs:
  - csharp
  - vb
  name: ZipCodeRegex()
  nameWithType: RegexPattern.ZipCodeRegex()
  fullName: NuvTools.Validation.Brazil.RegexPattern.ZipCodeRegex()
  type: Method
  source:
    href: https://github.com/nuvtools/nuvtools-validation/blob/1c5c284a60fd3b1d536c907513a9a9caa51775fa/src/NuvTools.Validation/obj/Release/net9/System.Text.RegularExpressions.Generator/System.Text.RegularExpressions.Generator.RegexGenerator/RegexGenerator.g.cs
  assemblies:
  - NuvTools.Validation
  namespace: NuvTools.Validation.Brazil
  remarks: >-
    Pattern:<br />


    <pre><code class="lang-csharp">^\\d{5}-?\\d{3}$</code></pre><br />

    Explanation:<br />


    <pre><code class="lang-csharp">○ Match if at the beginning of the string.

    ○ Match a Unicode digit exactly 5 times.

    ○ Match '-' atomically, optionally.

    ○ Match a Unicode digit exactly 3 times.

    ○ Match if at the end of the string or if before an ending newline.</code></pre>
  example: []
  syntax:
    content: >-
      [GeneratedRegex("^\\d{5}-?\\d{3}$")]

      public static Regex ZipCodeRegex()
    return:
      type: System.Text.RegularExpressions.Regex
    content.vb: >-
      <GeneratedRegex("^\d{5}-?\d{3}$")>

