- uid: NuvTools.Validation.RegexPattern.Base64ContentRegex
  commentId: M:NuvTools.Validation.RegexPattern.Base64ContentRegex
  id: Base64ContentRegex
  parent: NuvTools.Validation.RegexPattern
  langs:
  - csharp
  - vb
  name: Base64ContentRegex()
  nameWithType: RegexPattern.Base64ContentRegex()
  fullName: NuvTools.Validation.RegexPattern.Base64ContentRegex()
  type: Method
  source:
    href: https://github.com/nuvtools/nuvtools-validation/blob/1c5c284a60fd3b1d536c907513a9a9caa51775fa/src/NuvTools.Validation/obj/Release/net9/System.Text.RegularExpressions.Generator/System.Text.RegularExpressions.Generator.RegexGenerator/RegexGenerator.g.cs
  assemblies:
  - NuvTools.Validation
  namespace: NuvTools.Validation
  remarks: >-
    Pattern:<br />


    <pre><code class="lang-csharp">^(?&lt;content&gt;(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4}))$</code></pre><br />

    Options:<br />


    <pre><code class="lang-csharp">RegexOptions.Compiled | RegexOptions.CultureInvariant</code></pre><br />

    Explanation:<br />


    <pre><code class="lang-csharp">○ Match if at the beginning of the string.

    ○ "content" capture group.
        ○ Loop greedily any number of times.
            ○ Match a character in the set [+/-9A-Za-z] exactly 4 times.
        ○ Match with 3 alternative expressions.
            ○ Match a sequence of expressions.
                ○ Match a character in the set [+/-9A-Za-z] exactly 2 times.
                ○ Match the string "==".
            ○ Match a sequence of expressions.
                ○ Match a character in the set [+/-9A-Za-z] exactly 3 times.
                ○ Match '='.
            ○ Match a character in the set [+/-9A-Za-z] exactly 4 times.
    ○ Match if at the end of the string or if before an ending newline.</code></pre>
  example: []
  syntax:
    content: >-
      [GeneratedRegex("^(?<content>(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4}))$", RegexOptions.Compiled|RegexOptions.CultureInvariant)]

      public static Regex Base64ContentRegex()
    return:
      type: System.Text.RegularExpressions.Regex
    content.vb: >-
      <GeneratedRegex("^(?<content>(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4}))$", RegexOptions.CompiledOrRegexOptions.CultureInvariant)>

      Public Shared Function Base64ContentRegex() As Regex
  overload: NuvTools.Validation.RegexPattern.Base64ContentRegex*
  attributes:
  - type: System.Text.RegularExpressions.GeneratedRegexAttribute
    ctor: System.Text.RegularExpressions.GeneratedRegexAttribute.#ctor(System.String,System.Text.RegularExpressions.RegexOptions)
    arguments:
    - type: System.String
      value: ^(?<content>(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4}))$
    - type: System.Text.RegularExpressions.RegexOptions
      value: 520
- uid: NuvTools.Validation.RegexPattern.Base64DataUriRegex
  commentId: M:NuvTools.Validation.RegexPattern.Base64DataUriRegex
  id: Base64DataUriRegex
  parent: NuvTools.Validation.RegexPattern
  langs:
  - csharp
  - vb
  name: Base64DataUriRegex()
  nameWithType: RegexPattern.Base64DataUriRegex()
  fullName: NuvTools.Validation.RegexPattern.Base64DataUriRegex()
  type: Method
  source:
    href: https://github.com/nuvtools/nuvtools-validation/blob/1c5c284a60fd3b1d536c907513a9a9caa51775fa/src/NuvTools.Validation/obj/Release/net9/System.Text.RegularExpressions.Generator/System.Text.RegularExpressions.Generator.RegexGenerator/RegexGenerator.g.cs
  assemblies:
  - NuvTools.Validation
  namespace: NuvTools.Validation
  remarks: >-
    Pattern:<br />


    <pre><code class="lang-csharp">^data:(?&lt;type&gt;.+?\\/(?&lt;extension&gt;.+?));(?&lt;base&gt;.+),(?&lt;content&gt;(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4}))$</code></pre><br />

    Options:<br />


    <pre><code class="lang-csharp">RegexOptions.Compiled | RegexOptions.CultureInvariant</code></pre><br />

    Explanation:<br />


    <pre><code class="lang-csharp">○ Match if at the beginning of the string.

    ○ Match the string "data:".

    ○ "type" capture group.
        ○ Match a character other than '\n' lazily at least once.
        ○ Match '/'.
        ○ "extension" capture group.
            ○ Match a character other than '\n' lazily at least once.
    ○ Match ';'.

    ○ "base" capture group.
        ○ Match a character other than '\n' greedily at least once.
    ○ Match ','.

    ○ "content" capture group.
        ○ Loop greedily any number of times.
            ○ Match a character in the set [+/-9A-Za-z] exactly 4 times.
        ○ Match with 3 alternative expressions.
            ○ Match a sequence of expressions.
                ○ Match a character in the set [+/-9A-Za-z] exactly 2 times.
                ○ Match the string "==".
            ○ Match a sequence of expressions.
                ○ Match a character in the set [+/-9A-Za-z] exactly 3 times.
                ○ Match '='.
            ○ Match a character in the set [+/-9A-Za-z] exactly 4 times.
    ○ Match if at the end of the string or if before an ending newline.</code></pre>
  example: []
  syntax:
    content: >-
      [GeneratedRegex("^data:(?<type>.+?\\/(?<extension>.+?));(?<base>.+),(?<content>(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4}))$", RegexOptions.Compiled|RegexOptions.CultureInvariant)]

      public static Regex Base64DataUriRegex()
    return:
      type: System.Text.RegularExpressions.Regex
    content.vb: >-
      <GeneratedRegex("^data:(?<type>.+?\/(?<extension>.+?));(?<base>.+),(?<content>(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4}))$", RegexOptions.CompiledOrRegexOptions.CultureInvariant)>

      Public Shared Function Base64DataUriRegex() As Regex
  overload: NuvTools.Validation.RegexPattern.Base64DataUriRegex*
  attributes:
  - type: System.Text.RegularExpressions.GeneratedRegexAttribute
    ctor: System.Text.RegularExpressions.GeneratedRegexAttribute.#ctor(System.String,System.Text.RegularExpressions.RegexOptions)
    arguments:
    - type: System.String
      value: ^data:(?<type>.+?\/(?<extension>.+?));(?<base>.+),(?<content>(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=|[A-Za-z0-9+/]{4}))$
    - type: System.Text.RegularExpressions.RegexOptions
      value: 520
