- uid: NuvTools.Validation.RegexPattern.EmailRegex
  commentId: M:NuvTools.Validation.RegexPattern.EmailRegex
  id: EmailRegex
  parent: NuvTools.Validation.RegexPattern
  langs:
  - csharp
  - vb
  name: EmailRegex()
  nameWithType: RegexPattern.EmailRegex()
  fullName: NuvTools.Validation.RegexPattern.EmailRegex()
  type: Method
  source:
    href: https://github.com/nuvtools/nuvtools-validation/blob/1c5c284a60fd3b1d536c907513a9a9caa51775fa/src/NuvTools.Validation/obj/Release/net9/System.Text.RegularExpressions.Generator/System.Text.RegularExpressions.Generator.RegexGenerator/RegexGenerator.g.cs
  assemblies:
  - NuvTools.Validation
  namespace: NuvTools.Validation
  remarks: >-
    Pattern:<br />


    <pre><code class="lang-csharp">^([a-z0-9_\\-])([a-z0-9_\\-\\.]*)@((\\[((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\\])|((([a-z0-9\\-]+)\\.)+([a-z]{2,})))$</code></pre><br />

    Options:<br />


    <pre><code class="lang-csharp">RegexOptions.IgnoreCase | RegexOptions.Compiled | RegexOptions.CultureInvariant</code></pre><br />

    Explanation:<br />


    <pre><code class="lang-csharp">○ Match if at the beginning of the string.

    ○ 1st capture group.
        ○ Match a character in the set [-0-9A-Z_a-z\u212A].
    ○ 2nd capture group.
        ○ Match a character in the set [-.0-9A-Z_a-z\u212A] atomically any number of times.
    ○ Match '@'.

    ○ 3rd capture group.
        ○ Match with 2 alternative expressions.
            ○ 4th capture group.
                ○ Match '['.
                ○ Loop exactly 3 times.
                    ○ 5th capture group.
                        ○ 6th capture group.
                            ○ Match with 4 alternative expressions.
                                ○ Match a sequence of expressions.
                                    ○ Match '2'.
                                    ○ Match with 2 alternative expressions.
                                        ○ Match a sequence of expressions.
                                            ○ Match an empty string.
                                            ○ Match a character in the set [0-5].
                                        ○ Match a sequence of expressions.
                                            ○ Match an empty string.
                                            ○ Match a character in the set [0-9].
                                ○ Match a sequence of expressions.
                                    ○ Match '1'.
                                    ○ Match a character in the set [0-9] exactly 2 times.
                                ○ Match a sequence of expressions.
                                    ○ Match a character in the set [1-9].
                                    ○ Match a character in the set [0-9].
                                ○ Match a character in the set [0-9].
                        ○ Match '.'.
                ○ 7th capture group.
                    ○ Match with 4 alternative expressions.
                        ○ Match a sequence of expressions.
                            ○ Match '2'.
                            ○ Match with 2 alternative expressions.
                                ○ Match a sequence of expressions.
                                    ○ Match an empty string.
                                    ○ Match a character in the set [0-5].
                                ○ Match a sequence of expressions.
                                    ○ Match an empty string.
                                    ○ Match a character in the set [0-9].
                        ○ Match a sequence of expressions.
                            ○ Match '1'.
                            ○ Match a character in the set [0-9] exactly 2 times.
                        ○ Match a sequence of expressions.
                            ○ Match a character in the set [1-9].
                            ○ Match a character in the set [0-9].
                        ○ Match a character in the set [0-9].
                ○ Match ']'.
            ○ 8th capture group.
                ○ Loop greedily at least once.
                    ○ 9th capture group.
                        ○ 10th capture group.
                            ○ Match a character in the set [-0-9A-Za-z\u212A] atomically at least once.
                        ○ Match '.'.
                ○ 11th capture group.
                    ○ Match a character in the set [A-Za-z\u212A] atomically at least twice.
    ○ Match if at the end of the string or if before an ending newline.</code></pre>
  example: []
  syntax:
    content: >-
      [GeneratedRegex("^([a-z0-9_\\-])([a-z0-9_\\-\\.]*)@((\\[((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\\])|((([a-z0-9\\-]+)\\.)+([a-z]{2,})))$", RegexOptions.IgnoreCase|RegexOptions.Compiled|RegexOptions.CultureInvariant)]

      public static Regex EmailRegex()
    return:
      type: System.Text.RegularExpressions.Regex
    content.vb: >-
      <GeneratedRegex("^([a-z0-9_\-])([a-z0-9_\-\.]*)@((\[((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9][0-9]|[0-9])\])|((([a-z0-9\-]+)\.)+([a-z]{2,})))$", RegexOptions.IgnoreCaseOrRegexOptions.CompiledOrRegexOptions.CultureInvariant)>

