- uid: NuvTools.Validation.Brazil.Validator.IsCPForCNPJ(System.String)
  commentId: M:NuvTools.Validation.Brazil.Validator.IsCPForCNPJ(System.String)
  id: IsCPForCNPJ(System.String)
  isExtensionMethod: true
  parent: NuvTools.Validation.Brazil.Validator
  langs:
  - csharp
  - vb
  name: IsCPForCNPJ(string)
  nameWithType: Validator.IsCPForCNPJ(string)
  fullName: NuvTools.Validation.Brazil.Validator.IsCPForCNPJ(string)
  type: Method
  source:
    href: https://github.com/nuvtools/nuvtools-validation/blob/1c5c284a60fd3b1d536c907513a9a9caa51775fa/src/NuvTools.Validation/Brazil/Validator.cs
  assemblies:
  - NuvTools.Validation
  namespace: NuvTools.Validation.Brazil
  summary: >-
    Validates a CPF or CNPJ by automatically detecting the document type based on length.

    Accepts both formatted and unformatted input.
  example:
  - >-
    <pre><code class="lang-csharp">bool isValid1 = "123.456.789-01".IsCPForCNPJ(); // Validates as CPF

    bool isValid2 = "12.345.678/0001-95".IsCPForCNPJ(); // Validates as CNPJ</code></pre>
  syntax:
    content: public static bool IsCPForCNPJ(this string value)
    parameters:
    - id: value
      type: System.String
      description: The CPF or CNPJ value to validate (11 digits for CPF, 14 digits for CNPJ).
    return:
      type: System.Boolean
      description: True if the value is a valid CPF or CNPJ; otherwise, false.
    content.vb: Public Shared Function IsCPForCNPJ(value As String) As Boolean
  overload: NuvTools.Validation.Brazil.Validator.IsCPForCNPJ*
  nameWithType.vb: Validator.IsCPForCNPJ(String)
  fullName.vb: NuvTools.Validation.Brazil.Validator.IsCPForCNPJ(String)
  name.vb: IsCPForCNPJ(String)
