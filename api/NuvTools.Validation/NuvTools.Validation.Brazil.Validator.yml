- uid: NuvTools.Validation.Brazil.Validator.IsMobileNumber(System.String)
  commentId: M:NuvTools.Validation.Brazil.Validator.IsMobileNumber(System.String)
  id: IsMobileNumber(System.String)
  isExtensionMethod: true
  parent: NuvTools.Validation.Brazil.Validator
  langs:
  - csharp
  - vb
  name: IsMobileNumber(string)
  nameWithType: Validator.IsMobileNumber(string)
  fullName: NuvTools.Validation.Brazil.Validator.IsMobileNumber(string)
  type: Method
  source:
    href: https://github.com/nuvtools/nuvtools-validation/blob/1c5c284a60fd3b1d536c907513a9a9caa51775fa/src/NuvTools.Validation/Brazil/Validator.cs
  assemblies:
  - NuvTools.Validation
  namespace: NuvTools.Validation.Brazil
  summary: >-
    Validates a Brazilian mobile phone number.

    The method checks if the phone number contains a valid Brazilian area code (DDD),

    followed by the digit 9 and then exactly eight digits (format: XX 9 XXXX-XXXX).
  example:
  - >-
    <pre><code class="lang-csharp">bool isValid = "11987654321".IsMobileNumber(); // São Paulo mobile

    bool isValid2 = "(21) 98765-4321".IsMobileNumber(); // Rio de Janeiro mobile</code></pre>
  syntax:
    content: public static bool IsMobileNumber(this string mobileNumber)
    parameters:
    - id: mobileNumber
      type: System.String
      description: The mobile number to validate (accepts formatted or unformatted input).
    return:
      type: System.Boolean
      description: True if the mobile number is valid; otherwise, false.
    content.vb: Public Shared Function IsMobileNumber(mobileNumber As String) As Boolean
  overload: NuvTools.Validation.Brazil.Validator.IsMobileNumber*
  nameWithType.vb: Validator.IsMobileNumber(String)
  fullName.vb: NuvTools.Validation.Brazil.Validator.IsMobileNumber(String)
  name.vb: IsMobileNumber(String)
