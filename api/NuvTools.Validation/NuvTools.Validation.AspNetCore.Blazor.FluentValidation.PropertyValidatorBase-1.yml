  source:
    href: https://github.com/nuvtools/nuvtools-validation/blob/1df69657dbcaf55cbf8692ac0cb4f5b4c57c5497/src/NuvTools.Validation.AspNetCore.Blazor/FluentValidation/PropertyValidatorBase.cs
  assemblies:
  - NuvTools.Validation.AspNetCore.Blazor
  namespace: NuvTools.Validation.AspNetCore.Blazor.FluentValidation
  summary: >-
    Base abstract validator that provides property-level validation support

    using FluentValidation, specifically designed for MudBlazor MudForm integration.
  remarks: >-
    MudBlazor's MudForm component expects a validation delegate with the signature

    <code>Func&lt;object, string, Task&lt;IEnumerable&lt;string&gt;&gt;&gt;</code>.

    This base class exposes the <xref href="NuvTools.Validation.AspNetCore.Blazor.FluentValidation.PropertyValidatorBase%601.ValidatePropertyAsync" data-throw-if-not-resolved="false"></xref> property that

    matches this signature, enabling seamless integration with MudForm's Validation parameter.
  example:
  - >-
    <pre><code class="lang-csharp">public class MyModelValidator : PropertyValidatorBase&lt;MyModel&gt;

    {
        public MyModelValidator()
        {
            RuleFor(x =&gt; x.Email).NotEmpty().EmailAddress();
        }
    }


    // In Blazor component:

    &lt;MudForm Model="@model" Validation="@(validator.ValidatePropertyAsync)"&gt;
        &lt;MudTextField @bind-Value="model.Email" For="@(() =&gt; model.Email)" /&gt;
    &lt;/MudForm&gt;</code></pre>
  syntax:
    content: 'public abstract class PropertyValidatorBase<T> : AbstractValidator<T>, IValidator<T>, IValidator, IEnumerable<IValidationRule>, IEnumerable'
    typeParameters:
