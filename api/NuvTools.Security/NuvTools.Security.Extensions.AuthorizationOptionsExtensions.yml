  summary: Adds an authorization policy that requires one or more specific claims.
  remarks: Each claim is validated to ensure that its <xref href="System.Security.Claims.Claim.Type" data-throw-if-not-resolved="false"></xref> and <xref href="System.Security.Claims.Claim.Value" data-throw-if-not-resolved="false"></xref> are not empty.
