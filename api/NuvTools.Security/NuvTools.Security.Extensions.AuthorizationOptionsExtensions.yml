    content: public static void AddPolicyWithRequiredClaim(this AuthorizationOptions options, string name, params Claim[] claims)
    parameters:
    - id: options
      type: Microsoft.AspNetCore.Authorization.AuthorizationOptions
      description: The <xref href="Microsoft.AspNetCore.Authorization.AuthorizationOptions" data-throw-if-not-resolved="false"></xref> to which the policy will be added.
    - id: name
      type: System.String
      description: The unique name of the policy.
    - id: claims
      type: System.Security.Claims.Claim[]
      description: The required claims for the policy.
    content.vb: Public Shared Sub AddPolicyWithRequiredClaim(options As AuthorizationOptions, name As String, ParamArray claims As Claim())
  overload: NuvTools.Security.Extensions.AuthorizationOptionsExtensions.AddPolicyWithRequiredClaim*
  exceptions:
