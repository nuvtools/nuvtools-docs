  name: HasValue<T>(ClaimsPrincipal, string, T)
  nameWithType: ClaimsPrincipalExtensions.HasValue<T>(ClaimsPrincipal, string, T)
  fullName: NuvTools.Security.Extensions.ClaimsPrincipalExtensions.HasValue<T>(System.Security.Claims.ClaimsPrincipal, string, T)
  type: Method
  source:
    href: https://github.com/nuvtools/nuvtools-security/blob/7669738f43ffd55b9fc0eca226498e3b0f6acd8c/src/NuvTools.Security/Extensions/ClaimsPrincipalExtensions.cs
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Extensions
  summary: Determines whether the user has a specific value in a custom extension attribute claim.
  remarks: >-
    This method looks for a claim with type "extension_{customAttributeName}" and checks if

    the specified value exists in the comma-separated list of values.
  example: []
  syntax:
    content: public static bool HasValue<T>(this ClaimsPrincipal user, string customAttriuteName, T value)
    parameters:
    - id: user
      type: System.Security.Claims.ClaimsPrincipal
      description: The claims principal representing the user.
    - id: customAttriuteName
      type: System.String
      description: The name of the custom attribute (without the "extension_" prefix).
    - id: value
      type: '{T}'
      description: The value to check for.
    typeParameters:
    - id: T
      description: The type to parse the attribute values as (string, int, double, bool, or enum).
    return:
      type: System.Boolean
      description: True if the user has the specified value in the custom attribute; otherwise, false.
    content.vb: Public Shared Function HasValue(Of T)(user As ClaimsPrincipal, customAttriuteName As String, value As T) As Boolean
  overload: NuvTools.Security.Extensions.ClaimsPrincipalExtensions.HasValue*
  nameWithType.vb: ClaimsPrincipalExtensions.HasValue(Of T)(ClaimsPrincipal, String, T)
  fullName.vb: NuvTools.Security.Extensions.ClaimsPrincipalExtensions.HasValue(Of T)(System.Security.Claims.ClaimsPrincipal, String, T)
  name.vb: HasValue(Of T)(ClaimsPrincipal, String, T)
- uid: NuvTools.Security.Extensions.ClaimsPrincipalExtensions.GetCustomAttributeValues``1(System.Security.Claims.ClaimsPrincipal,System.String)
  commentId: M:NuvTools.Security.Extensions.ClaimsPrincipalExtensions.GetCustomAttributeValues``1(System.Security.Claims.ClaimsPrincipal,System.String)
  id: GetCustomAttributeValues``1(System.Security.Claims.ClaimsPrincipal,System.String)
  isExtensionMethod: true
  parent: NuvTools.Security.Extensions.ClaimsPrincipalExtensions
  langs:
  - csharp
  - vb
  name: GetCustomAttributeValues<T>(ClaimsPrincipal, string)
  nameWithType: ClaimsPrincipalExtensions.GetCustomAttributeValues<T>(ClaimsPrincipal, string)
  fullName: NuvTools.Security.Extensions.ClaimsPrincipalExtensions.GetCustomAttributeValues<T>(System.Security.Claims.ClaimsPrincipal, string)
  type: Method
  source:
    href: https://github.com/nuvtools/nuvtools-security/blob/7669738f43ffd55b9fc0eca226498e3b0f6acd8c/src/NuvTools.Security/Extensions/ClaimsPrincipalExtensions.cs
  assemblies:
  - NuvTools.Security
  namespace: NuvTools.Security.Extensions
  summary: Gets all values from a custom extension attribute claim and parses them as the specified type.
  remarks: >-
    <p>

    This method looks for a claim with type "extension_{customAttributeName}" and expects

    a comma-separated list of values. It parses each value to the specified type.

    </p>

    <p>Supported types: string, int, double, bool, and enum types.</p>

    <p>

    This is commonly used with Azure AD B2C custom attributes that are passed as extension claims.

    </p>
  example:
  - >-
    <pre><code class="lang-csharp">// Get a list of role IDs stored as integers in an extension attribute

    var roleIds = user.GetCustomAttributeValues&lt;int&gt;("roleIds");


    // Get an enum value from a custom attribute

    var permissions = user.GetCustomAttributeValues&lt;PermissionLevel&gt;("permissions");</code></pre>
  syntax:
    content: public static IEnumerable<T>? GetCustomAttributeValues<T>(this ClaimsPrincipal user, string customAttributeName)
    parameters:
    - id: user
      type: System.Security.Claims.ClaimsPrincipal
      description: The claims principal representing the user.
    - id: customAttributeName
      type: System.String
      description: The name of the custom attribute (without the "extension_" prefix).
    typeParameters:
    - id: T
      description: The type to parse the attribute values as (string, int, double, bool, or enum).
    return:
      type: System.Collections.Generic.IEnumerable{{T}}
      description: >-
        A collection of parsed values, or null if the claim doesn't exist.

        Invalid values are filtered out for enum types.
    content.vb: Public Shared Function GetCustomAttributeValues(Of T)(user As ClaimsPrincipal, customAttributeName As String) As IEnumerable(Of T)
  overload: NuvTools.Security.Extensions.ClaimsPrincipalExtensions.GetCustomAttributeValues*
  exceptions:
  - type: System.NotSupportedException
    commentId: T:System.NotSupportedException
    description: Thrown when the type T is not supported.
  - type: System.FormatException
    commentId: T:System.FormatException
    description: Thrown when values cannot be parsed to the specified type.
