    content: public PaymentEventDTO(string EventId, PaymentEventType Type, string ProviderType, string? PayeeAccountId, string? ObjectId, string? CustomerId, string? PaymentMethodId, string? FailureReason, string PayloadJson)
    parameters:
    - id: EventId
      type: System.String
      description: >-
        The provider's own event identifier — the one to key idempotency on, because a provider that

        delivers at least once will deliver the same event twice.
    - id: Type
      type: NuvTools.Payment.Enumerations.PaymentEventType
      description: What the event is, in terms a caller can act on.
    - id: ProviderType
      type: System.String
      description: >-
        The provider's own name for it, kept for the record a caller writes: it says what really arrived,

        including for <xref href="NuvTools.Payment.Enumerations.PaymentEventType.Unknown" data-throw-if-not-resolved="false"></xref>.
    - id: PayeeAccountId
      type: System.String
      description: The payee account the event is about, when it is about one.
    - id: ObjectId
      type: System.String
      description: The identifier of what the event happened to — a payment, an account.
    - id: CustomerId
      type: System.String
      description: The customer the event is about, when it names one.
    - id: PaymentMethodId
      type: System.String
      description: The payment method the event is about, when it names one.
    - id: FailureReason
      type: System.String
      description: Why the provider refused, on an event that reports a refusal.
    - id: PayloadJson
      type: System.String
      description: The raw body, exactly as it was signed.
