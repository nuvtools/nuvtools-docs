  namespace: NuvTools.Payment.DTOs
  summary: A webhook whose signature has been verified, read into the few fields a caller acts on.
  remarks: >-
    <p>

    The provider client does the reading, deliberately: which field of which payload holds the

    customer is the provider's business, and a caller that dug it out of

    <code class="paramref">PayloadJson</code> itself would be coupled to a shape it does not control.

    </p>

    <p>

    <code class="paramref">PayloadJson</code> is still carried, for a caller that needs something this record

    does not model. Treat it as the provider's, not as a contract.

    </p>
