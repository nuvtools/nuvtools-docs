  langs:
  - csharp
  - vb
  name: CreateOnboardingLinkAsync(string, string, string, CancellationToken)
  nameWithType: IPayeeAccountClient.CreateOnboardingLinkAsync(string, string, string, CancellationToken)
  fullName: NuvTools.Payment.Contracts.IPayeeAccountClient.CreateOnboardingLinkAsync(string, string, string, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Payment
  namespace: NuvTools.Payment.Contracts
  summary: >-
    A link to the provider's hosted onboarding. Single-use and short-lived by design, so it is

    created when the payee asks rather than stored.
  example: []
  syntax:
    content: Task<IResult<string>> CreateOnboardingLinkAsync(string accountId, string refreshUrl, string returnUrl, CancellationToken cancellationToken = default)
    parameters:
    - id: accountId
      type: System.String
      description: The account being onboarded.
    - id: refreshUrl
      type: System.String
      description: Where the provider sends the payee when the link has expired.
    - id: returnUrl
      type: System.String
      description: Where it returns them when they are done.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Cancels the call.
    return:
      type: System.Threading.Tasks.Task{NuvTools.Common.ResultWrapper.IResult{System.String}}
    content.vb: Function CreateOnboardingLinkAsync(accountId As String, refreshUrl As String, returnUrl As String, cancellationToken As CancellationToken = Nothing) As Task(Of IResult(Of String))
