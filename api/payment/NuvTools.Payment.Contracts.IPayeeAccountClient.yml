  name: IPayeeAccountClient
  nameWithType: IPayeeAccountClient
  fullName: NuvTools.Payment.Contracts.IPayeeAccountClient
  type: Interface
  assemblies:
  - NuvTools.Payment
  namespace: NuvTools.Payment.Contracts
  summary: 'The receiving side: an account the platform can pay, and the onboarding that makes it payable.'
  remarks: >-
    A marketplace pays people it has not vetted itself. The provider collects the identity and bank

    details, decides whether the account may be paid out, and hosts the screens that ask — so none of

    that reaches the platform, which is the point of using one.
  example: []
  syntax:
    content: public interface IPayeeAccountClient
    content.vb: Public Interface IPayeeAccountClient
  derivedClasses:
