  commentId: T:NuvTools.Payment.Contracts.IPayeeAccountClient
  id: IPayeeAccountClient
  parent: NuvTools.Payment.Contracts
  children:
  - NuvTools.Payment.Contracts.IPayeeAccountClient.CreateAccountAsync(System.String,System.String,System.Collections.Generic.IDictionary{System.String,System.String},System.Threading.CancellationToken)
