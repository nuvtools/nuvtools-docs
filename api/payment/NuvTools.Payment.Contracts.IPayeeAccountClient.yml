- uid: NuvTools.Payment.Contracts.IPayeeAccountClient.CreateAccountAsync(System.String,System.String,System.Collections.Generic.IDictionary{System.String,System.String},System.Threading.CancellationToken)
  commentId: M:NuvTools.Payment.Contracts.IPayeeAccountClient.CreateAccountAsync(System.String,System.String,System.Collections.Generic.IDictionary{System.String,System.String},System.Threading.CancellationToken)
  id: CreateAccountAsync(System.String,System.String,System.Collections.Generic.IDictionary{System.String,System.String},System.Threading.CancellationToken)
  parent: NuvTools.Payment.Contracts.IPayeeAccountClient
  langs:
  - csharp
  - vb
  name: CreateAccountAsync(string, string, IDictionary<string, string>?, CancellationToken)
  nameWithType: IPayeeAccountClient.CreateAccountAsync(string, string, IDictionary<string, string>?, CancellationToken)
  fullName: NuvTools.Payment.Contracts.IPayeeAccountClient.CreateAccountAsync(string, string, System.Collections.Generic.IDictionary<string, string>?, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Payment
  namespace: NuvTools.Payment.Contracts
  summary: Creates an account able to receive transfers, and returns the provider's identifier for it.
  example: []
  syntax:
    content: Task<IResult<string>> CreateAccountAsync(string countryCode, string email, IDictionary<string, string>? metadata = null, CancellationToken cancellationToken = default)
    parameters:
    - id: countryCode
      type: System.String
      description: ISO 3166-1 alpha-2, the country the payee is paid in.
    - id: email
      type: System.String
      description: Where the provider writes to the payee.
    - id: metadata
      type: System.Collections.Generic.IDictionary{System.String,System.String}
      description: Carried on the provider's object; the caller's own identifiers belong here.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Cancels the call.
    return:
      type: System.Threading.Tasks.Task{NuvTools.Common.ResultWrapper.IResult{System.String}}
    content.vb: Function CreateAccountAsync(countryCode As String, email As String, metadata As IDictionary(Of String, String) = Nothing, cancellationToken As CancellationToken = Nothing) As Task(Of IResult(Of String))
