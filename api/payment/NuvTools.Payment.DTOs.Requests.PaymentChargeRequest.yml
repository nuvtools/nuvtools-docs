  type: Constructor
  assemblies:
  - NuvTools.Payment
  namespace: NuvTools.Payment.DTOs.Requests
  summary: What one charge needs.
  example: []
  syntax:
    content: public PaymentChargeRequest(string CustomerId, string? PaymentMethodId, long AmountMinor, string CurrencyCode, string? Description, string IdempotencyKey, string? TransferGroup = null, IDictionary<string, string>? Metadata = null)
    parameters:
    - id: CustomerId
      type: System.String
      description: Who is charged.
    - id: PaymentMethodId
      type: System.String
      description: Which saved method; null for the customer's default, which is what a scheduled bill wants.
    - id: AmountMinor
      type: System.Int64
      description: >-
        How much, in the currency's minor units — 4990 is BRL 49.90, 1000 is JPY 1,000. Providers count

        money this way because a decimal cannot say what a currency's smallest coin is.
    - id: CurrencyCode
      type: System.String
      description: ISO 4217, in any case.
    - id: Description
      type: System.String
      description: What the customer sees on their statement.
    - id: IdempotencyKey
      type: System.String
      description: >-
        The caller's own key. Sending the same key twice returns the first answer instead of charging

        twice, which is what makes a retried job safe. It is the caller's because only the caller knows

        what "the same charge" means — and a key that has already answered a failure will keep answering

        it, so a retry after a refusal needs a key of its own.
    - id: TransferGroup
      type: System.String
      description: Ties this charge to the transfers paid out of it, for providers that support it.
    - id: Metadata
      type: System.Collections.Generic.IDictionary{System.String,System.String}
      description: Carried on the provider's object; the caller's own identifiers belong here.
