  namespace: NuvTools.Payment.Omie.ApiClient.DTOs.Responses
  summary: >-
    A service of the Omie catalog, as <code>ListarCadastroServico</code> returns it.


    <p>

    The two codes exist and are not interchangeable: <xref href="NuvTools.Payment.Omie.ApiClient.DTOs.Responses.OmieServiceInfo.Code" data-throw-if-not-resolved="false"></xref> is the business code (<code>cCodigo</code>, e.g.

    "SRV00016"), the one applications store in their own configuration, while <xref href="NuvTools.Payment.Omie.ApiClient.DTOs.Responses.OmieServiceInfo.ServiceCode" data-throw-if-not-resolved="false"></xref> is Omie's

    internal identifier (<code>nCodServico</code>), the only one accepted when building service order items. Translating

    one into the other is the reason the whole catalog is read.

    </p>
  example: []
  syntax:
    content: 'public record OmieServiceInfo : IEquatable<OmieServiceInfo>'
