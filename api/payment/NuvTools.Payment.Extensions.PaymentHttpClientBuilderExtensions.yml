- uid: NuvTools.Payment.Extensions.PaymentHttpClientBuilderExtensions.StandardPaymentResilience
  commentId: F:NuvTools.Payment.Extensions.PaymentHttpClientBuilderExtensions.StandardPaymentResilience
  id: StandardPaymentResilience
  parent: NuvTools.Payment.Extensions.PaymentHttpClientBuilderExtensions
  langs:
  - csharp
  - vb
  name: StandardPaymentResilience
  nameWithType: PaymentHttpClientBuilderExtensions.StandardPaymentResilience
  fullName: NuvTools.Payment.Extensions.PaymentHttpClientBuilderExtensions.StandardPaymentResilience
  type: Field
  assemblies:
  - NuvTools.Payment
  namespace: NuvTools.Payment.Extensions
  summary: >-
    The canonical resilience policy applied to payment provider HttpClients:

    2 retries with 1s delay, 30s per-attempt timeout, 60s circuit-breaker sampling,

    90s total request timeout.
  example: []
  syntax:
    content: public static readonly Action<HttpStandardResilienceOptions> StandardPaymentResilience
    return:
      type: System.Action{Microsoft.Extensions.Http.Resilience.HttpStandardResilienceOptions}
