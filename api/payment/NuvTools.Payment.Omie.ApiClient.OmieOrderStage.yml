  - NuvTools.Payment.Omie.ApiClient
  namespace: NuvTools.Payment.Omie.ApiClient
  summary: >-
    The service order stage (<code>cEtapa</code>) in Omie. The API documents five values — 10, 20, 30, 40 and 50 (invoice)

    — but an account may have its own Kanban columns, and the query returns the real stage (60 has been seen).

    Echoing that stage back on a change means sending a value outside the domain the API accepts; since

    <code>cEtapa</code> is optional on AlterarOS, the right move is to omit it and leave the order where it is.
