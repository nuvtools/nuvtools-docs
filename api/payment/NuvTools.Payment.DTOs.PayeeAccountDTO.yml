  summary: A payee's account at the provider, in the four answers a platform acts on.
  remarks: >-
    <b>These are the provider's answers, to be copied and not decided.</b> A platform that gates a

    paid offer on <xref href="NuvTools.Payment.DTOs.PayeeAccountDTO.PayoutsEnabled" data-throw-if-not-resolved="false"></xref> is reading what the provider will actually do, rather

    than its own guess at it.
