  summary: A payee's account at the provider, in the four answers a platform acts on.
  remarks: >-
    <b>These are the provider's answers, to be copied and not decided.</b> A platform that gates a

    paid offer on <xref href="NuvTools.Payment.DTOs.PayeeAccountDTO.PayoutsEnabled" data-throw-if-not-resolved="false"></xref> is reading what the provider will actually do, rather

    than its own guess at it.
  example: []
  syntax:
    content: public PayeeAccountDTO(string AccountId, bool ChargesEnabled, bool PayoutsEnabled, bool DetailsSubmitted, string? DisabledReason)
    parameters:
    - id: AccountId
      type: System.String
      description: The provider's identifier for the account.
    - id: ChargesEnabled
      type: System.Boolean
      description: Whether the account may be charged.
    - id: PayoutsEnabled
      type: System.Boolean
      description: Whether the provider will pay the account out. Until it is true, money sent there cannot leave.
    - id: DetailsSubmitted
      type: System.Boolean
      description: >-
        Whether onboarding was completed, which is not the same as being enabled: the provider may still

        be checking what was submitted.
    - id: DisabledReason
      type: System.String
      description: Why the provider is holding the account back, when it is.
    content.vb: Public Sub New(AccountId As String, ChargesEnabled As Boolean, PayoutsEnabled As Boolean, DetailsSubmitted As Boolean, DisabledReason As String)
