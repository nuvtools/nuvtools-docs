    - id: OsCode
      type: System.Int64
      description: Omie's internal service order identifier (<code>nCodOS</code>).
    - id: OsNumber
      type: System.String
      description: Service order number as the user sees it (<code>cNumOS</code>).
    - id: Stage
      type: System.String
      description: Kanban stage (<code>cEtapa</code>).
    - id: IsCancelled
      type: System.Boolean
      description: The service order was cancelled in Omie (<code>cCancelada</code>).
    - id: IsInvoiced
      type: System.Boolean
      description: Invoicing was triggered (<code>cFaturada</code>) — which does not guarantee an authorized invoice.
    - id: TotalValue
      type: System.Decimal
      description: Service order total (<code>nValorTot</code>).
