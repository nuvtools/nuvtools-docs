  name: OmieContractProvider
  nameWithType: OmieContractProvider
  fullName: NuvTools.Payment.Omie.ApiClient.Services.OmieContractProvider
  type: Class
  assemblies:
  - NuvTools.Payment.Omie.ApiClient
  namespace: NuvTools.Payment.Omie.ApiClient.Services
  summary: >-
    Omie Service Contracts, read whole (<code>ListarContratos</code>, paginated) and indexed by the contract number

    (<code>cNumCtr</code>) — the number a caller's own configuration stores, because it is what the user reads in Omie.

    A contract is a price registry: it carries the negotiated value and the validity period of one client, and is

    never billed through.


    <p>

    Listed whole and cached for <xref href="NuvTools.Payment.Omie.ApiClient.Services.OmieContractProvider.CacheDuration" data-throw-if-not-resolved="false"></xref>, never consulted one by one. A screen that shows contracts

    in a grid would otherwise ask Omie once per row, and Omie answers a burst of repeated calls with

    "Consumo redundante detectado" — which blocks the app_key for every other integration, not just the grid.

    </p>
  example: []
