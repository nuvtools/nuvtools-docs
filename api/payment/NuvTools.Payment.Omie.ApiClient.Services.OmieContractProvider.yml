- uid: NuvTools.Payment.Omie.ApiClient.Services.OmieContractProvider.NormalizeNumber(System.String)
  commentId: M:NuvTools.Payment.Omie.ApiClient.Services.OmieContractProvider.NormalizeNumber(System.String)
  id: NormalizeNumber(System.String)
  parent: NuvTools.Payment.Omie.ApiClient.Services.OmieContractProvider
  langs:
  - csharp
  - vb
  name: NormalizeNumber(string?)
  nameWithType: OmieContractProvider.NormalizeNumber(string?)
  fullName: NuvTools.Payment.Omie.ApiClient.Services.OmieContractProvider.NormalizeNumber(string?)
  type: Method
  assemblies:
  - NuvTools.Payment.Omie.ApiClient
  namespace: NuvTools.Payment.Omie.ApiClient.Services
  summary: >-
    The key both sides of the match are reduced to: letters and digits only, upper-cased. Everything else —

    spaces, dots, slashes, hyphens — is dropped.


    <p>

    The contract number is read off a screen and typed into the caller's configuration by hand, so "CTR 001/2026",

    "ctr-001-2026" and "CTR0012026" are the same contract for the person typing it, and matching them literally

    would report a contract that plainly exists in Omie as missing. Callers must run their stored number through

    this same function — <xref href="NuvTools.Payment.Omie.ApiClient.Services.OmieContractProvider.GetAsync(System.String%2cSystem.Boolean%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> does it for them.

    </p>
  example: []
  syntax:
    content: public static string NormalizeNumber(string? value)
    parameters:
    - id: value
      type: System.String
    return:
      type: System.String
    content.vb: Public Shared Function NormalizeNumber(value As String) As String
  overload: NuvTools.Payment.Omie.ApiClient.Services.OmieContractProvider.NormalizeNumber*
  nameWithType.vb: OmieContractProvider.NormalizeNumber(String)
  fullName.vb: NuvTools.Payment.Omie.ApiClient.Services.OmieContractProvider.NormalizeNumber(String)
  name.vb: NormalizeNumber(String)
