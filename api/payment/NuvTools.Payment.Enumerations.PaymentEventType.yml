- uid: NuvTools.Payment.Enumerations.PaymentEventType.PaymentRefunded
  commentId: F:NuvTools.Payment.Enumerations.PaymentEventType.PaymentRefunded
  id: PaymentRefunded
  parent: NuvTools.Payment.Enumerations.PaymentEventType
  langs:
  - csharp
  - vb
  name: PaymentRefunded
  nameWithType: PaymentEventType.PaymentRefunded
  fullName: NuvTools.Payment.Enumerations.PaymentEventType.PaymentRefunded
  type: Field
  assemblies:
  - NuvTools.Payment
  namespace: NuvTools.Payment.Enumerations
  summary: A payment was refunded, in whole or in part.
  remarks: >-
    Sent for a refund the caller asked for <i>and</i> for one raised at the provider — a dispute

    resolved in the customer's favour, or somebody acting in the provider's dashboard. That is

    why it is worth acting on rather than inferring from the caller's own refund call: the

    caller's records are otherwise the last to know.
  example: []
  syntax:
    content: PaymentRefunded = 5
    return:
      type: NuvTools.Payment.Enumerations.PaymentEventType
