  name: PaymentEventType
  nameWithType: PaymentEventType
  fullName: NuvTools.Payment.Enumerations.PaymentEventType
  type: Enum
  assemblies:
  - NuvTools.Payment
  namespace: NuvTools.Payment.Enumerations
  summary: The kinds of webhook a payment provider sends that a caller is expected to act on.
  remarks: >-
    A provider client maps its own event names onto these. Anything it does not recognise arrives as

    <xref href="NuvTools.Payment.Enumerations.PaymentEventType.Unknown" data-throw-if-not-resolved="false"></xref> rather than being dropped, because a caller still has to record that a

    delivery happened — an endpoint that fails on an event it has no use for makes the provider retry

    it for days.
  example: []
  syntax:
    content: public enum PaymentEventType
    content.vb: Public Enum PaymentEventType
