  type: Method
  assemblies:
  - NuvTools.Payment.Stripe.ApiClient
  namespace: NuvTools.Payment.Stripe.ApiClient.Services
  summary: The event, when the signature matches; a failure when it does not.
  example: []
  syntax:
    content: public IResult<PaymentEventDTO> Verify(string payload, string? signature, PaymentWebhookEndpointType endpoint = PaymentWebhookEndpointType.Platform)
    parameters:
    - id: payload
      type: System.String
      description: >-
        The request body exactly as received. Re-serializing it — even into an equivalent document —

        breaks the signature, so it has to be read as a string before anything parses it.
    - id: signature
      type: System.String
      description: The signature header the provider sent it with.
    - id: endpoint
      type: NuvTools.Payment.Enumerations.PaymentWebhookEndpointType
      description: Which endpoint it arrived on, for providers that sign each one separately.
    return:
      type: NuvTools.Common.ResultWrapper.IResult{NuvTools.Payment.DTOs.PaymentEventDTO}
    content.vb: Public Function Verify(payload As String, signature As String, endpoint As PaymentWebhookEndpointType = PaymentWebhookEndpointType.Platform) As IResult(Of PaymentEventDTO)
