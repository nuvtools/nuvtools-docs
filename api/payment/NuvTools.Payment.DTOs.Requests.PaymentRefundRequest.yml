  name: PaymentRefundRequest(string, long, string?, string, IDictionary<string, string>?)
  nameWithType: PaymentRefundRequest.PaymentRefundRequest(string, long, string?, string, IDictionary<string, string>?)
  fullName: NuvTools.Payment.DTOs.Requests.PaymentRefundRequest.PaymentRefundRequest(string, long, string?, string, System.Collections.Generic.IDictionary<string, string>?)
  type: Constructor
  assemblies:
  - NuvTools.Payment
  namespace: NuvTools.Payment.DTOs.Requests
  summary: What one refund needs.
  example: []
  syntax:
    content: public PaymentRefundRequest(string PaymentId, long AmountMinor, string? Reason, string IdempotencyKey, IDictionary<string, string>? Metadata = null)
    parameters:
    - id: PaymentId
      type: System.String
      description: >-
        The payment being given back, as the provider named it when it was taken — not the customer. A

        refund belongs to one payment, because that is what the money can travel back along.
    - id: AmountMinor
      type: System.Int64
      description: >-
        How much, in the currency's minor units. Always stated rather than defaulted to the whole

        payment: a partial refund is the common case for a marketplace crediting one line of an invoice,

        and a null that quietly meant "all of it" is the kind of default that refunds a month when

        somebody meant to refund a day.
    - id: Reason
      type: System.String
      description: Why, for the provider's own record. Free text; providers vary.
    - id: IdempotencyKey
      type: System.String
      description: >-
        The caller's own key. Refunding twice gives away the money twice and cannot be taken back, so

        this is as load-bearing here as it is on a transfer.
    - id: Metadata
      type: System.Collections.Generic.IDictionary{System.String,System.String}
      description: Carried on the provider's object; the caller's own identifiers belong here.
    content.vb: Public Sub New(PaymentId As String, AmountMinor As Long, Reason As String, IdempotencyKey As String, Metadata As IDictionary(Of String, String) = Nothing)
