  name: OmieServiceOrderBillingProvider
  nameWithType: OmieServiceOrderBillingProvider
  fullName: NuvTools.Payment.Omie.ApiClient.Services.OmieServiceOrderBillingProvider
  type: Class
  assemblies:
  - NuvTools.Payment.Omie.ApiClient
  namespace: NuvTools.Payment.Omie.ApiClient.Services
  summary: >-
    Invoicing of a single service order in Omie — the documented path to issue the NFS-e of one OS, which

    <xref href="NuvTools.Payment.Omie.ApiClient.Contracts.IOmieApiClient" data-throw-if-not-resolved="false"></xref> does not cover and therefore goes through the direct client:


    <ol><li><code>StatusOS</code> (<code>servicos/os/</code>): fiscal state of the order — stage, whether it was cancelled,

    whether it was already invoiced and the NFS-e that came out of it. It is the query that says whether there is

    anything to do, and the one that confirms the result afterwards.</li><li><code>ValidarOS</code> (<code>servicos/osp/</code>): Omie's validation before invoicing. It is what points out, in the

    API's own words, which required data is missing on the order or on the client registration — instead of finding

    out through the city hall's rejection, after the invoice was already requested.</li><li><code>FaturarOS</code> (<code>servicos/osp/</code>): invoices that order. The equivalent of "Faturar Selecionada" in

    the Omie UI — not to be confused with <code>FaturarLoteOS</code> (<code>servicos/oslote/</code>), which invoices <b>every</b>

    order of a stage and, triggered for one client, would take the others along.</li></ol>

    <p>

    None of them invents data: the invoice content is the order's. What is decided here is only <i>when</i> to ask

    for the invoice.

    </p>
