- uid: NuvTools.Payment.Omie.ApiClient.Services.OmieCategoryProvider.GetRevenueCategoriesAsync(System.Boolean,System.Threading.CancellationToken)
  commentId: M:NuvTools.Payment.Omie.ApiClient.Services.OmieCategoryProvider.GetRevenueCategoriesAsync(System.Boolean,System.Threading.CancellationToken)
  id: GetRevenueCategoriesAsync(System.Boolean,System.Threading.CancellationToken)
  parent: NuvTools.Payment.Omie.ApiClient.Services.OmieCategoryProvider
  langs:
  - csharp
  - vb
  name: GetRevenueCategoriesAsync(bool, CancellationToken)
  nameWithType: OmieCategoryProvider.GetRevenueCategoriesAsync(bool, CancellationToken)
  fullName: NuvTools.Payment.Omie.ApiClient.Services.OmieCategoryProvider.GetRevenueCategoriesAsync(bool, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Payment.Omie.ApiClient
  namespace: NuvTools.Payment.Omie.ApiClient.Services
  summary: >-
    Usable revenue categories of the chart of accounts — the list an application offers for selection.

    With <code class="paramref">forceRefresh</code> the cache is ignored and rewritten with whatever Omie returns, which is

    what a "reload from the ERP" action needs: without it the button would serve the cached list for the next

    30 minutes and look like it did nothing.
  example: []
  syntax:
