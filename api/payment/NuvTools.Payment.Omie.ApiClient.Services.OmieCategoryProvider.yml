      type: System.Boolean
    - id: cancellationToken
      type: System.Threading.CancellationToken
    return:
      type: System.Threading.Tasks.Task{NuvTools.Common.ResultWrapper.IResult{System.Collections.Generic.IReadOnlyList{NuvTools.Payment.Omie.ApiClient.DTOs.Responses.OmieCategory}}}
