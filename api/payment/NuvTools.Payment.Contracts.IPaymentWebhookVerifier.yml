- uid: NuvTools.Payment.Contracts.IPaymentWebhookVerifier
  commentId: T:NuvTools.Payment.Contracts.IPaymentWebhookVerifier
  id: IPaymentWebhookVerifier
  parent: NuvTools.Payment.Contracts
  children:
  - NuvTools.Payment.Contracts.IPaymentWebhookVerifier.Verify(System.String,System.String,NuvTools.Payment.Enumerations.PaymentWebhookEndpointType)
  langs:
