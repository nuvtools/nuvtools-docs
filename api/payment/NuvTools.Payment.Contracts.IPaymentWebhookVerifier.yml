  name: IPaymentWebhookVerifier
  nameWithType: IPaymentWebhookVerifier
  fullName: NuvTools.Payment.Contracts.IPaymentWebhookVerifier
  type: Interface
  assemblies:
  - NuvTools.Payment
  namespace: NuvTools.Payment.Contracts
  summary: Checks that a webhook really came from the provider, and reads it.
  remarks: >-
    A webhook endpoint is public, so the signature is the whole of its authentication: an unverified

    body is an anonymous stranger's, and acting on one would let anybody mark a bill paid.
  example: []
  syntax:
    content: public interface IPaymentWebhookVerifier
    content.vb: Public Interface IPaymentWebhookVerifier
  derivedClasses:
  - NuvTools.Payment.Stripe.ApiClient.Services.StripeWebhookVerifier
- uid: NuvTools.Payment.Contracts.IPaymentWebhookVerifier.Verify(System.String,System.String,NuvTools.Payment.Enumerations.PaymentWebhookEndpointType)
  commentId: M:NuvTools.Payment.Contracts.IPaymentWebhookVerifier.Verify(System.String,System.String,NuvTools.Payment.Enumerations.PaymentWebhookEndpointType)
  id: Verify(System.String,System.String,NuvTools.Payment.Enumerations.PaymentWebhookEndpointType)
  parent: NuvTools.Payment.Contracts.IPaymentWebhookVerifier
  langs:
  - csharp
  - vb
  name: Verify(string, string?, PaymentWebhookEndpointType)
  nameWithType: IPaymentWebhookVerifier.Verify(string, string?, PaymentWebhookEndpointType)
  fullName: NuvTools.Payment.Contracts.IPaymentWebhookVerifier.Verify(string, string?, NuvTools.Payment.Enumerations.PaymentWebhookEndpointType)
  type: Method
  assemblies:
  - NuvTools.Payment
  namespace: NuvTools.Payment.Contracts
  summary: The event, when the signature matches; a failure when it does not.
  example: []
  syntax:
    content: IResult<PaymentEventDTO> Verify(string payload, string? signature, PaymentWebhookEndpointType endpoint = PaymentWebhookEndpointType.Platform)
    parameters:
    - id: payload
      type: System.String
      description: >-
        The request body exactly as received. Re-serializing it — even into an equivalent document —

        breaks the signature, so it has to be read as a string before anything parses it.
    - id: signature
      type: System.String
      description: The signature header the provider sent it with.
    - id: endpoint
      type: NuvTools.Payment.Enumerations.PaymentWebhookEndpointType
      description: Which endpoint it arrived on, for providers that sign each one separately.
    return:
      type: NuvTools.Common.ResultWrapper.IResult{NuvTools.Payment.DTOs.PaymentEventDTO}
    content.vb: Function Verify(payload As String, signature As String, endpoint As PaymentWebhookEndpointType = PaymentWebhookEndpointType.Platform) As IResult(Of PaymentEventDTO)
