  summary: >-
    Omie checking accounts (<code>geral/contacorrente/</code>) — the list an application offers so the user can pick where

    the receivable of a service order lands (<code>nCodCC</code>, required on inclusion).


    <p>

    Blocked accounts are left out: Omie lists them but does not accept entries on them.

    </p>
