  name: IsMissingOrderIdentification(string?)
  nameWithType: OmieFaultClassifier.IsMissingOrderIdentification(string?)
  fullName: NuvTools.Payment.Omie.ApiClient.OmieFaultClassifier.IsMissingOrderIdentification(string?)
  type: Method
  assemblies:
  - NuvTools.Payment.Omie.ApiClient
  namespace: NuvTools.Payment.Omie.ApiClient
  summary: >-
    True when AlterarOS refused the change claiming the OS identification tags were not informed. Intermittent:

    the same body, byte for byte, has been accepted and refused by Omie minutes apart. Retrying later is the

    only remedy — but not immediately, since an identical repeated call is what Omie punishes as redundant

    consumption.
  example: []
  syntax:
    content: public static bool IsMissingOrderIdentification(string? message)
    parameters:
    - id: message
      type: System.String
    return:
      type: System.Boolean
    content.vb: Public Shared Function IsMissingOrderIdentification(message As String) As Boolean
