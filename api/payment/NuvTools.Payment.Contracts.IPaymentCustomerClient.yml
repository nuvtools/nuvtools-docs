  type: Method
  assemblies:
  - NuvTools.Payment
  namespace: NuvTools.Payment.Contracts
  summary: A provider-hosted page for saving a payment method, and the address to send the customer to.
  remarks: >-
    The saved method is reported by a webhook rather than by the return address, which the

    customer may never reach.
  example: []
  syntax:
    content: Task<IResult<string>> CreateHostedPaymentMethodPageAsync(HostedPaymentMethodPageRequest request, CancellationToken cancellationToken = default)
    parameters:
    - id: request
      type: NuvTools.Payment.DTOs.Requests.HostedPaymentMethodPageRequest
      description: Whose method, where to return to, and the currency it will be charged in.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Cancels the call.
    return:
      type: System.Threading.Tasks.Task{NuvTools.Common.ResultWrapper.IResult{System.String}}
    content.vb: Function CreateHostedPaymentMethodPageAsync(request As HostedPaymentMethodPageRequest, cancellationToken As CancellationToken = Nothing) As Task(Of IResult(Of String))
