- uid: NuvTools.Payment.Contracts.IPaymentCustomerClient.CreatePaymentMethodIntentAsync(System.String,System.Threading.CancellationToken)
  commentId: M:NuvTools.Payment.Contracts.IPaymentCustomerClient.CreatePaymentMethodIntentAsync(System.String,System.Threading.CancellationToken)
  id: CreatePaymentMethodIntentAsync(System.String,System.Threading.CancellationToken)
  parent: NuvTools.Payment.Contracts.IPaymentCustomerClient
  langs:
  - csharp
  - vb
  name: CreatePaymentMethodIntentAsync(string, CancellationToken)
  nameWithType: IPaymentCustomerClient.CreatePaymentMethodIntentAsync(string, CancellationToken)
  fullName: NuvTools.Payment.Contracts.IPaymentCustomerClient.CreatePaymentMethodIntentAsync(string, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Payment
  namespace: NuvTools.Payment.Contracts
  summary: >-
    An attempt at saving a payment method for later, off-session use, for a caller that hosts its

    own form.
  remarks: >-
    Hosting the form means the card and the provider's script reach the caller's own origin, which

    is a PCI surface and a content security policy exception.

    <xref href="NuvTools.Payment.Contracts.IPaymentCustomerClient.CreateHostedPaymentMethodPageAsync(NuvTools.Payment.DTOs.Requests.HostedPaymentMethodPageRequest%2cSystem.Threading.CancellationToken)" data-throw-if-not-resolved="false"></xref> is the alternative that avoids both.
  example: []
  syntax:
    content: Task<IResult<PaymentMethodIntentDTO>> CreatePaymentMethodIntentAsync(string customerId, CancellationToken cancellationToken = default)
    parameters:
    - id: customerId
      type: System.String
      description: Whose payment method is being saved.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Cancels the call.
    return:
      type: System.Threading.Tasks.Task{NuvTools.Common.ResultWrapper.IResult{NuvTools.Payment.DTOs.PaymentMethodIntentDTO}}
    content.vb: Function CreatePaymentMethodIntentAsync(customerId As String, cancellationToken As CancellationToken = Nothing) As Task(Of IResult(Of PaymentMethodIntentDTO))
  overload: NuvTools.Payment.Contracts.IPaymentCustomerClient.CreatePaymentMethodIntentAsync*
  nameWithType.vb: IPaymentCustomerClient.CreatePaymentMethodIntentAsync(String, CancellationToken)
  fullName.vb: NuvTools.Payment.Contracts.IPaymentCustomerClient.CreatePaymentMethodIntentAsync(String, System.Threading.CancellationToken)
  name.vb: CreatePaymentMethodIntentAsync(String, CancellationToken)
