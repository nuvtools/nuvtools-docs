- uid: NuvTools.Payment.Contracts.IPaymentRefundClient
  commentId: T:NuvTools.Payment.Contracts.IPaymentRefundClient
  id: IPaymentRefundClient
  parent: NuvTools.Payment.Contracts
  children:
  - NuvTools.Payment.Contracts.IPaymentRefundClient.RefundAsync(NuvTools.Payment.DTOs.Requests.PaymentRefundRequest,System.Threading.CancellationToken)
  langs:
  - csharp
  - vb
  name: IPaymentRefundClient
  nameWithType: IPaymentRefundClient
  fullName: NuvTools.Payment.Contracts.IPaymentRefundClient
  type: Interface
  assemblies:
  - NuvTools.Payment
  namespace: NuvTools.Payment.Contracts
  summary: 'Giving money back: refunding part or all of a payment the customer already made.'
  remarks: >-
    <p>

    <b>Separate from <xref href="NuvTools.Payment.Contracts.IPaymentChargeClient" data-throw-if-not-resolved="false"></xref>, for the reason charges and transfers are

    separate.</b> Refunding is not the inverse of charging: it names a payment rather than a

    customer, it can be partial and repeated until the payment is exhausted, and a caller that can

    charge is not automatically a caller that may give money back. Keeping it its own contract lets a

    provider that cannot refund simply not implement it, and lets a composition root grant the two

    capabilities separately.

    </p>

    <p>

    <b>What it does not do is claw back a payee.</b> Money already transferred to a payee is the

    caller's problem to reconcile — by netting it off what the payee is owed next, which is a

    decision only the caller can make. A provider API that reverses a transfer exists, but using it

    would take money out of an account the payee may have already spent from.

    </p>
  example: []
  syntax:
    content: public interface IPaymentRefundClient
    content.vb: Public Interface IPaymentRefundClient
  derivedClasses:
  - NuvTools.Payment.Stripe.ApiClient.Services.StripeRefundApiClient
