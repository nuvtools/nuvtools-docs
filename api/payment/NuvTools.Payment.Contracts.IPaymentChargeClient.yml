- uid: NuvTools.Payment.Contracts.IPaymentChargeClient
  commentId: T:NuvTools.Payment.Contracts.IPaymentChargeClient
  id: IPaymentChargeClient
  parent: NuvTools.Payment.Contracts
  children:
  - NuvTools.Payment.Contracts.IPaymentChargeClient.ChargeAsync(NuvTools.Payment.DTOs.Requests.PaymentChargeRequest,System.Threading.CancellationToken)
  - NuvTools.Payment.Contracts.IPaymentChargeClient.TransferAsync(NuvTools.Payment.DTOs.Requests.PaymentTransferRequest,System.Threading.CancellationToken)
  langs:
  - csharp
  - vb
  name: IPaymentChargeClient
  nameWithType: IPaymentChargeClient
  fullName: NuvTools.Payment.Contracts.IPaymentChargeClient
  type: Interface
  assemblies:
  - NuvTools.Payment
  namespace: NuvTools.Payment.Contracts
  summary: 'Moving money: charging a customer, and paying a payee.'
  remarks: >-
    The two are separate calls on purpose. One charge can pay several payees, and a payee is paid for

    what was billed rather than for what each customer happened to pay — a customer who has not paid

    is a debt the platform carries, while a payee paid twice is a mistake nobody can take back.
  example: []
  syntax:
    content: public interface IPaymentChargeClient
    content.vb: Public Interface IPaymentChargeClient
  derivedClasses:
  - NuvTools.Payment.Stripe.ApiClient.Services.StripeChargeApiClient
- uid: NuvTools.Payment.Contracts.IPaymentChargeClient.ChargeAsync(NuvTools.Payment.DTOs.Requests.PaymentChargeRequest,System.Threading.CancellationToken)
  commentId: M:NuvTools.Payment.Contracts.IPaymentChargeClient.ChargeAsync(NuvTools.Payment.DTOs.Requests.PaymentChargeRequest,System.Threading.CancellationToken)
  id: ChargeAsync(NuvTools.Payment.DTOs.Requests.PaymentChargeRequest,System.Threading.CancellationToken)
  parent: NuvTools.Payment.Contracts.IPaymentChargeClient
  langs:
  - csharp
  - vb
  name: ChargeAsync(PaymentChargeRequest, CancellationToken)
  nameWithType: IPaymentChargeClient.ChargeAsync(PaymentChargeRequest, CancellationToken)
  fullName: NuvTools.Payment.Contracts.IPaymentChargeClient.ChargeAsync(NuvTools.Payment.DTOs.Requests.PaymentChargeRequest, System.Threading.CancellationToken)
  type: Method
  assemblies:
  - NuvTools.Payment
  namespace: NuvTools.Payment.Contracts
  summary: >-
    Charges a saved payment method off-session — nobody is at a keyboard when a month is billed —

    and returns what the provider made of it.
  example: []
  syntax:
    content: Task<IResult<PaymentDTO>> ChargeAsync(PaymentChargeRequest request, CancellationToken cancellationToken = default)
    parameters:
    - id: request
      type: NuvTools.Payment.DTOs.Requests.PaymentChargeRequest
      description: Who is charged, how much, and the key that makes a retry safe.
    - id: cancellationToken
      type: System.Threading.CancellationToken
      description: Cancels the call.
    return:
      type: System.Threading.Tasks.Task{NuvTools.Common.ResultWrapper.IResult{NuvTools.Payment.DTOs.PaymentDTO}}
    content.vb: Function ChargeAsync(request As PaymentChargeRequest, cancellationToken As CancellationToken = Nothing) As Task(Of IResult(Of PaymentDTO))
  overload: NuvTools.Payment.Contracts.IPaymentChargeClient.ChargeAsync*
