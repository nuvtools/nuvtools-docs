- uid: NuvTools.Payment.PaymentMoney.ToMinorUnits(System.Decimal,System.Byte)
  commentId: M:NuvTools.Payment.PaymentMoney.ToMinorUnits(System.Decimal,System.Byte)
  id: ToMinorUnits(System.Decimal,System.Byte)
  parent: NuvTools.Payment.PaymentMoney
  langs:
  - csharp
  - vb
  name: ToMinorUnits(decimal, byte)
  nameWithType: PaymentMoney.ToMinorUnits(decimal, byte)
  fullName: NuvTools.Payment.PaymentMoney.ToMinorUnits(decimal, byte)
  type: Method
  assemblies:
  - NuvTools.Payment
  namespace: NuvTools.Payment
  summary: >-
    The amount in minor units, rounded half away from zero at the currency's own place. Round once

    and on the total, never on a unit price: rounding twice is how a total stops matching its

    lines.
  example: []
  syntax:
    content: public static long ToMinorUnits(decimal amount, byte minorUnits)
    parameters:
    - id: amount
      type: System.Decimal
      description: The amount to convert.
    - id: minorUnits
      type: System.Byte
      description: "The currency's ISO 4217 places: 2 for BRL, 0 for JPY, 3 for KWD."
    return:
      type: System.Int64
    content.vb: Public Shared Function ToMinorUnits(amount As Decimal, minorUnits As Byte) As Long
