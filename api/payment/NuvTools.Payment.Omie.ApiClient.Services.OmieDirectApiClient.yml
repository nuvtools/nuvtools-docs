  name: OmieDirectApiClient
  nameWithType: OmieDirectApiClient
  fullName: NuvTools.Payment.Omie.ApiClient.Services.OmieDirectApiClient
  type: Class
  assemblies:
  - NuvTools.Payment.Omie.ApiClient
  namespace: NuvTools.Payment.Omie.ApiClient.Services
  summary: >-
    Raw call to the Omie API, for the registrations <xref href="NuvTools.Payment.Omie.ApiClient.Contracts.IOmieApiClient" data-throw-if-not-resolved="false"></xref> does not cover or covers

    without the fields a caller needs. It concentrates three details that any new call would otherwise repeat:


    <ol><li>the <code>Content-Type</code> goes <b>without</b> the <code>charset</code> parameter — with it, the Omie gateway

    answers a SOAP "Bad Request" envelope (and that is exactly what <code>PostAsJsonAsync</code>/<code>JsonContent</code> would

    send);</li><li>business errors come in the body (<code>faultstring</code>) alongside an HTTP 5xx — without reading it, the

    failure turns into an "InternalServerError" that says nothing;</li><li>consumption refusals (<code>REDUNDANT</code>, <code>MISUSE_API_PROCESS</code>) are not request errors and get their own

    treatment (see <xref href="NuvTools.Payment.Omie.ApiClient.OmieFaultClassifier.IsThrottled(System.String)" data-throw-if-not-resolved="false"></xref>).</li></ol>
  example: []
