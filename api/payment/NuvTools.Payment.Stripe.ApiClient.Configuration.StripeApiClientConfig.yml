- uid: NuvTools.Payment.Stripe.ApiClient.Configuration.StripeApiClientConfig.ConnectCapabilities
  commentId: P:NuvTools.Payment.Stripe.ApiClient.Configuration.StripeApiClientConfig.ConnectCapabilities
  id: ConnectCapabilities
  parent: NuvTools.Payment.Stripe.ApiClient.Configuration.StripeApiClientConfig
  langs:
  - csharp
  - vb
  name: ConnectCapabilities
  nameWithType: StripeApiClientConfig.ConnectCapabilities
  fullName: NuvTools.Payment.Stripe.ApiClient.Configuration.StripeApiClientConfig.ConnectCapabilities
  type: Property
  assemblies:
  - NuvTools.Payment.Stripe.ApiClient
  namespace: NuvTools.Payment.Stripe.ApiClient.Configuration
  summary: >-
    The capabilities requested for a connected account, by Stripe's own names —

    <code>transfers</code>, <code>card_payments</code>. Empty requests <code>transfers</code> alone, the least an

    account that is paid by transfer needs.
  remarks: >-
    Stripe decides per country which combinations it accepts: Brazil, for one, refuses

    <code>transfers</code> without <code>card_payments</code>. An application that onboards payees there lists

    both; the default stays the minimum, so nobody is asked for more than their country requires.

    Left empty rather than defaulted to a list, because configuration appends to a list that

    already holds something.
  example: []
  syntax:
    content: public IList<string> ConnectCapabilities { get; }
    parameters: []
    return:
      type: System.Collections.Generic.IList{System.String}
    content.vb: Public ReadOnly Property ConnectCapabilities As IList(Of String)
  overload: NuvTools.Payment.Stripe.ApiClient.Configuration.StripeApiClientConfig.ConnectCapabilities*
- uid: NuvTools.Payment.Stripe.ApiClient.Configuration.StripeApiClientConfig.PaymentMethodTypes
