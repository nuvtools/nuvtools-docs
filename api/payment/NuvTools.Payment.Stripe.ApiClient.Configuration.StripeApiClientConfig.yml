  name: PaymentMethodTypes
  nameWithType: StripeApiClientConfig.PaymentMethodTypes
  fullName: NuvTools.Payment.Stripe.ApiClient.Configuration.StripeApiClientConfig.PaymentMethodTypes
  type: Property
  assemblies:
  - NuvTools.Payment.Stripe.ApiClient
  namespace: NuvTools.Payment.Stripe.ApiClient.Configuration
  summary: >-
    The payment methods a customer may save on the hosted page, by Stripe's own names —

    <code>card</code>, <code>sepa_debit</code>. Empty leaves the choice to what the Stripe account has enabled

    for the currency of the request.
  remarks: >-
    Named by an application that can only use some of them afterwards: one that charges

    off-session, or shows the saved method as a brand and four digits, lists <code>card</code>.
  example: []
  syntax:
    content: public IList<string> PaymentMethodTypes { get; }
    parameters: []
    return:
      type: System.Collections.Generic.IList{System.String}
    content.vb: Public ReadOnly Property PaymentMethodTypes As IList(Of String)
  overload: NuvTools.Payment.Stripe.ApiClient.Configuration.StripeApiClientConfig.PaymentMethodTypes*
