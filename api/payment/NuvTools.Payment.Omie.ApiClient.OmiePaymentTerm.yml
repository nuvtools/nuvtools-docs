- uid: NuvTools.Payment.Omie.ApiClient.OmiePaymentTerm.CustomInstallments
  commentId: F:NuvTools.Payment.Omie.ApiClient.OmiePaymentTerm.CustomInstallments
  id: CustomInstallments
  parent: NuvTools.Payment.Omie.ApiClient.OmiePaymentTerm
  langs:
  - csharp
  - vb
  name: CustomInstallments
  nameWithType: OmiePaymentTerm.CustomInstallments
  fullName: NuvTools.Payment.Omie.ApiClient.OmiePaymentTerm.CustomInstallments
  type: Field
  assemblies:
  - NuvTools.Payment.Omie.ApiClient
  namespace: NuvTools.Payment.Omie.ApiClient
  summary: >-
    Installments defined by the integrator (<code>999</code>) — the only code under which Omie accepts the

    <code>Parcelas</code> structure. Any service order that sends an explicit installment must use this code.


    <p>

    Sending another code alongside the installments passes <code>IncluirOS</code> — Omie stores the order already

    with <code>999</code> — but <code>AlterarOS</code> refuses it: "A estrutura de parcelas [Parcelas] está disponível

    apenas para o Código de Parcelamento [cCodParc=999]!". An order included that way only fails on its first

    change, much later.

    </p>
  example: []
  syntax:
    content: public const string CustomInstallments = "999"
    return:
      type: System.String
    content.vb: Public Const CustomInstallments As String = "999"
