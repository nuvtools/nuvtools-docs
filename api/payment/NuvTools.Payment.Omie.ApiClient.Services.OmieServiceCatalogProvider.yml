  name: OmieServiceCatalogProvider
  nameWithType: OmieServiceCatalogProvider
  fullName: NuvTools.Payment.Omie.ApiClient.Services.OmieServiceCatalogProvider
  type: Class
  assemblies:
  - NuvTools.Payment.Omie.ApiClient
  namespace: NuvTools.Payment.Omie.ApiClient.Services
  summary: >-
    Omie service catalog, read whole (<code>ListarCadastroServico</code>, paginated) and indexed by the business code

    (<code>cCodigo</code>) — the code applications store in their own configuration. This is how the <code>nCodServico</code>,

    the description and the unit price of a service are discovered: Omie exposes no search by <code>cCodigo</code>, so the

    catalog is listed and searched in memory.


    <p>

    The result is cached for <xref href="NuvTools.Payment.Omie.ApiClient.Services.OmieServiceCatalogProvider.CacheDuration" data-throw-if-not-resolved="false"></xref> because Omie refuses repeated <code>ListarCadastroServico</code>

    calls in a short window ("Consumo redundante detectado") — without the cache, opening a screen and generating a

    service order right after would drop the second call.

    </p>
  example: []
  syntax:
    content: public class OmieServiceCatalogProvider
    content.vb: Public Class OmieServiceCatalogProvider
