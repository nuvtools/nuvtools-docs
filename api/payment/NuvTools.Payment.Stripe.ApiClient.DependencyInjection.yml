- uid: NuvTools.Payment.Stripe.ApiClient.DependencyInjection.AddStripeApiClient(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration)
  commentId: M:NuvTools.Payment.Stripe.ApiClient.DependencyInjection.AddStripeApiClient(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration)
  id: AddStripeApiClient(Microsoft.Extensions.DependencyInjection.IServiceCollection,Microsoft.Extensions.Configuration.IConfiguration)
  isExtensionMethod: true
  parent: NuvTools.Payment.Stripe.ApiClient.DependencyInjection
  langs:
  - csharp
  - vb
  name: AddStripeApiClient(IServiceCollection, IConfiguration)
  nameWithType: DependencyInjection.AddStripeApiClient(IServiceCollection, IConfiguration)
  fullName: NuvTools.Payment.Stripe.ApiClient.DependencyInjection.AddStripeApiClient(Microsoft.Extensions.DependencyInjection.IServiceCollection, Microsoft.Extensions.Configuration.IConfiguration)
  type: Method
  assemblies:
  - NuvTools.Payment.Stripe.ApiClient
  namespace: NuvTools.Payment.Stripe.ApiClient
  summary: >-
    Binds the <code>Stripe</code> configuration section and registers Stripe behind the

    <code>NuvTools.Payment</code> contracts — the customer, payee account, charge, refund and webhook

    clients.
  remarks: >-
    <p>

    This is the only place a caller names Stripe: everything above it depends on

    <xref href="NuvTools.Payment.Contracts.IPaymentCustomerClient" data-throw-if-not-resolved="false"></xref> and its siblings, so changing provider is changing this

    call.

    </p>

    <p>

    The SDK's client is built over an <xref href="System.Net.Http.HttpClient" data-throw-if-not-resolved="false"></xref> from the factory, so the host's own

    handlers and logging apply, and its retries are the SDK's: it knows which calls are safe to

    repeat and sends the idempotency key again when it repeats one.

    </p>
  example: []
  syntax:
    content: public static IServiceCollection AddStripeApiClient(this IServiceCollection services, IConfiguration configuration)
    parameters:
    - id: services
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
      description: The container.
    - id: configuration
      type: Microsoft.Extensions.Configuration.IConfiguration
      description: Where the <code>Stripe</code> section is read from.
    return:
      type: Microsoft.Extensions.DependencyInjection.IServiceCollection
    content.vb: Public Shared Function AddStripeApiClient(services As IServiceCollection, configuration As IConfiguration) As IServiceCollection
  overload: NuvTools.Payment.Stripe.ApiClient.DependencyInjection.AddStripeApiClient*
