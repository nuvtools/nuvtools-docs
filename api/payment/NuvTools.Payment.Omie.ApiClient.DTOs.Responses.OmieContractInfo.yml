  summary: >-
    A Service Contract of Omie as callers consume it: the number the user knows, the validity period and the

    negotiated value, with the dates already parsed. Projected from the listing so no caller has to deal with Omie's

    dd/MM/yyyy strings or with which key carries what.
  example: []
  syntax:
    content: public OmieContractInfo(long ContractCode, string? ContractNumber, long ClientCode, DateOnly? ValidFrom, DateOnly? ValidTo, decimal? MonthlyValue, IReadOnlyDictionary<long, decimal> UnitValueByServiceCode)
    parameters:
    - id: ContractCode
      type: System.Int64
      description: Omie's internal identifier (nCodCtr).
    - id: ContractNumber
      type: System.String
      description: The contract number as the user reads it in Omie (cNumCtr).
    - id: ClientCode
      type: System.Int64
      description: Client the contract belongs to (nCodCli).
    - id: ValidFrom
      type: System.Nullable{System.DateOnly}
      description: Start of the validity period; null when Omie sent none.
    - id: ValidTo
      type: System.Nullable{System.DateOnly}
      description: End of the validity period; null on contracts with no end date.
    - id: MonthlyValue
      type: System.Nullable{System.Decimal}
      description: Negotiated monthly value; null when Omie sent none.
    - id: UnitValueByServiceCode
      type: System.Collections.Generic.IReadOnlyDictionary{System.Int64,System.Decimal}
      description: >-
        Negotiated unit price of each service in the contract, keyed by Omie's service identifier (<code>nCodServico</code>) —

        the same key the service catalog uses, so a caller holding a service code can ask what this client pays for it.

        Empty when the contract carries no items.
