    content: public HostedPaymentMethodPageRequest(string CustomerId, string SuccessUrl, string CancelUrl, string? CurrencyCode = null)
    parameters:
    - id: CustomerId
      type: System.String
      description: Whose payment method is being saved.
    - id: SuccessUrl
      type: System.String
      description: Where the provider returns the customer once they have saved one.
    - id: CancelUrl
      type: System.String
      description: Where it returns them if they give up.
    - id: CurrencyCode
      type: System.String
      description: >-
        ISO 4217, in any case: the currency the customer will later be charged in. Nothing is charged on

        this page, but a provider offers only the methods that can pay in that currency, and only the

        caller knows which it is. Null when the caller does not know yet; a provider that cannot choose

        without it answers a failure saying so.
