    - id: Number
      type: System.String
      description: Number of the authorized NFS-e (<code>nNfse</code>). Empty until the city hall authorizes it.
    - id: RpsStatus
      type: System.String
      description: RPS status (<code>cStatusRps</code>) — see <xref href="NuvTools.Payment.Omie.ApiClient.DTOs.Responses.OmieInvoiceRpsStatus" data-throw-if-not-resolved="false"></xref>.
    - id: BatchStatus
      type: System.String
      description: Submission batch status (<code>cStatusLote</code>), using the same codes as the RPS.
    - id: VerificationCode
      type: System.String
      description: NFS-e verification code (<code>cCodVerif</code>).
    - id: Url
      type: System.String
      description: Link to the invoice on the city hall site (<code>cUrlNfse</code>).
    - id: Message
      type: System.String
      description: City hall/Omie messages about the RPS, concatenated — the reason, when it was rejected.
